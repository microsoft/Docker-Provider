apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-autoinstrumented-example
  namespace: replace-with-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-autoinstrumented-example
  template:
    metadata:
      labels:
        app: java-autoinstrumented-example
      annotations:
        instrumentation.opentelemetry.io/inject-java: "cr1"
        # Optional: remove when Container Insights already collects these logs to avoid duplicate ingestion and cost.
        monitor.azure.com/enable-application-logs: "true"
    spec:
      containers:
        - name: application
          image: contoso.azurecr.io/replace-with-your-java-image:tag
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-autoinstrumented-example
  namespace: replace-with-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-autoinstrumented-example
  template:
    metadata:
      labels:
        app: nodejs-autoinstrumented-example
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "cr1"
        # Optional: remove when Container Insights already collects these logs to avoid duplicate ingestion and cost.
        monitor.azure.com/enable-application-logs: "true"
    spec:
      containers:
        - name: application
          image: contoso.azurecr.io/replace-with-your-nodejs-image:tag
