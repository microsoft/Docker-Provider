apiVersion: v1
kind: ServiceAccount
metadata:
    name: ama-logs
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: ama-logs-reader
rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - events
        - nodes
        - nodes/stats
        - nodes/metrics
        - nodes/spec
        - nodes/proxy
        - namespaces
        - services
        - persistentvolumes
      verbs:
        - list
        - get
        - watch
    - apiGroups:
        - apps
        - extensions
        - autoscaling
      resources:
        - replicasets
        - deployments
        - horizontalpodautoscalers
      verbs:
        - list
    - apiGroups:
        - ""
      resourceNames:
        - ama-logs-secret
      resources:
        - secrets
      verbs:
        - get
        - watch
    - nonResourceURLs:
        - /metrics
      verbs:
        - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: amalogsclusterrolebinding
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: ama-logs-reader
subjects:
    - kind: ServiceAccount
      name: ama-logs
      namespace: kube-system

---
apiVersion: v1
data:
    kube.conf: |-
        <source>
         type forward
         port "#{ENV['HEALTHMODEL_REPLICASET_SERVICE_SERVICE_PORT']}"
         bind 0.0.0.0
         chunk_size_limit 4m
        </source>

        <source>
         type kubepodinventory
         tag oms.containerinsights.KubePodInventory
         run_interval 60
         log_level debug
        </source>

        <source>
         type kubepvinventory
         tag oms.containerinsights.KubePVInventory
         run_interval 60
         log_level debug
        </source>

        <source>
         type kubeevents
         tag oms.containerinsights.KubeEvents
         run_interval 60
         log_level debug
        </source>

        <source>
         type kubenodeinventory
         tag oms.containerinsights.KubeNodeInventory
         run_interval 60
         log_level debug
        </source>
        <source>
         type kubehealth
         tag kubehealth.ReplicaSet
         run_interval 60
         log_level debug
        </source>

        <source>
         type wincadvisorperf
         tag oms.api.wincadvisorperf
         run_interval 60
         log_level debug
        </source>

        <source>
         type kubestatedeployments
         tag oms.containerinsights.KubeStateDeployments
         run_interval 60
         log_level debug
        </source>

        <source>
         type kubestatehpa
         tag oms.containerinsights.KubeStateHpa
         run_interval 60
         log_level debug
        </source>

        <filter mdm.kubenodeinventory**>
         type filter_inventory2mdm
         log_level info
        </filter>

        <filter mdm.cadvisorperf**>
         type filter_cadvisor2mdm
         metrics_to_collect cpuUsageNanoCores,memoryWorkingSetBytes,pvUsedBytes
         log_level info
        </filter>
        <filter kubehealth**>
         type filter_health_model_builder
        </filter>

        <match oms.containerinsights.KubePodInventory**>
         type out_oms
         log_level debug
         num_threads 2
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_kubepods*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match oms.containerinsights.KubePVInventory**>
         type out_oms
         log_level debug
         num_threads 5
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/state/out_oms_kubepv*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match oms.containerinsights.KubeEvents**>
         type out_oms
         log_level debug
         num_threads 2
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_kubeevents*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match oms.containerinsights.KubeServices**>
         type out_oms
         log_level debug
         num_threads 2
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_kubeservices*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match oms.containerinsights.KubeNodeInventory**>
         type out_oms
         log_level debug
         num_threads 2
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/state/out_oms_kubenodes*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>
        <match oms.containerinsights.ContainerNodeInventory**>
         type out_oms
         log_level debug
         num_threads 3
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_containernodeinventory*.buffer
         buffer_queue_limit 20
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match oms.api.KubePerf**>
         type out_oms
         log_level debug
         num_threads 2
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_kubeperf*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match mdm.kubepodinventory** mdm.kubenodeinventory** >
         type out_mdm
         log_level debug
         num_threads 5
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_mdm_*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
         retry_mdm_post_wait_minutes 30
        </match>

        <match oms.api.wincadvisorperf**>
         type out_oms
         log_level debug
         num_threads 5
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_api_wincadvisorperf*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>

        <match mdm.cadvisorperf**>
         type out_mdm
         log_level debug
         num_threads 5
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_mdm_cdvisorperf*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
         retry_mdm_post_wait_minutes 30
        </match>
        <match kubehealth.Signals**>
         type out_oms
         log_level debug
         num_threads 5
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_kubehealth*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>
        <match oms.api.InsightsMetrics**>
         type out_oms
         log_level debug
         num_threads 5
         buffer_chunk_limit 4m
         buffer_type file
         buffer_path %STATE_DIR_WS%/out_oms_insightsmetrics*.buffer
         buffer_queue_limit 20
         buffer_queue_full_action drop_oldest_chunk
         flush_interval 20s
         retry_limit 10
         retry_wait 5s
         max_retry_wait 5m
        </match>
