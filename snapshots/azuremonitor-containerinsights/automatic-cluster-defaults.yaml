---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        component: ama-logs-agent
        kubernetes.azure.com/managedby: aks
        tier: node
    name: ama-logs-rs
    namespace: kube-system
spec:
    paused: false
    replicas: 1
    revisionHistoryLimit: 2
    selector:
        matchLabels:
            rsName: ama-logs-rs
    strategy:
        type: RollingUpdate
    template:
        metadata:
            annotations:
                WSID: dGVzdC13b3Jrc3BhY2UtaWQ=
                agentVersion: azure-mdsd-1.37.0
                cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
                dockerProviderVersion: 18.0.1-0
                kubernetes.azure.com/no-http-proxy-vars: "true"
                schema-versions: v1
            labels:
                kubernetes.azure.com/managedby: aks
                rsName: ama-logs-rs
        spec:
            affinity:
                nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - preference:
                            matchExpressions:
                                - key: kubernetes.azure.com/mode
                                  operator: In
                                  values:
                                    - system
                          weight: 100
                        - preference:
                            matchExpressions:
                                - key: storageprofile
                                  operator: NotIn
                                  values:
                                    - managed
                          weight: 1
                    requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                            - matchExpressions:
                                - key: kubernetes.io/os
                                  operator: In
                                  values:
                                    - linux
                                - key: kubernetes.azure.com/cluster
                                  operator: Exists
                                - key: type
                                  operator: NotIn
                                  values:
                                    - virtual-kubelet
            containers:
                - args:
                    - --secret-namespace=kube-system
                    - --secret-name=ama-logs-secret
                    - --token-server-listening-port=8888
                    - --health-server-listening-port=9999
                    - --restart-pod-waiting-minutes-on-broken-connection=240
                  command:
                    - /addon-token-adapter
                  env:
                    - name: AZMON_COLLECT_ENV
                      value: "false"
                  image: mcr.microsoft.com/aks/msi/addon-token-adapter:master.250902.1
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: 9999
                    initialDelaySeconds: 10
                    periodSeconds: 60
                  name: addon-token-adapter
                  resources:
                    limits:
                        cpu: 500m
                        memory: 500Mi
                    requests:
                        cpu: 100m
                        memory: 100Mi
                  securityContext:
                    capabilities:
                        add:
                            - NET_ADMIN
                            - NET_RAW
                        drop:
                            - ALL
                - env:
                    - name: NUM_OF_FLUENTD_WORKERS
                      valueFrom:
                        resourceFieldRef:
                            containerName: ama-logs
                            resource: limits.cpu
                    - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
                      valueFrom:
                        resourceFieldRef:
                            containerName: ama-logs
                            resource: limits.memory
                    - name: NODE_IP
                      valueFrom:
                        fieldRef:
                            fieldPath: status.hostIP
                    - name: AKS_CLUSTER_NAME
                      value: test-cluster
                    - name: AKS_RESOURCE_ID
                      value: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.ContainerService/managedClusters/test-cluster
                    - name: AKS_NODE_RESOURCE_GROUP
                      value: MC_test-rg_test-cluster_eastus
                    - name: AKS_REGION
                      value: eastus
                    - name: USER_ASSIGNED_IDENTITY_CLIENT_ID
                      value: test-identity-client-id
                    - name: CONTROLLER_TYPE
                      value: ReplicaSet
                    - name: HOSTNAME
                      valueFrom:
                        fieldRef:
                            fieldPath: spec.nodeName
                    - name: SIDECAR_SCRAPING_ENABLED
                      value: "true"
                    - name: USING_AAD_MSI_AUTH
                      value: "true"
                    - name: APPMONITORING_AUTOINSTRUMENTATION_ENABLED
                      value: "false"
                    - name: PROMETHEUS_METRICS_SCRAPING_DISABLED
                      value: "false"
                    - name: AZMON_TELEGRAF_LIVENESSPROBE_ENABLED
                      value: "false"
                    - name: AZMON_WINDOWS_FLUENT_BIT_ENABLED
                      value: "false"
                    - name: CLUSTER_CLOUD_ENVIRONMENT
                      value: azurepubliccloud
                  image: mcr.microsoft.com/azuremonitor/containerinsights/ciprod:3.1.35
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    exec:
                        command:
                            - /bin/bash
                            - -c
                            - /opt/livenessprobe.sh
                    initialDelaySeconds: 60
                    periodSeconds: 60
                    timeoutSeconds: 15
                  name: ama-logs
                  ports:
                    - containerPort: 25225
                      protocol: TCP
                    - containerPort: 25224
                      protocol: UDP
                    - containerPort: 25227
                      name: in-rs-tcp
                      protocol: TCP
                  resources:
                    limits:
                        cpu: "1"
                        memory: 1.5Gi
                    requests:
                        cpu: 150m
                        memory: 250Mi
                  securityContext:
                    capabilities:
                        add:
                            - DAC_OVERRIDE
                        drop:
                            - ALL
                    privileged: true
                  volumeMounts:
                    - mountPath: /var/log
                      name: host-log
                    - mountPath: /etc/kubernetes/host
                      name: azure-json-path
                    - mountPath: /etc/ama-logs-secret
                      name: ama-logs-secret
                      readOnly: true
                    - mountPath: /etc/omsagent-secret
                      name: ama-logs-secret
                      readOnly: true
                    - mountPath: /etc/config
                      name: ama-logs-rs-config
                    - mountPath: /etc/config/settings
                      name: settings-vol-config
                      readOnly: true
                    - mountPath: /etc/config/settings/adx
                      name: ama-logs-adx-secret
                      readOnly: true
                    - mountPath: /etc/config/osm-settings
                      name: osm-settings-vol-config
                      readOnly: true
            priorityClassName: system-node-critical
            serviceAccountName: ama-logs
            tolerations:
                - key: CriticalAddonsOnly
                  operator: Exists
            volumes:
                - hostPath:
                    path: /etc/hostname
                  name: container-hostname
                - hostPath:
                    path: /var/log
                  name: host-log
                - hostPath:
                    path: /etc/kubernetes
                  name: azure-json-path
                - name: ama-logs-secret
                  secret:
                    secretName: ama-logs-secret
                - configMap:
                    name: ama-logs-rs-config
                  name: ama-logs-rs-config
                - configMap:
                    name: container-azm-ms-agentconfig
                    optional: true
                  name: settings-vol-config
                - name: ama-logs-adx-secret
                  secret:
                    optional: true
                    secretName: ama-logs-adx-secret
                - configMap:
                    name: container-azm-ms-osmconfig
                    optional: true
                  name: osm-settings-vol-config

