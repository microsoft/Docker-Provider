# Telegraf Configuration for Windows Nano Server
# Basic configuration without TOML parsing

[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Output to stdout for now (can be changed to TCP when Fluent Bit TCP input is configured)
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"

# Optional: Output to TCP socket for Fluent Bit to consume (disabled for now)
# [[outputs.socket_writer]]
#   address = "tcp://127.0.0.1:25229"
#   data_format = "prometheus"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# Basic CPU metrics
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Basic memory metrics  
[[inputs.mem]]

# Basic disk metrics
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Basic network metrics
[[inputs.net]]

# Kubernetes API input for pod discovery (will be enabled when prometheus scraping is configured)
# [[inputs.kubernetes]]
#   url = "https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT"
#   bearer_token_string = "$BEARER_TOKEN"
#   insecure_skip_verify = true

