    # =============================================================================
    # Stage 3: Deploy ama-logs to AKS Clusters via Helm
    # =============================================================================
    # To add a new cluster, simply add an entry to the template list below.
    # Each cluster only needs: clusterName, resourceGroup, region, subscriptionId
    # =============================================================================
    - stage: Stage_3
      displayName: Deploy ama-logs to AKS Clusters via Helm
      #dependsOn:
      #- Stage_2
      dependsOn:
        - SDLSources
      pool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-ubuntu-2204
        os: linux
      jobs:
      # Cluster 1: UK South (zane-test3)
      - template: .pipelines/templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'zane-test3'
          resourceGroup: 'zane-test'
          region: 'uksouth'
          subscriptionId: '9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb'
          workspaceId: '0701eb41-2080-4712-8769-c9b03837b8fa'
          #imageTag: '$(AgentImageTagSuffix)'
          imageTag: 3.1.32

      # =========================================================================
      # To add more clusters, copy and paste the template block below:
      # Required parameters:
      #   - clusterName: AKS cluster name
      #   - resourceGroup: Resource group containing the cluster
      #   - region: Azure region (e.g., 'eastus', 'westeurope')
      #   - subscriptionId: Azure subscription ID
      #   - workspaceId: Log Analytics workspace ID (GUID)
      #   - imageTag: Image version (use $(AgentImageTagSuffix) for current release)
      # =========================================================================
      # - template: templates/ama-logs-helm-deploy.yaml
      #   parameters:
      #     clusterName: 'your-cluster-name'
      #     resourceGroup: 'your-resource-group'
      #     region: 'your-region'
      #     subscriptionId: 'your-subscription-id'
      #     workspaceId: 'your-workspace-id'
      #     imageTag: '$(AgentImageTagSuffix)'
      # =========================================================================
