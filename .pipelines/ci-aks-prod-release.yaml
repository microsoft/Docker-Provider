trigger: none
name: $(Date:yyyyMMdd).$(Rev:r)
variables:
- name: ACRName
  value: $(VAR_ACR_NAME)
- name: AgentImageTagSuffix
  value: $(VAR_AGENT_IMAGE_TAG_SUFFIX)
- name: AgentRelease
  value: $(VAR_AGENT_RELEASE)
- name: AKSEngineCluster
  value: $(VAR_AKS_ENGINE_CLUSTER)
- name: AKSEngineClusterKubeConfigSecretName
  value: $(VAR_AKS_ENGINE_CLUSTER_KUBECONFIG_SECRET_NAME)
- name: AKSScaleClusterKubeConfigSecretName
  value: $(VAR_AKS_SCALE_CLUSTER_KUBECONFIG_SECRET_NAME)
- name: AKSScaleClusterRegion
  value: $(VAR_AKS_SCALE_CLUSTER_REGION)
- name: AKSScaleClusterResourceId
  value: $(VAR_AKS_SCALE_CLUSTER_RESOURCE_ID)
- name: CDPXLinuxACR
  value: $(VAR_CDPX_LINUX_ACR)
- name: CDPXLinuxRegistry
  value: $(VAR_CDPX_LINUX_REGISTRY)
- name: CDPXLinuxRepoName
  value: $(VAR_CDPX_LINUX_REPO_NAME)
- name: CDPXLinuxTag
  value: $(VAR_CDPX_LINUX_TAG)
- name: CDPXWindowsACR
  value: $(VAR_CDPX_WINDOWS_ACR)
- name: CDPXWindowsRegistry
  value: $(VAR_CDPX_WINDOWS_REGISTRY)
- name: CDPXWindowsRepoName
  value: $(VAR_CDPX_WINDOWS_REPO_NAME)
- name: CDPXWindowsTag
  value: $(VAR_CDPX_WINDOWS_TAG)
- name: CIKV
  value: $(VAR_CIKV)
- name: CIRelease
  value: $(VAR_CI_RELEASE)
- name: ClusterRegion
  value: $(VAR_CLUSTER_REGION)
- name: ClusterResourceId
  value: $(VAR_CLUSTER_RESOURCE_ID)
- name: ManagedIdentity
  value: $(VAR_MANAGED_IDENTITY)
- name: OverrideTag
  value: $(VAR_OVERRIDE_TAG)
- name: ServiceTreeGuid
  value: $(VAR_SERVICE_TREE_GUID)
- name: UserAssignedIdentityClientId
  value: $(VAR_USER_ASSIGNED_IDENTITY_CLIENT_ID)
- name: WorkspaceResourceId
  value: $(VAR_WORKSPACE_RESOURCE_ID)
resources:
  containers: []
  pipelines:
  - pipeline: '_ci-aks-prod-release'
    project: 'microsoft'
    source: 'CDPX\docker-provider\ContainerInsights-MultiArch-MergedBranches'
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-windows-2022
        os: windows
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: Stage_1
      displayName: 'Note: Use Build with Telemetry Tag defined'
      trigger: manual
      pool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-ubuntu-2204
        os: linux
      jobs:
      - job: Job_1
        displayName: Agent job
        condition: succeeded()
        timeoutInMinutes: '0'
        variables:
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: Codeql.SkipTaskAutoInjection
          value: true
        - name: skipComponentGovernanceDetection
          value: false
        - name: OneES_targetName
          value: host
        steps:
        - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
          inputs:
            repository: self
            persistCredentials: true
        - task: DownloadPipelineArtifact@2
          displayName: ⏬ Pipeline Artifact Download
          inputs:
            buildType: specific
            project: $(resources.pipeline._ci-aks-prod-release.projectID)
            definition: $(resources.pipeline._ci-aks-prod-release.pipelineID)
            allowFailedBuilds: false
            buildVersionToDownload: specific
            pipelineId: $(resources.pipeline._ci-aks-prod-release.runID)
            pipeline: _ci-aks-prod-release
          target:
            container: host
        - task: 1ESGPTRunTask@3.0.376
          displayName: Validate Hosted Pool Information (1ES PT)
          continueOnError: false
          target:
            container: host
          env:
            HOST_ARCHITECTURE: amd64
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_DEFINITIONID: $(System.DefinitionId)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
            BUILD_REPOSITORY_ID: $(Build.Repository.ID)
            BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
            PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
          inputs:
            repoId: microsoft/Docker-Provider
            path: validateHostedPool.ps1
            arguments: '-TargetName $(OneES_targetName) -StepTargets [] -StepsLength 1 -SkipStatelessValidation False -OS windows -IsOfficialTemplate -IgnoreProductionPoolCheck '
        - task: CodeQL3000Init@0
          displayName: "\U0001F6E1 CodeQL Initialize"
          condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
          target:
            container: host
          continueOnError: true
          inputs:
            Enabled: true
            BuildIdentifier: Stage_1_Job_1
            LanguageDetectorFilter: compiled
        - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
          displayName: 'Start Network Isolation'
          continueOnError: true
          timeoutInMinutes: 2
          inputs:
            networkIsolationMode: Enforce
        - task: Bash@3
          inputs:
            targetType: inline
            script: >
              echo 'Check that the build image you use has the telemetry tag defined'
          target:
            container: host
          displayName: Bash Script
        - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
          displayName: 'Stop Network Isolation'
          condition: always()
          continueOnError: true
          timeoutInMinutes: 2
          inputs:
            networkIsolationMode: Stop
        - task: CodeQL3000Finalize@0
          displayName: "\U0001F6E1 CodeQL Finalize"
          condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
          target:
            container: host
          continueOnError: true
    - stage: Stage_2
      displayName: Push Linux and Windows Agent
      dependsOn:
      - SDLSources
      pool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-ubuntu-2204
        os: linux
      jobs:
      - job: releaseGating
        displayName: Release Gating
        variables:
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: runCodesignValidationInjection
          value: false
        - name: Codeql.SkipTaskAutoInjection
          value: true
        - name: skipComponentGovernanceDetection
          value: true
        - name: skipNugetSecurityAnalysis
          value: true
        steps:
        - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
          condition: false
          inputs:
            repository: none
        - task: 1ESGPTRunTask@3.0.376
          displayName: Branch Validation (1ES PT)
          continueOnError: true
          target:
            container: host
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
            BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            BUILD_SOURCEBRANCH: $(Build.SourceBranch)
            BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
            BUILD_REPOSITORY_ID: $(Build.Repository.ID)
            BUILD_REPOSITORYPROVIDER: $(Build.Repository.Provider)
            BUILD_SOURCEVERSION: $(Build.SourceVersion)
            TASK_MODE: audit
          inputs:
            repoId: microsoft/Docker-Provider
            path: release_gating.py
      - job: approval
        variables:
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: ev2Environment
          value: Production
        - name: Ev2MonintoringUrl
          value: 'https://azureservicedeploy.msft.net/api/monitorrollout'
        displayName: Approval
        pool:
          name: server
        timeoutInMinutes: 7200
        dependsOn:
        - releaseGating
        steps:
        - task: ApprovalTask@1
          inputs:
            environment: $(ev2Environment)
            servicetreeguid: 3170cdd2-19f0-4027-912b-1027311691a2
      - job: Ev2_rollout_ev2_rollout
        displayName: Agent job - Ev2 Ev2 Rollout
        timeoutInMinutes: '0'
        condition: succeeded()
        dependsOn:
        - approval
        variables:
        - name: ev2Environment
          value: Production
        - name: Ev2MonintoringUrl
          value: https://azureservicedeploy.msft.net/api/monitorrollout
        - name: OneESPT.JobType
          value: releaseJob
          readonly: true
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: OneESPT.Workflow
          value: ev2-classic
          readonly: true
        - name: runCodesignValidationInjection
          value: false
        - name: Codeql.SkipTaskAutoInjection
          value: true
        - name: skipComponentGovernanceDetection
          value: true
        - name: skipNugetSecurityAnalysis
          value: true
        - name: OneES_targetName
          value: host
        steps:
        - task: 1ESGPTRunTask@3.0.376
          displayName: Validate Hosted Pool Information (1ES PT)
          continueOnError: false
          target:
            container: host
          env:
            HOST_ARCHITECTURE: amd64
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_DEFINITIONID: $(System.DefinitionId)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
            BUILD_REPOSITORY_ID: $(Build.Repository.ID)
            BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
            PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
            BUILD_REASON: $(Build.Reason)
          inputs:
            repoId: microsoft/Docker-Provider
            path: validateHostedPool.ps1
            arguments: -TargetName '' -StepTargets '' -StepsLength 0 -SkipStatelessValidation True -OS windows -IgnoreProductionPoolCheck  -IsOfficialTemplate -IsProductionReleasePipeline
        - task: DownloadPipelineArtifact@2
          displayName: ⏬ Pipeline Artifact Download
          inputs:
            buildType: specific
            project: $(resources.pipeline._ci-aks-prod-release.projectID)
            definition: $(resources.pipeline._ci-aks-prod-release.pipelineID)
            allowFailedBuilds: false
            buildVersionToDownload: specific
            pipelineId: $(resources.pipeline._ci-aks-prod-release.runID)
            pipeline: _ci-aks-prod-release
            targetPath: $(Pipeline.Workspace)/ev2Artifact
          target:
            container: host
        - task: AzureArtifacts.drop-validator-task.drop-validator-task.DropValidatorTask@0
          displayName: "\U0001F6E1 Validate SBoM Manifest (1ES PT)"
          condition: succeeded()
          continueOnError: False
          timeoutInMinutes: 30
          env:
            SBOMVALIDATOR_TEMPIGNOREMISSING: true
          inputs:
            BuildDropPath: $(Pipeline.Workspace)/ev2Artifact/linux-drop
            OutputPath: $(Agent.TempDirectory)/sbom_validation_results.json
            ValidateSignature: True
            Verbosity: 'Verbose'
        - task: 1ESGPTRunTask@3.0.376
          displayName: Post-SBoM Validation (1ES PT)
          continueOnError: true
          target:
            container: host
          condition: succeeded()
          env:
            OutputPath: $(Agent.TempDirectory)/sbom_validation_results.json
          inputs:
            repoId: microsoft/Docker-Provider
            path: post_sbom_validation.py
        - task: 1ESGPTRunTask@3.0.376
          displayName: Validate Source Build (1ES PT)
          continueOnError: false
          target:
            container: host
          env:
            BuildDropPath: $(Pipeline.Workspace)/ev2Artifact/linux-drop
            IsProduction: True
            OneES_ArtifactType: $(DownloadPipelineArtifactResourceTypes)
          inputs:
            repoId: microsoft/Docker-Provider
            path: validate_source_build.py
        - task: securedevelopmentteam.vss-secure-development-tools.build-task-codesignvalidation.CodeSign@1
          displayName: "\U0001F6E1 Guardian: CodeSign Validation"
          target:
            container: host
          condition: and(succeeded(), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'))
          continueOnError: true
          timeoutInMinutes: 10
          inputs:
            Path: $(Pipeline.Workspace)/ev2Artifact
            MaxThreads: $(OneES_UsableProcessorCount)
            FailIfNoTargetsFound: false
            ExcludePassesFromLog: False
            Targets: f|**\*.dll;f|**\*.exe;f|**\*.sys;f|**\*.ps1;f|**\*.psm1;f|**\*.ps1xml;f|**\*.psc1;f|**\*.psd1;f|**\*.cdxml;f|**\*.vbs;f|**\*.js;f|**\*.wsf;-|.gdn\**;
        - task: 1ESGPTRunTask@3.0.376
          displayName: "\U0001F6E1 Guardian: Check CodeSign Validation Results (1ES PT)"
          continueOnError: true
          target:
            container: host
          condition: and(succeeded(), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'))
          env:
            OneES_PipelineWorkspace: $(Pipeline.Workspace)
            OneES_DeleteCodeSignValidationResult: True
            OneES_CustomPolicyFile: ''
          inputs:
            repoId: microsoft/Docker-Provider
            path: check_csv_results.ps1
        - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
          condition: false
          inputs:
            repository: none
          target:
            container: host
        - task: Bash@3
          displayName: Set CDPX Linux Tag
          inputs:
            targetType: inline
            script: |
              # Write your commands here

              LINUX_TAG=$(jq '."image.name"' metadata.json | tr -d '"' | cut -d':' -f2)
              echo $LINUX_TAG

              set +x
              echo "##vso[task.setvariable variable=CDPXLinuxTag;]$LINUX_TAG"
              set -x
            workingDirectory: $(Pipeline.Workspace)/ev2Artifact/linux-drop/linux
            failOnStderr: true
        - task: Bash@3
          displayName: Set CDPX Windows Tag
          inputs:
            targetType: inline
            script: |+
              # Write your commands here

              WINDOWS_TAG=$(jq '."image.name"' metadata.json | tr -d '"' | cut -d':' -f2)
              echo $WINDOWS_TAG

              set +x
              echo "##vso[task.setvariable variable=CDPXWindowsTag;]$WINDOWS_TAG"
              set -x

            workingDirectory: $(Pipeline.Workspace)/ev2Artifact/windows-drop/windows
            failOnStderr: true
        - task: vsrm-ev2.vss-services-ev2.adm-release-task.ExpressV2Internal@1
          inputs:
            UseServerMonitorTask: true
            EndpointProviderType: ApprovalService
            ApprovalServiceEnvironment: $(ev2Environment)
            ServiceRootLocation: LinkedArtifact
            RolloutSpecType: RSPath
            ServiceRootPath: $(Pipeline.Workspace)/ev2Artifact/drop/build/mergebranch-multiarch-agent-deployment/ServiceGroupRoot
            RolloutSpecPath: $(Pipeline.Workspace)/ev2Artifact/drop/build/mergebranch-multiarch-agent-deployment/ServiceGroupRoot/RolloutSpecs/RolloutSpecs.json
            OutputRolloutId: RolloutId
            OutputServiceGroupName: ServiceGroupName
            OutputRolloutStatus: RolloutStatus
            InlineDynamicBindingOverrides: '{     "$schema": "https://ev2schema.azure.net/schemas/2020-01-01/scopeBindings.json",     "contentVersion": "0.0.0.1",     "scopeBindings": [                {             "scopeTagName": "Global",             "bindings": [                         {                     "find": "__ACR_NAME__",                     "replaceWith": "$(ACRName)"                 },                             {                     "find": "__AGENT_RELEASE__",                     "replaceWith": "$(AgentRelease)"                 },                  {                     "find": "__AGENT_IMAGE_TAG_SUFFIX__",                     "replaceWith": "$(AgentImageTagSuffix)"                 },                 {                     "find": "__MANAGED_IDENTITY__",                     "replaceWith": "$(ManagedIdentity)"                 },                  {                     "find": "__CDPX_LINUX_TAG__",                     "replaceWith": "$(CDPXLinuxTag)"                 },                 {                     "find": "__CDPX_WINDOWS_TAG__",                     "replaceWith": "$(CDPXWindowsTag)"                 },                 {                     "find": "__OVERRIDE_TAG__",                     "replaceWith": "$(OverrideTag)"                 }             ]         }                                                                                                                                                     ] }'
          env:
            ServiceTreeGuid: 3170cdd2-19f0-4027-912b-1027311691a2
          target:
            container: host
          displayName: Ev2 Classic - Deploy
      - job: Ev2_rollout_ev2_monitoring
        variables:
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: OneESPT.Workflow
          value: ev2-classic
          readonly: true
        - name: ev2Environment
          value: Production
        - name: Ev2MonintoringUrl
          value: 'https://azureservicedeploy.msft.net/api/monitorrollout'
        displayName: Agent job - Ev2 Ev2 Monitoring
        pool:
          name: server
        dependsOn:
        - Ev2_rollout_ev2_rollout
        timeoutInMinutes: '0'
        steps:
        - task: vsrm-ev2.vss-server-ev2.1950188C-A844-4040-A014-A326BC8332D3.Ev2Agentless@1
          displayName: Ev2 - Monitoring
          inputs:
            Ev2MonintoringUrl: $(Ev2MonintoringUrl)
    - stage: Stage_3
      displayName: Deploy
      trigger: manual
      pool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-ubuntu-2204
        os: linux
      jobs:
      - job: Job_1
        displayName: Agent job
        condition: succeeded()
        timeoutInMinutes: '0'
        variables:
        - name: OneESPT.JobType
          value: releaseJob
          readonly: true
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: runCodesignValidationInjection
          value: false
        - name: Codeql.SkipTaskAutoInjection
          value: true
        - name: skipComponentGovernanceDetection
          value: true
        - name: skipNugetSecurityAnalysis
          value: true
        - name: OneES_targetName
          value: host
        steps:
        - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
          condition: false
          inputs:
            repository: none
        - task: 1ESGPTRunTask@3.0.376
          displayName: Validate Hosted Pool Information (1ES PT)
          continueOnError: false
          target:
            container: host
          env:
            HOST_ARCHITECTURE: amd64
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_DEFINITIONID: $(System.DefinitionId)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
            BUILD_REPOSITORY_ID: $(Build.Repository.ID)
            BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
            PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
            BUILD_REASON: $(Build.Reason)
          inputs:
            repoId: microsoft/Docker-Provider
            path: validateHostedPool.ps1
            arguments: -TargetName '' -StepTargets '' -StepsLength 0 -SkipStatelessValidation True -OS windows -IgnoreProductionPoolCheck  -IsOfficialTemplate -IsProductionReleasePipeline
        - task: 1ESGPTRunTask@3.0.376
          displayName: Branch Validation (1ES PT)
          continueOnError: true
          target:
            container: host
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
            BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            BUILD_SOURCEBRANCH: $(Build.SourceBranch)
            BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
            BUILD_REPOSITORY_ID: $(Build.Repository.ID)
            BUILD_REPOSITORYPROVIDER: $(Build.Repository.Provider)
            BUILD_SOURCEVERSION: $(Build.SourceVersion)
            TASK_MODE: audit
          inputs:
            repoId: microsoft/Docker-Provider
            path: release_gating.py
        - task: DownloadPipelineArtifact@2
          displayName: ⏬ Pipeline Artifact Download
          inputs:
            buildType: specific
            project: $(resources.pipeline._ci-aks-prod-release.projectID)
            definition: $(resources.pipeline._ci-aks-prod-release.pipelineID)
            allowFailedBuilds: false
            buildVersionToDownload: specific
            pipelineId: $(resources.pipeline._ci-aks-prod-release.runID)
            pipeline: _ci-aks-prod-release
          target:
            container: host
        - task: AzureArtifacts.drop-validator-task.drop-validator-task.DropValidatorTask@0
          displayName: "\U0001F6E1 Validate SBoM Manifest (1ES PT)"
          condition: succeeded()
          continueOnError: False
          timeoutInMinutes: 30
          env:
            SBOMVALIDATOR_TEMPIGNOREMISSING: true
          inputs:
            BuildDropPath: $(Pipeline.Workspace)
            OutputPath: $(Agent.TempDirectory)/sbom_validation_results.json
            ValidateSignature: True
            Verbosity: 'Verbose'
        - task: 1ESGPTRunTask@3.0.376
          displayName: Post-SBoM Validation (1ES PT)
          continueOnError: true
          target:
            container: host
          condition: succeeded()
          env:
            OutputPath: $(Agent.TempDirectory)/sbom_validation_results.json
          inputs:
            repoId: microsoft/Docker-Provider
            path: post_sbom_validation.py
        - task: 1ESGPTRunTask@3.0.376
          displayName: Validate Source Build (1ES PT)
          continueOnError: false
          target:
            container: host
          env:
            BuildDropPath: $(Pipeline.Workspace)
            IsProduction: True
            OneES_ArtifactType: $(DownloadPipelineArtifactResourceTypes)
          inputs:
