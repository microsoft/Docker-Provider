# Template for deploying ama-logs to an AKS cluster via Helm
# Usage: 
#   - template: templates/ama-logs-helm-deploy.yaml
#     parameters:
#       clusterName: 'my-cluster'
#       resourceGroup: 'my-rg'
#       region: 'eastus'
#       subscriptionId: '9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb'
#       workspaceId: 'your-workspace-id'
#       imageTag: '$(AgentImageTagSuffix)'  # e.g., 3.1.32
#
# Image tags constructed from imageTag parameter:
#   - Linux: imageTag -> 3.1.32
#   - Windows: win-imageTag -> win-3.1.32

parameters:
# Required cluster parameters
- name: clusterName
  type: string
- name: resourceGroup
  type: string
- name: region
  type: string
- name: subscriptionId
  type: string
- name: workspaceId
  type: string
  displayName: 'Log Analytics Workspace ID'
- name: imageTag
  type: string
  displayName: 'Image tag suffix (e.g., 3.1.32)'
- name: environment
  type: string
  displayName: 'Azure DevOps Environment name'

# Optional parameters with defaults
- name: cloudEnvironment
  type: string
  default: 'azurepubliccloud'
- name: kubernetesVersion
  type: string
  default: '1.32.7'
- name: azureSubscription
  type: string
  default: 'ContainerInsights_Build_Subscription_CI'
- name: namespace
  type: string
  default: 'kube-system'
- name: releaseName
  type: string
  default: 'ama-logs'
- name: helmVersion
  type: string
  default: '3.12.3'
- name: dependsOn
  type: object
  default: []

jobs:
- deployment: Deploy_AmaLogs_${{ replace(parameters.clusterName, '-', '_') }}
  displayName: 'Deploy: ama-logs to ${{ parameters.clusterName }}'
  environment: ${{ parameters.environment }}
  dependsOn: ${{ parameters.dependsOn }}
  variables:
  - name: OneESPT
    value: true
    readonly: true
  - name: OneESPT.BuildType
    value: Official
    readonly: true
  - name: OneESPT.OS
    value: linux
    readonly: true
  - name: skipComponentGovernanceDetection
    value: true
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: AKS_RESOURCE_ID
    value: '/subscriptions/${{ parameters.subscriptionId }}/resourceGroups/${{ parameters.resourceGroup }}/providers/Microsoft.ContainerService/managedClusters/${{ parameters.clusterName }}'
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
          displayName: Checkout repository
        - task: HelmInstaller@1
          displayName: Install Helm
          inputs:
            helmVersionToInstall: '${{ parameters.helmVersion }}'
        - task: HelmDeploy@0
          displayName: 'Helm Deploy: ama-logs to ${{ parameters.clusterName }}'
          inputs:
            connectionType: 'Azure Resource Manager'
            azureSubscription: '${{ parameters.azureSubscription }}'
            azureResourceGroup: '${{ parameters.resourceGroup }}'
            kubernetesCluster: '${{ parameters.clusterName }}'
            useClusterAdmin: true
            namespace: '${{ parameters.namespace }}'
            command: 'upgrade'
            chartType: 'FilePath'
            chartPath: '$(Build.SourcesDirectory)/charts/azuremonitor-containerinsights-for-prod-clusters'
            releaseName: '${{ parameters.releaseName }}'
            overrideValues: 'global.commonGlobals.CloudEnvironment=${{ parameters.cloudEnvironment }},OmsAgent.aksResourceID=$(AKS_RESOURCE_ID),OmsAgent.workspaceID=${{ parameters.workspaceId }},OmsAgent.imageTagLinux=${{ parameters.imageTag }},OmsAgent.imageTagWindows=win-${{ parameters.imageTag }}'
            waitForExecution: false
            arguments: '--timeout 10m --install'
        - task: AzureCLI@2
          displayName: Verify Deployment
          inputs:
            azureSubscription: '${{ parameters.azureSubscription }}'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              echo "=========================================="
              echo "Deployment Summary"
              echo "=========================================="
              echo "Cluster: ${{ parameters.clusterName }}"
              echo "Resource Group: ${{ parameters.resourceGroup }}"
              echo "Region: ${{ parameters.region }}"
              echo "Linux Image Tag: ${{ parameters.imageTag }}"
              echo "Windows Image Tag: win-${{ parameters.imageTag }}"
              echo ""
              
              echo "Getting AKS credentials..."
              az aks get-credentials --resource-group ${{ parameters.resourceGroup }} --name ${{ parameters.clusterName }} --overwrite-existing --admin
              
              echo ""
              echo "=========================================="
              echo "Waiting for pods to be ready (60s max)..."
              echo "=========================================="
              
              # Wait for daemonset pods
              kubectl rollout status daemonset/ama-logs -n ${{ parameters.namespace }} --timeout=60s || echo "Warning: Daemonset rollout not complete within timeout"
              
              # Wait for replicaset pod
              kubectl rollout status deployment/ama-logs-rs -n ${{ parameters.namespace }} --timeout=60s 2>/dev/null || \
                kubectl rollout status replicaset -l rsName=ama-logs-rs -n ${{ parameters.namespace }} --timeout=60s 2>/dev/null || \
                echo "Warning: ReplicaSet rollout status check skipped"
              
              echo ""
              echo "=========================================="
              echo "Pod Status"
              echo "=========================================="
              kubectl get pods -n ${{ parameters.namespace }} | grep ama-logs || echo "No ama-logs pods found"
              
              echo ""
              echo "=========================================="
              echo "Helm Release Status"
              echo "=========================================="
              helm status ${{ parameters.releaseName }} -n ${{ parameters.namespace }} 2>/dev/null || echo "Helm release status not available"
              
              echo ""
              echo "=========================================="
              echo "Image Verification"
              echo "=========================================="
              EXPECTED_LINUX_TAG="${{ parameters.imageTag }}"
              EXPECTED_WINDOWS_TAG="win-${{ parameters.imageTag }}"
              VERIFICATION_PASSED=true
              
              echo "Expected Linux image tag: $EXPECTED_LINUX_TAG"
              echo "Expected Windows image tag: $EXPECTED_WINDOWS_TAG"
              echo ""
              
              # ---- Linux Pod Verification ----
              echo "--- Linux Pod Verification ---"
              
              # Use component=ama-logs label (used by daemonset pods)
              LINUX_IMAGE=$(kubectl get pods -n ${{ parameters.namespace }} -l component=ama-logs -o jsonpath='{.items[0].spec.containers[?(@.name=="ama-logs")].image}' 2>/dev/null)
              
              # Fallback: try getting pod by name pattern if label doesn't work
              if [ -z "$LINUX_IMAGE" ]; then
                echo "Label selector failed, trying by pod name pattern..."
                LINUX_POD=$(kubectl get pods -n ${{ parameters.namespace }} --no-headers 2>/dev/null | grep "^ama-logs-" | grep -v "ama-logs-rs" | grep -v "ama-logs-win" | head -1 | awk '{print $1}')
                if [ -n "$LINUX_POD" ]; then
                  LINUX_IMAGE=$(kubectl get pod "$LINUX_POD" -n ${{ parameters.namespace }} -o jsonpath='{.spec.containers[?(@.name=="ama-logs")].image}' 2>/dev/null)
                fi
              fi
              
              if [ -z "$LINUX_IMAGE" ]; then
                echo "❌ ERROR: Could not retrieve Linux ama-logs container image"
                echo "Linux pods must exist - marking verification as FAILED"
                VERIFICATION_PASSED=false
              else
                echo "Linux image deployed: $LINUX_IMAGE"
                LINUX_TAG=$(echo "$LINUX_IMAGE" | cut -d':' -f2)
                echo "Linux tag: $LINUX_TAG"
                
                if [ "$LINUX_TAG" == "$EXPECTED_LINUX_TAG" ]; then
                  echo "✅ Linux image tag verification PASSED"
                else
                  echo "❌ Linux image tag MISMATCH! Expected: $EXPECTED_LINUX_TAG, Actual: $LINUX_TAG"
                  VERIFICATION_PASSED=false
                fi
              fi
              
              echo ""
              
              # ---- Windows Pod Verification ----
              echo "--- Windows Pod Verification ---"
              
              # Use component=ama-logs-win label (used by Windows daemonset pods)
              WINDOWS_POD=$(kubectl get pods -n ${{ parameters.namespace }} -l component=ama-logs-win -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              
              # Fallback: try by pod name pattern
              if [ -z "$WINDOWS_POD" ]; then
                WINDOWS_POD=$(kubectl get pods -n ${{ parameters.namespace }} --no-headers 2>/dev/null | grep "ama-logs-win" | head -1 | awk '{print $1}')
              fi
              
              if [ -z "$WINDOWS_POD" ]; then
                echo "INFO: No Windows ama-logs pods found (cluster may not have Windows nodes)"
                echo "Skipping Windows verification"
              else
                echo "Found Windows pod: $WINDOWS_POD"
                WINDOWS_IMAGE=$(kubectl get pod "$WINDOWS_POD" -n ${{ parameters.namespace }} -o jsonpath='{.spec.containers[?(@.name=="ama-logs-windows")].image}' 2>/dev/null)
                
                if [ -z "$WINDOWS_IMAGE" ]; then
                  echo "WARNING: Could not retrieve Windows ama-logs container image from pod"
                  echo "Trying alternate container name..."
                  WINDOWS_IMAGE=$(kubectl get pod "$WINDOWS_POD" -n ${{ parameters.namespace }} -o jsonpath='{.spec.containers[0].image}' 2>/dev/null)
                fi
                
                if [ -z "$WINDOWS_IMAGE" ]; then
                  echo "❌ ERROR: Could not retrieve Windows ama-logs container image"
                  VERIFICATION_PASSED=false
                else
                  echo "Windows image deployed: $WINDOWS_IMAGE"
                  WINDOWS_TAG=$(echo "$WINDOWS_IMAGE" | cut -d':' -f2)
                  echo "Windows tag: $WINDOWS_TAG"
                  
                  if [ "$WINDOWS_TAG" == "$EXPECTED_WINDOWS_TAG" ]; then
                    echo "✅ Windows image tag verification PASSED"
                  else
                    echo "❌ Windows image tag MISMATCH! Expected: $EXPECTED_WINDOWS_TAG, Actual: $WINDOWS_TAG"
                    VERIFICATION_PASSED=false
                  fi
                fi
              fi
              
              echo ""
              echo "=========================================="
              echo "Final Verification Result"
              echo "=========================================="
              if [ "$VERIFICATION_PASSED" = true ]; then
                echo "✅ SUCCESS: All image tag verifications PASSED"
              else
                echo "❌ FAILED: One or more image tag verifications failed"
                exit 1
              fi
