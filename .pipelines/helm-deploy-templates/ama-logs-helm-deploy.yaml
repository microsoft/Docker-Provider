# Template for deploying ama-logs to an AKS cluster via Helm
# Usage: 
#   - template: helm-deploy-templates/ama-logs-helm-deploy.yaml
#     parameters:
#       clusterName: 'my-cluster'
#       resourceGroup: 'my-rg'
#       region: e.g. 'eastus'
#       subscriptionId: 'your-subscription-id'
#       workspaceId: 'your-workspace-id'
#       amalogsLinuxImage: "ama-logs linux image tag"
#       amalogsWindowsImage: "ama-logs windows image tag"
#       environment: 'deployment environment'

parameters:
# Required cluster parameters
- name: clusterName
  type: string
- name: resourceGroup
  type: string
- name: region
  type: string
- name: subscriptionId
  type: string
- name: workspaceId
  type: string
  displayName: 'Log Analytics Workspace ID'
- name: amalogsLinuxImage
  type: string
  displayName: 'Image tag suffix (e.g., 3.1.32)'
- name: amalogsWindowsImage
  type: string
  displayName: 'Image tag suffix (e.g., win-3.1.32)'
- name: imageRepository
  type: string
  default: '/azuremonitor/containerinsights/ciprod'
  displayName: 'Image repository path (e.g., /azuremonitor/containerinsights/ciprod or /azuremonitor/containerinsights/cidev)'
- name: environment
  type: string
  displayName: 'Azure DevOps Environment name'

# Optional parameters with defaults
- name: cloudEnvironment
  type: string
  default: 'azurepubliccloud'
- name: azureSubscription
  type: string
  default: 'ContainerInsights_Build_Subscription_CI'
- name: namespace
  type: string
  default: 'default'
- name: releaseName
  type: string
  default: 'azuremonitor-containers'
- name: additionalOverrides
  type: string
  default: ''
  displayName: 'Additional Helm override values (comma-separated key=value pairs)'
- name: dependsOn
  type: object
  default: []

jobs:
- deployment: Deploy_AmaLogs_${{ replace(parameters.clusterName, '-', '_') }}
  displayName: 'Deploy: ama-logs to ${{ parameters.clusterName }}'
  environment: ${{ parameters.environment }}
  dependsOn: ${{ parameters.dependsOn }}
  variables:
  - name: OneESPT
    value: true
    readonly: true
  - name: OneESPT.BuildType
    value: Official
    readonly: true
  - name: OneESPT.OS
    value: linux
    readonly: true
  - name: skipComponentGovernanceDetection
    value: true
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: AKS_RESOURCE_ID
    value: '/subscriptions/${{ parameters.subscriptionId }}/resourceGroups/${{ parameters.resourceGroup }}/providers/Microsoft.ContainerService/managedClusters/${{ parameters.clusterName }}'
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
          displayName: Checkout repository
        - task: HelmInstaller@1
          displayName: Install Helm
          inputs:
            helmVersionToInstall: 'latest'
        - task: AzureCLI@2
          displayName: 'Detect Kubernetes Version'
          inputs:
            azureSubscription: '${{ parameters.azureSubscription }}'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az aks get-credentials --resource-group ${{ parameters.resourceGroup }} --name ${{ parameters.clusterName }} --overwrite-existing --admin
              K8S_VERSION=$(kubectl version -o json | jq -r '.serverVersion.gitVersion' | sed 's/^v//')
              echo "Detected Kubernetes version: $K8S_VERSION"
              echo "##vso[task.setvariable variable=K8S_VERSION]$K8S_VERSION"
        - task: HelmDeploy@0
          displayName: 'Helm Deploy: ama-logs to ${{ parameters.clusterName }}'
          inputs:
            connectionType: 'Azure Resource Manager'
            azureSubscription: '${{ parameters.azureSubscription }}'
            azureResourceGroup: '${{ parameters.resourceGroup }}'
            kubernetesCluster: '${{ parameters.clusterName }}'
            useClusterAdmin: true
            namespace: '${{ parameters.namespace }}'
            command: 'upgrade'
            chartType: 'FilePath'
            chartPath: '$(Build.SourcesDirectory)/charts/azuremonitor-containerinsights'
            releaseName: '${{ parameters.releaseName }}'
            ${{ if ne(parameters.additionalOverrides, '') }}:
              overrideValues: 'global.commonGlobals.CloudEnvironment=${{ parameters.cloudEnvironment }},global.commonGlobals.Region=${{ parameters.region }},global.commonGlobals.Versions.Kubernetes=$(K8S_VERSION),OmsAgent.aksResourceID=$(AKS_RESOURCE_ID),OmsAgent.workspaceID=${{ parameters.workspaceId }},OmsAgent.imageRepository=${{ parameters.imageRepository }},OmsAgent.imageTagLinux=${{ parameters.amalogsLinuxImage }},OmsAgent.imageTagWindows=${{ parameters.amalogsWindowsImage }},${{ parameters.additionalOverrides }}'
            ${{ else }}:
              overrideValues: 'global.commonGlobals.CloudEnvironment=${{ parameters.cloudEnvironment }},global.commonGlobals.Region=${{ parameters.region }},global.commonGlobals.Versions.Kubernetes=$(K8S_VERSION),OmsAgent.aksResourceID=$(AKS_RESOURCE_ID),OmsAgent.workspaceID=${{ parameters.workspaceId }},OmsAgent.imageRepository=${{ parameters.imageRepository }},OmsAgent.imageTagLinux=${{ parameters.amalogsLinuxImage }},OmsAgent.imageTagWindows=${{ parameters.amalogsWindowsImage }}'
            waitForExecution: false
            arguments: '--timeout 10m --install --server-side=true --force-conflicts'
            
