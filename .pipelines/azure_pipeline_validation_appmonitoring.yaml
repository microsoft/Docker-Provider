# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  batch: true
  branches:
    exclude:
    - '*'

pr:
  branches:
    exclude:
    - '*'

variables:
  armServiceConnectionName: 'Appmonitoring_Validation_Pipeline'
  subscription: '5a3b3ba4-3a42-42ae-b2cb-f882345803bc'
  containerRegistry: 'aicommon' # this build pushes to aicommon.azurecr.io with an image that is used for testing in validation cluster, then pushes an image once tests pass. That image is latre picked up by the release pipeline and reuploaded to MCR
  repoImageName: '${{ variables.containerRegistry }}.azurecr.io/validated/azuremonitor/applicationinsights/aiprod'
  repoTestImageName: '${{ variables.containerRegistry }}.azurecr.io/dev/azuremonitor/applicationinsights/aiprod'
  imageTag: $[ dependencies.common.outputs['setup.imageTag'] ]
  testImageTagSuffix: $(imageTag)-$(Build.BuildId)
  testImageName: ${{ variables.repoTestImageName }}:${{ variables.testImageTagSuffix }}
  fullImageName: ${{ variables.repoImageName }}:$(imageTag)
  javaTestAppImageName: 'aicommon.azurecr.io/demoaks-java-app:latest'
  javaTestAppName: 'test-app-java'
  nodeTestAppImageName: 'aicommon.azurecr.io/demoaks-nodejs-app:latest'
  nodeTestAppName: 'test-app-nodejs'
  testNamespace: 'test-ns'
  aiConnectionString: 'InstrumentationKey=2b453402-fcfb-408f-8495-c551f0e82f46;IngestionEndpoint=https://eastus-8.in.applicationinsights.azure.com/;LiveEndpoint=https://eastus.livediagnostics.monitor.azure.com/'
  aiResourceId: '/subscriptions/5a3b3ba4-3a42-42ae-b2cb-f882345803bc/resourceGroups/aks-appmonitoring-pipeline/providers/microsoft.insights/components/appmonitoring-pipeline-validation-ai'
  Codeql.Enabled: true
  Codeql.BuildIdentifier: 'linuxbuild'
  AKSResourceGroup: 'aks-appmonitoring-pipeline'
  AKSResourceName: 'appmonitoring-webhook-testbed'
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]

jobs:
- job: common
  variables:
    Codeql.SkipTaskAutoInjection: true
  pool:
    name: rambhatt-test-es-pool
  steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true
  - task: ComponentGovernanceComponentDetection@0
  ## dev builds are in format Major.Minor.Patch-CommitAheadCount-CommitId
  ## prod release are in format Major.Minor.Patch
  ## preview release are in format preview-Major.Minor.Patch
  - bash: |
      commit=$(git describe --tags)
      imageTag="$commit"
            
      echo "imageTag is $imageTag"
      
      echo "##vso[task.setvariable variable=imageTag;isOutput=true]$imageTag"
      
      cd $(Build.SourcesDirectory)/deployment/mergebranch-webhook-deployment/ServiceGroupRoot/Scripts
    name: setup

- job: build_linux
  
  timeoutInMinutes: 120
  dependsOn: common
  pool:
    name: rambhatt-test-es-pool
  variables:
    # This is necessary because of: https://github.com/moby/moby/issues/37965
    DOCKER_BUILDKIT: 1

  steps:
  - task: CodeQL3000Init@0
  - task: AzureCLI@2
    displayName: "Ready Image and push to ACR"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        mkdir -p $(Build.ArtifactStagingDirectory)/linux

        echo "Installing NPM..."
        sudo apt-get -y install npm

        echo "Switching the directory..."
        cd appmonitoring/ts/src
        pwd
        ls -a
        
        echo "Installing npm packages..."
        sudo npm i
        sudo npm ci

        #echo "Updating packages..."
        #npm update
        
        echo "Building the typescript project..."
        tsc --build --force
        
        if [ $? -ne 0 ]
        then
          echo "Build failed"
          exit 1
        fi

        echo "Build is done"

        echo "Running ESLint..."
        npx eslint .

        if [ $? -ne 0 ]
        then
          echo "ESLint failed"
          exit 1
        fi

        echo "ESLint is done"

        echo "Running Jest..."
        npm test

        if [ $? -ne 0 ]
        then
          echo "Jest failed"
          exit 1
        fi

        echo "Jest is done"

        echo "Pruning packages..."
        sudo npx modclean -r
        sudo npm prune --production
        echo "Pruning packages is done"
        
        pwd
        ls -a
        
        sudo apt-get update && sudo apt-get -y install qemu binfmt-support qemu-user-static
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

        docker buildx create --name testbuilder
        docker buildx use testbuilder

        az --version
        az account show
        az account set -s ${{ variables.subscription }}
        az acr login -n ${{ variables.containerRegistry }}

        # NOTE: Using the prometheus-collector team's cached buildx image since moby/buildkit:buildx-stable-1 getting throttled
        docker pull mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images:buildx-stable-1
        docker buildx create --name dockerbuilder --driver docker-container --driver-opt image=mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images:buildx-stable-1 --use
        docker buildx inspect --bootstrap

        echo "Build reason = $(Build.Reason)"

        echo ${{ variables.testImageName }}
        
        docker buildx build --platform linux/amd64,linux/arm64 --tag ${{ variables.testImageName }} -f ./Dockerfile --build-arg IMAGE_TAG="${{ variables.testImageName }}" --metadata-file $(Build.ArtifactStagingDirectory)/linux/metadata.json --push --provenance=false .
        docker pull ${{ variables.testImageName }}

  - task: CodeQL3000Finalize@0

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: drop

- job: validate_webhook_image
  dependsOn: build_linux
  condition: and(succeeded(), eq(variables['IS_PR'], 'False'))
  pool:
    name: rambhatt-test-es-pool
  variables:
    # This is necessary because of: https://github.com/moby/moby/issues/37965
    DOCKER_BUILDKIT: 1

  steps:
  - task: AzureCLI@2
    displayName: "Create deployment in AKS"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 

        sudo chmod u+x ./clean-install-appmonitoring.sh

        echo "Checking for charts..."
        if ! ./clean-install-appmonitoring.sh ${{ variables.testImageTagSuffix }}; then
          echo "Chart installation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Validate charts deployed to AKS"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 

        sudo chmod u+x ./validate-aks-charts.sh
        sudo chmod u+x ./validate-certs.sh

        echo "Waiting for 30 seconds for charts to be ready..."
        sleep 30

        echo "Checking for charts..."
        if ! ./validate-aks-charts.sh; then
          echo "Chart validation failed"
          exit 1
        fi

        echo "Checking for certificate installation..."
        if ! ./validate-certs.sh; then
          echo "Certificate validation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Install CR and test apps"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/validation-helm
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 

        export JAVA_TEST_IMAGE_NAME=${{ variables.javaTestAppImageName }}
        export NODEJS_TEST_IMAGE_NAME=${{ variables.nodeTestAppImageName }}
        export TEST_NS="${{ variables.testNamespace }}"
        export AI_CONNECTION_STRING="${{ variables.aiConnectionString }}"
        export JAVA_TEST_APP_NAME="${{ variables.javaTestAppName }}"
        export NODEJS_TEST_APP_NAME="${{ variables.nodeTestAppName }}"

        sudo chmod +x ../scripts/install-test-apps.sh

        if ! ../scripts/install-test-apps.sh; then
          echo "Test apps installation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Check test apps were mutated correctly"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }}
        
        sudo chmod u+x ./validate-mutation.sh

        if ! ./validate-mutation.sh "test-app-java" "test-app-nodejs" "test-ns"; then
          echo "Mutation validation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Check test apps are sending telemetry to AI"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 
        export JAVA_TEST_APP_NAME="${{ variables.javaTestAppName }}"
        export NODEJS_TEST_APP_NAME="${{ variables.nodeTestAppName }}"

        echo "Wait for 3m for telemetry to flow..."
        sleep 180
        
        sudo chmod u+x ./validate_ai.sh

        if ! ./validate_ai.sh "${{ variables.aiResourceId }}" "test-ns"; then
          echo "AI telemetry validation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Validate Housekeeper Cron Job"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 

        sudo chmod u+x ./test-cronjob.sh
        sudo chmod u+x ./validate-certs.sh

        echo "Checking for charts..."
        if ! ./test-cronjob.sh; then
          echo "Cron Job validation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Restart webhook deployment"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 

        kubectl rollout restart -n kube-system deployment/app-monitoring-webhook 

  - task: AzureCLI@2
    displayName: "Check test apps were mutated correctly"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }}
        
        sudo chmod u+x ./validate-mutation.sh

        if ! ./validate-mutation.sh "test-app-java" "test-app-nodejs" "test-ns"; then
          echo "Mutation validation failed"
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Check test apps are sending telemetry to AI"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        cd appmonitoring/scripts
        pwd
        az account set --subscription ${{ variables.subscription }}
        az aks get-credentials --resource-group ${{ variables.AKSResourceGroup }} --name ${{ variables.AKSResourceName }} 
        export JAVA_TEST_APP_NAME="${{ variables.javaTestAppName }}"
        export NODEJS_TEST_APP_NAME="${{ variables.nodeTestAppName }}"

        echo "Wait for 3m for telemetry to flow..."
        sleep 180
        
        sudo chmod u+x ./validate_ai.sh

        if ! ./validate_ai.sh "${{ variables.aiResourceId }}" "test-ns"; then
          echo "AI telemetry validation failed"
          exit 1
        fi
        
  - task: AzureCLI@2
    displayName: "Retag the image as ready to deploy"
    inputs:
      azureSubscription: ${{ variables.armServiceConnectionName }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az --version
        az account show
        az account set -s ${{ variables.subscription }}
        az acr login -n ${{ variables.containerRegistry }}

        docker pull ${{ variables.testImageName }}
        docker tag ${{ variables.testImageName }} ${{ variables.fullImageName }}
        docker push ${{ variables.fullImageName }}
        



