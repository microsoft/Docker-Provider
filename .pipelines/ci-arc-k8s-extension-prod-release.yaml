trigger: none
name: $(Date:yyyyMMdd).$(Rev:r)
parameters:
- name: validateSovereignRolloutOnly
  displayName: Validate Fairfax and Mooncake rollouts without deploying
  type: boolean
  default: false
variables:
- name: ACRName
  value: $(VAR_ACR_NAME)
- name: ADMIN_SUBSCRIPTION_ID
  value: $(VAR_ADMIN_SUBSCRIPTION_ID)
- name: CHART_VERSION
  value: $(VAR_CHART_VERSION)
- name: IS_CUSTOMER_HIDDEN
  value: $(VAR_IS_CUSTOMER_HIDDEN)
- name: MANAGED_IDENTITY
  value: $(VAR_MANAGED_IDENTITY)
- name: REGISTER_REGIONS_CANARY
  value: $(VAR_REGISTER_REGIONS_CANARY)
- name: RELEASE_TRAINS_PREVIEW_PATH
  value: $(VAR_RELEASE_TRAINS_PREVIEW_PATH)
- name: RELEASE_TRAINS_STABLE_PATH
  value: $(VAR_RELEASE_TRAINS_STABLE_PATH)
- name: RepoType
  value: $(VAR_REPO_TYPE)
- name: RESOURCE_AUDIENCE
  value: $(VAR_RESOURCE_AUDIENCE)
- name: ServiceTreeGuid
  value: $(VAR_SERVICE_TREE_GUID)
- name: SPN_CLIENT_ID
  value: $(VAR_SPN_CLIENT_ID)
- name: SPN_SECRET
  value: ''
- name: SPN_TENANT_ID
  value: $(VAR_SPN_TENANT_ID)
- name: REGISTER_REGIONS_BATCH
  value: ''
- name: RELEASE_STAGE_NAME
  value: 'Stable'
- name: configurationOverrides
  value: '{"ConfigurationSpecification":{"Settings":{"adminSubscriptionId":"$(ADMIN_SUBSCRIPTION_ID)","chartVersion":"$(CHART_VERSION)","isCustomerHidden":"$(IS_CUSTOMER_HIDDEN)","registerRegionsCanary":"$(REGISTER_REGIONS_CANARY)","releaseTrainsPreviewPath":"$(RELEASE_TRAINS_PREVIEW_PATH)","releaseTrainsStablePath":"$(RELEASE_TRAINS_STABLE_PATH)","registerRegionsBatch":"$(REGISTER_REGIONS_BATCH)","resourceAudience":"$(RESOURCE_AUDIENCE)","spnClientId":"$(SPN_CLIENT_ID)","spnSecret":"$(SPN_SECRET)","spnTenantId":"$(SPN_TENANT_ID)","managedIdentity":"$(MANAGED_IDENTITY)","releaseStage":"$(RELEASE_STAGE_NAME)","acrName":"$(ACRName)","repoType":"$(RepoType)"}}}'
resources:
  containers: []
  pipelines:
  - pipeline: '_ci-arc-k8s-extension-prod-release'
    project: 'microsoft'
    source: 'CDPX\docker-provider\ContainerInsights-MultiArch-MergedBranches'
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-windows-2022
      os: windows
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-windows-2022
        os: windows
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: Stage_Canary_MCR
      displayName: Canary MCR
      pool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-windows-2022
        os: windows
      jobs:
      - job: releaseGating
        displayName: Release Gating
        variables:
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: runCodesignValidationInjection
          value: false
        - name: Codeql.SkipTaskAutoInjection
          value: true
        - name: skipComponentGovernanceDetection
          value: true
        - name: skipNugetSecurityAnalysis
          value: true
        steps:
        - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
          condition: false
          inputs:
            repository: none
        - task: 1ESGPTRunTask@3.0.376
          displayName: Branch Validation (1ES PT)
          continueOnError: true
          target:
            container: host
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
            BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            BUILD_SOURCEBRANCH: $(Build.SourceBranch)
            BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
            BUILD_REPOSITORY_ID: $(Build.Repository.ID)
            BUILD_REPOSITORYPROVIDER: $(Build.Repository.Provider)
            BUILD_SOURCEVERSION: $(Build.SourceVersion)
            TASK_MODE: audit
          inputs:
            repoId: microsoft/Docker-Provider
            path: release_gating.py
      - job: approval
        variables:
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: ev2Environment
          value: Production
        - name: Ev2MonintoringUrl
          value: 'https://azureservicedeploy.msft.net/api/monitorrollout'
        displayName: Approval
        pool:
          name: server
        timeoutInMinutes: 7200
        dependsOn:
        - releaseGating
        steps:
        - task: ApprovalTask@1
          inputs:
            environment: $(ev2Environment)
            servicetreeguid: 3170cdd2-19f0-4027-912b-1027311691a2
      - job: Ev2_rollout_ev2_rollout
        displayName: Agent Job - Ev2 Ev2 Rollout
        timeoutInMinutes: '0'
        condition: succeeded()
        dependsOn:
        - approval
        variables:
        - name: ev2Environment
          value: Production
        - name: RELEASE_STAGE_NAME
          value: Canary
        - name: Ev2MonintoringUrl
          value: https://azureservicedeploy.msft.net/api/monitorrollout
        - name: OneESPT.JobType
          value: releaseJob
          readonly: true
        - name: OneESPT
          value: true
          readonly: true
        - name: OneESPT.BuildType
          value: Official
          readonly: true
        - name: OneESPT.OS
          value: windows
          readonly: true
        - name: OneESPT.Workflow
          value: ev2-classic
          readonly: true
        - name: runCodesignValidationInjection
