#################################################################################
#                               OneBranch Pipelines                             #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Reference doc:  https://msazure.visualstudio.com/One/_wiki/wikis/One.wiki/    #
#                 671961/Automating-release-of-new-versions-using-ev2           #
#                                                                               #
# Purpose: Roll out new versions of the extension type                          #
#   microsoft.azuremonitor.containers.metrics                                   #
# to AKS (Managed) clusters via the central Ev2 extension rollout artifacts,    #
# using packageConfig: Microsoft.AzureMonitor.Containers.Metrics-PromAks052926. #
#                                                                               #
# This replaces the custom Ev2 ServiceGroup approach previously used in         #
# .pipelines/deployment/aks-extension-release/ (now removed in favor of the     #
# central artifacts model documented in wiki page 671961).                      #
#################################################################################

trigger: none

parameters:
  - name: 'overrideExtensionVersion'
    displayName: 'Override Extension Version (leave as "auto" to use upstream build runName)'
    type: string
    default: 'auto'

  - name: 'releaseTrain'
    displayName: 'Release Train'
    type: string
    default: 'stable'
    values:
      - preview
      - stable

  # Optional. 'none' (the default) means NO rollback: the run is a normal
  # roll-forward to the version selected above.
  #
  # Azure DevOps renders a parameter whose default is an empty string as a
  # REQUIRED field, so we default to the 'none' sentinel and strip it back to an
  # empty string in the ConfigurationOverrides below. The central artifacts
  # register.sh writes an empty rollbackVersion as JSON null, i.e. no rollback.
  #
  # HOW TO ROLL BACK: RollbackVersion is stored on the version document that is
  # being registered (the rollout PATCHes .../versions/<version>), so set BOTH:
  #   overrideExtensionVersion -> the bad version currently in the field (roll back FROM)
  #   rollbackVersion          -> the last known-good version (roll back TO)
  - name: 'rollbackVersion'
    displayName: 'Rollback version ("none" = roll forward)'
    type: string
    default: 'none'

  - name: 'rolloutType'
    displayName: 'SDP rollout type'
    type: string
    default: 'normal'
    values:
      - normal
      - emergency
      - globaloutage

  - name: 'overrideManagedValidationDuration'
    displayName: 'Override standard SDP duration?'
    type: boolean
    default: false

  - name: 'managedValidationDurationInHours'
    displayName: 'Override standard SDP duration (in hours)'
    type: number
    default: 0

  - name: 'icmIncidentId'
    displayName: 'IcM Incident Id (required when rollout type is globaloutage)'
    type: number
    default: 0

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
  pipelines:
    # Upstream build pipeline that publishes the helm chart to MCR.
    # runName is used as the extension/chart version unless overridden.
    - pipeline: '_ContainerInsights-MultiArch-MergedBranches'
      project: 'microsoft'
      source: 'CDPX\docker-provider\ContainerInsights-MultiArch-MergedBranches'

variables:
  # ---- Identifiers ---------------------------------------------------------
  # Prometheus-collector service tree id (same value used in existing
  # .pipelines/deployment/**/ServiceGroupRoot/ServiceModel.json).
  - name: serviceIdentifier
    value: '3170cdd2-19f0-4027-912b-1027311691a2'

  # Ev2 ServiceGroup registered with the extension platform team for AKS
  # Managed central rollout of microsoft.azuremonitor.containers.metrics.
  # TODO: confirm exact name with ClusterConfig/Extensions partner team
  # (modelled on the argo example: Microsoft.Azure.ClusterConfig.ExtensionRollout.ArgoCd).
  - name: serviceGroup
    value: 'microsoft.azuremonitor.containers'

  # ---- Version selection ---------------------------------------------------
  # When `overrideExtensionVersion` is left at its default value of 'auto',
  # the pipeline uses the runName of the latest upstream build pipeline run
  # (resolved at runtime by the resources.pipelines reference). Any other
  # value is taken as an explicit version override. 
  - ${{ if ne(parameters.overrideExtensionVersion, 'auto') }}:
      - name: extensionVersionValue
        value: '${{ parameters.overrideExtensionVersion }}'
  - ${{ if eq(parameters.overrideExtensionVersion, 'auto') }}:
      - name: extensionVersionValue
        value: '$(resources.pipeline._ContainerInsights-MultiArch-MergedBranches.runName)'

  # ---- ConfigurationOverrides (per cloud) ---------------------------------
  # extensionTypeName / packageConfig / helmChartUrl values were sourced from
  # the legacy .pipelines/deployment/aks-extension-release/Configuration.*.json
  # files (now removed). MSI ARM IDs below must be the cloud-specific identity
  # registered in the extension type registration document (msiClientIds field).
  # See: https://msazure.visualstudio.com/One/_wiki/wikis/One.wiki/202225/Extension-Type-Registration
  #
  # rollbackVersion is resolved at compile time: the 'none' sentinel collapses to
  # an empty string, which the central artifacts register.sh writes as JSON null
  # (no rollback). See the rollbackVersion parameter above.

  - name: ProdConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.microsoft.com/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/30c56c3a-54da-46ea-b004-06eb33432687/resourceGroups/containerinsightsprod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ev2-agent-release",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }
  - name: FairfaxConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.microsoft.com/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/e4f0f588-48fc-43c1-86b3-2861f1ddaa9d/resourcegroups/container-insights-extension-fairfax/providers/Microsoft.ManagedIdentity/userAssignedIdentities/extension-rollout-identity-ContainerInsights",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }

  - name: MooncakeConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.microsoft.com/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/fdbe2580-1746-4bb7-ae1a-da7ada55880b/resourcegroups/container-insights-extension-mooncake/providers/Microsoft.ManagedIdentity/userAssignedIdentities/Extension-insights-mooncake",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }

  - name: USNatConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.microsoft.eaglex.ic.gov/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/f8272cc8-8c5a-438c-ad5c-21264c697c53/resourcegroups/ContainerInsights-AI/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ContainerInsights-MI",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }

  - name: USSecConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.microsoft.scloud/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/3be87dbe-53e1-410a-b8b7-a0d8fa86a9e9/resourcegroups/ContainerInsights-AI/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ContainerInsights-MI",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }

  - name: BleuConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.sovcloud-azure.fr/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/85e18fe6-65f2-4eb5-899e-32ce93b277dd/resourceGroups/extension-msi-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ev2-msi-ci",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }

  - name: DelosConfigurationOverrides
    value: |
      {
        "ConfigurationSpecification": {
          "settings": {
            "extensionTypeName": "microsoft.azuremonitor.containers",
            "packageConfig": "microsoft.azuremonitor.containers-pkgciaks062626",
            "helmChartUrl": "mcr.sovcloud-azure.de/azuremonitor/helmchart/containerinsights/ciprod/azuremonitor-containers",
            "userAssignedIdentity": "/subscriptions/a58475e6-054b-40f9-9060-6c1c2eef7bbb/resourcegroups/extension-msi-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ev2-msi-ci",
            "version": "$(extensionVersionValue)",
            "releaseTrain": "${{ parameters.releaseTrain }}",
            "rollbackVersion": "${{ replace(parameters.rollbackVersion, 'none', '') }}",
            "kustoGatingWaitDuration": "PT1H"
          }
        }
      }

  - name: LinuxContainerImage
    value: 'mcr.microsoft.com/oss/go/microsoft/golang:1.24.2-fips-azurelinux3.0'
  - name: RevisionCounter
    value: $[counter('0', 1)]
  - name: CustomBuildVersion
    value: "Build - $(extensionVersionValue) Release - $(RevisionCounter) ReleaseTrain - ${{ parameters.releaseTrain }}"

# Disable showing the last commit message.
appendCommitMessageToRunName: false

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    ev2ManagedSdpRolloutConfig:
      rolloutType: ${{ parameters.rolloutType }}
      overrideManagedValidationDuration: ${{ parameters.overrideManagedValidationDuration }}
      managedValidationOverrideDurationInHours: ${{ parameters.managedValidationDurationInHours }}
      icmIncidentId: ${{ parameters.icmIncidentId }}

    stages:
      - stage: PROD_Managed_SDP
        displayName: "PROD: Managed SDP"
        variables:
          ob_release_environment: Production
        jobs:
          - job: PROD_Managed_SDP
            displayName: "PROD: Managed SDP"
            pool:
              type: release
            steps:
              - task: onebranch.pipeline.version@1
                condition: ne(variables['CustomBuildVersion'], '')
                displayName: "Setup BuildNumber"
                inputs:
                  system: 'Custom'
                  customVersion: '$(CustomBuildVersion)'
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (Prod)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: Production
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(ProdConfigurationOverrides)
                  # Uncomment below to only rollout the extension version in euap regions for testing
                  # Select: regions(centraluseuap,eastus2euap)
                  Select: regions(*)

      - stage: FF_Managed_SDP
        displayName: "FF: Managed SDP"
        dependsOn: PROD_Managed_SDP
        variables:
          ob_release_environment: Fairfax
        jobs:
          - job: FF_Managed_SDP
            displayName: "FF: Managed SDP"
            pool:
              type: release
            steps:
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (Fairfax)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: Fairfax
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(FairfaxConfigurationOverrides)
                  Select: regions(*)

      - stage: MC_Managed_SDP
        displayName: "MC: Managed SDP"
        dependsOn: PROD_Managed_SDP
        variables:
          ob_release_environment: Mooncake
        jobs:
          - job: MC_Managed_SDP
            displayName: "MC: Managed SDP"
            pool:
              type: release
            steps:
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (Mooncake)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: Mooncake
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(MooncakeConfigurationOverrides)
                  Select: regions(*)

      - stage: USSec_Managed_SDP
        displayName: "USSec: Managed SDP"
        dependsOn: PROD_Managed_SDP
        variables:
          ob_release_environment: USSec
          ob_release_stagetype: deployment
          CvrpManifestRelativePath: '\build.manifest'
        jobs:
          - job: USSec_Managed_SDP
            displayName: "USSec: Managed SDP"
            pool:
              type: release
            steps:
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (USSec)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: USSec
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsTenantIdentifier: 20ac2fc4-effc-4f76-ba7d-63c5ae134f5f
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(USSecConfigurationOverrides)
                  Select: regions(*)

      - stage: USNat_Managed_SDP
        displayName: "USNat: Managed SDP"
        dependsOn: PROD_Managed_SDP
        variables:
          ob_release_environment: USNat
          ob_release_stagetype: deployment
          CvrpManifestRelativePath: '\build.manifest'
        jobs:
          - job: USNat_Managed_SDP
            displayName: "USNat: Managed SDP"
            pool:
              type: release
            steps:
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (USNat)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: USNat
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsTenantIdentifier: 70a90262-f46c-48aa-ac4c-37e37f8be1a2
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(USNatConfigurationOverrides)
                  Select: regions(*)

      - stage: Bleu_Managed_SDP
        displayName: "Bleu: Managed SDP"
        dependsOn: PROD_Managed_SDP
        variables:
          ob_release_environment: Bleu
          ob_release_stagetype: deployment
          CvrpManifestRelativePath: '\build.manifest'
        jobs:
          - job: Bleu_Managed_SDP
            displayName: "Bleu: Managed SDP"
            pool:
              type: release
            steps:
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (Bleu)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: Bleu
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsTenantIdentifier: e4c3160c-c374-44ad-84d2-ddb8c649cdc8
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(BleuConfigurationOverrides)
                  Select: regions(*)

      - stage: Delos_Managed_SDP
        displayName: "Delos: Managed SDP"
        dependsOn: PROD_Managed_SDP
        variables:
          ob_release_environment: Delos
          ob_release_stagetype: deployment
          CvrpManifestRelativePath: '\build.manifest'
        jobs:
          - job: Delos_Managed_SDP
            displayName: "Delos: Managed SDP"
            pool:
              type: release
            steps:
              - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
                displayName: "Ev2 Managed SDP Rollout (Delos)"
                inputs:
                  EndpointProviderType: ApprovalService
                  ApprovalServiceEnvironment: Delos
                  TaskAction: CentralArtifactsRollout
                  CentralArtifactsServiceIdentifier: 2bbbdccc-fa4c-4f81-b9fd-12cd0234701c
                  CentralArtifactsTenantIdentifier: eee66108-c5af-47b1-a1ed-05435ae3f2d0
                  CentralArtifactsPolicyName: CentralArtifactsPolicy
                  ServiceIdentifier: $(serviceIdentifier)
                  ServiceGroup: $(serviceGroup)
                  ConfigurationOverrides: $(DelosConfigurationOverrides)
                  Select: regions(*)
