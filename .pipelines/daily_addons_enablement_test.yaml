schedules:
- cron: '0 0 * * *'
  displayName: Daily midnight test
  branches:
    include:
    - ci_prod
  always: true
trigger: none
pr: none
jobs:
    - job: test
      variables:
        armServiceConnectionName: 'ci-1es-acr-connection'
        subscription: '9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb'
      pool:
        name: Azure-Pipelines-CI-Test-EO
      steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: '${{ variables.armServiceConnectionName }}'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az --version
                az account show
                az account set -s ${{ variables.subscription }}
                
                clusterResourceId=$(az aks show --resource-group $(RESOURCEGROUP) --name $(AKSCLUSTERNAME) --query id -o tsv)
                containerInsightsEnabled=$(az rest --method get --uri "${clusterResourceId}?api-version=2026-07-01" --query properties.azureMonitorProfile.containerInsights.enabled -o json)
                
                if [ "$containerInsightsEnabled" == "true" ]; then
                    echo "Container Insights is enabled on the AKS cluster."
                    az aks disable-addons --addons monitoring --name $(AKSCLUSTERNAME) --resource-group $(RESOURCEGROUP) > /dev/null
                    containerInsightsEnabled=$(az rest --method get --uri "${clusterResourceId}?api-version=2026-07-01" --query properties.azureMonitorProfile.containerInsights.enabled -o json)
                    if [ "$containerInsightsEnabled" != "false" ]; then
                      echo "Container Insights is not disabled."
                      exit 1
                    fi
                    
                    echo "Re-enabling Container Insights..."
                    az aks enable-addons --addons monitoring --name $(AKSCLUSTERNAME) --resource-group $(RESOURCEGROUP) --workspace-resource-id $(LOGANALYTICSWORKSPACE) > /dev/null
                    containerInsightsEnabled=$(az rest --method get --uri "${clusterResourceId}?api-version=2026-07-01" --query properties.azureMonitorProfile.containerInsights.enabled -o json)
                    if [ "$containerInsightsEnabled" != "true" ]; then
                      echo "Container Insights is not enabled."
                      exit 1
                    fi
                    containerInsightsWorkspace=$(az rest --method get --uri "${clusterResourceId}?api-version=2026-07-01" --query properties.azureMonitorProfile.containerInsights.logAnalyticsWorkspaceResourceId -o tsv)
                    if [ "$containerInsightsWorkspace" != "$(LOGANALYTICSWORKSPACE)" ]; then
                      echo "Container Insights is not enabled with the correct log analytics workspace - $containerInsightsWorkspace"
                      exit 1
                    fi
                    
                    echo "Sleeping for everything to get set up and logs start flowing"
                    sleep $(SLEEPDURATION)
                    # Check if there is data in the Log Analytics workspace
                    dataCount=$(az monitor log-analytics query --workspace $(WORKSPACEID) --analytics-query "ContainerInventory | where TimeGenerated > ago(5m) and _ResourceId contains 'daily_enable_disable_test' | count")
                    countValue=$(echo "$dataCount" | jq -r '.[0].Count')
                    if [ $countValue -gt 0 ]; then
                      echo "Data is present in the Log Analytics workspace."
                    else
                      echo "No data is present in the Log Analytics workspace."
                      exit -1
                    fi
                else
                    echo "Container Insights is not enabled on the AKS cluster."
                    exit 1
                fi