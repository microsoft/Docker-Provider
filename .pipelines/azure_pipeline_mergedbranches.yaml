      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)), eq(variables['1espt.codesignvalidation.enforced'], true), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'), ne(True, false))
      continueOnError: true
      timeoutInMinutes: 10
      inputs:
