             docker manifest push containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)
             Write-Host "##vso[task.logissue type=warning]Windows image built with tag: containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)"
          }
