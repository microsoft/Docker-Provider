    - task: securedevelopmentteam.vss-secure-development-tools.build-task-binskim.BinSkim@4
      displayName: "\U0001F6E1 Guardian: BinSkim 4.3.1"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_BINSKIM_ENABLED'], 'false'), ne(variables['ONEES_SKIP_BINSKIM'], true), succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)), or(ne('', ''), eq(variables['SDL_BINSKIM_ENABLED'], true), ne('4.3.1', '')))
      continueOnError: false
      inputs:
        TargetPattern: guardianGlob
        AnalyzeTargetGlob: $(ONEES_BINSKIM_TARGETS)
        AnalyzeConfigPath: default
        AnalyzeRecurse: false
        AnalyzeHashes: true
        AnalyzeStatistics: true
        AnalyzeIgnorePdbLoadError: true
        toolVersion: '4.3.1'
      env:
        GDN_ALLOW_ANALYZE_NO_TARGETS: true
    - task: PowerShell@2
      displayName: "\U0001F6E1 Guardian: Check if enable SpotBugs"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      env:
        OneES_SpotBugsSourcePath: $(Build.ArtifactStagingDirectory)
      inputs:
        targetType: inline
        script: |
          $jarFiles = Get-ChildItem -Path $env:OneES_SpotBugsSourcePath -Force -Filter *.jar -Recurse
          Write-Host "Jar files count: $($jarFiles.Count)"
          if ($jarFiles.Count -gt 0) {
            Write-Host "##vso[task.setvariable variable=SDL_SPOTBUGS_ENABLED;issecret=false]true"
          } else {
            Write-Host "##vso[task.setvariable variable=SDL_SPOTBUGS_ENABLED;issecret=false]false"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-spotbugs.SpotBugs@1
      displayName: "\U0001F6E1 Guardian: SpotBugs"
      target:
        container: host
      condition: eq(variables['SDL_SPOTBUGS_ENABLED'], true)
      continueOnError: false
      inputs:
        inputType: spotBugsSyntax
        targetClassPaths: $(Build.ArtifactStagingDirectory)
        sourcePath: $(Build.SourcesDirectory)
        ruleset: sdlRequired
        effort: max
    - task: PowerShell@2
      displayName: "\U0001F512 Set Artifacts name suffix"
      condition: and(succeeded(), eq(variables['skipScanDir'], false))
      target:
        container: host
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          if ($env:SYSTEM_JOBATTEMPT -gt 1) {
            Write-Host "##vso[task.setvariable variable=GuardianArtifactNameJobAttemptSuffix]_jobAttempt$($env:SYSTEM_JOBATTEMPT)"
          } else {
            Write-Host "##vso[task.setvariable variable=GuardianArtifactNameJobAttemptSuffix]"
          }

          # Temporary workaround for SPMI timeout generating incorrect SARIF
          try {
            if (Test-Path "$(Pipeline.Workspace)\.gdn\.r\sarifpatternmatcher")
            {
              Write-Host "Deleting SPMI SARIF files: $(Pipeline.Workspace)\.gdn\.r\sarifpatternmatcher"
              Remove-Item -Recurse -Force "$(Pipeline.Workspace)\.gdn\.r\sarifpatternmatcher"
            }
          } catch {
            Write-Host "Failed to delete SPMI SARIF files"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-report.SdtReport@2
      displayName: "\U0001F6E1 Guardian: Security Analysis Report"
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      target:
        container: host
      continueOnError: true
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
        GDN_HYDRATE_RESULT_SETS: true
        GDN_SUPPRESS_HYDRATION_WARNING: true
      inputs:
        GdnExportPolicy: Microsoft
        GdnExportVstsConsole: false
        GdnExportSarifFile: true
        GdnExportTsvFile: false
        GdnExportHtmlFile: true
        GdnExportAllTools: true
        GdnExportOutputBaselineFile: $(Pipeline.Workspace)\.gdn\r\.gdnbaselines
        GdnExportOutputBaseline: default
        GdnExportOutputSuppressionFile: $(Pipeline.Workspace)\.gdn\r\.gdnsuppress
        GdnExportOutputSuppressionSet: default
        GdnExportBaselines: default
        GdnExportSuppressionFiles: ''
        GdnExportSuppressionSets: default
        GdnExportPolicyMinSev: Error
        GdnExportGdnToolCredScanSeverity: Default
        GdnExportGdnToolArmorySeverity: Default
        GdnExportGdnToolApiScanSeverity: Default
        GdnExportGdnToolBinSkimSeverity: Default
        GdnExportGdnToolCodesignValidationSeverity: Default
        GdnExportGdnToolFxCopSeverity: Default
        GdnExportGdnToolRoslynAnalyzersSeverity: Default
        GdnExportGdnToolSemmleSeverity: Default
        GdnExportGdnToolSpotBugsSeverity: Default
        GdnExportGdnToolSDLNativeRulesSeverity: Default
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
      displayName: "\U0001F6E1 Guardian: Publish SDL Logs to Artifacts"
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      target:
        container: host
      continueOnError: true
      inputs:
        AllTools: true
        ArtifactName: $(OneES_PublishLogsArtifactName)$(GuardianArtifactNameJobAttemptSuffix)
        ArtifactType: Container
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@2
      displayName: "\U0001F6E1 Guardian: Post Analysis"
      condition: and(succeeded(), eq(variables['skipScanDir'], false))
      target:
        container: host
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
      inputs:
        GdnBreakAllTools: false
        GdnBreakPolicy: Microsoft
        GdnBreakPolicyMinSev: Error
        GdnBreakDisableFlighting: False
        GdnBreakGdnToolCredScanSeverity: Default
        GdnBreakGdnToolArmorySeverity: Default
        GdnBreakGdnToolApiScanSeverity: Default
        GdnBreakGdnToolBinSkimSeverity: Default
        GdnBreakGdnToolCodesignValidationSeverity: Default
        GdnBreakGdnToolFxCopSeverity: Default
        GdnBreakGdnToolRoslynAnalyzersSeverity: Default
        GdnBreakGdnToolSemmleSeverity: Default
        GdnBreakGdnToolSpotBugsSeverity: Default
        GdnBreakGdnToolSDLNativeRulesSeverity: Default
        GdnBreakGdnToolCredScan: $(OneES_AutoBaseline_credscan_break)
        GdnBreakGdnToolFortifySca: false
        GdnBreakGdnToolModernCop: false
        GdnBreakGdnToolPoliCheck: false
        GdnBreakGdnToolCodesignValidation: False
        GdnBreakGdnToolSpotBugs: $(OneES_AutoBaseline_spotBugs_break)
        GdnBreakGdnToolArmory: false
        GdnBreakGdnToolSemmle: false
        GdnBreakGdnToolTSLint: False
        GdnBreakGdnToolApiScan: False
        GdnBreakGdnToolBinSkim: $(OneES_AutoBaseline_binskim_break)
        GdnBreakGdnToolRoslynAnalyzers: $(OneES_AutoBaseline_roslyn_break)
        GdnBreakGdnToolFxCop: True
        GdnBreakGdnToolSDLNativeRules: $(OneES_AutoBaseline_prefast_break)
        GdnBreakBaselineFiles: $(OneES_Local_Fallback_Retail_Baseline_File_Path)
