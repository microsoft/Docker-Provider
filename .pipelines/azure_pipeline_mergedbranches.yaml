    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: "\U0001F6E1 Generate SBoM Manifest"
      target:
        container: host
      continueOnError: True
      timeoutInMinutes: 30
      condition: succeeded()
      env:
        GENERATESPDX_22_SBOM: true
        DeleteManifestDirIfPresent: true
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)
        BuildComponentPath: $(Pipeline.Workspace)
        DockerImagesToScan: ''
        AdditionalComponentDetectorArgs: ''
        Verbosity: 'Verbose'
        PackageName: ''
        PackageVersion: ''
  - job: build_windows_2019
    timeoutInMinutes: 120
    dependsOn:
    - common
    variables:
    - name: OneESPT
      value: true
      readonly: true
    - name: OneESPT.BuildType
      value: Official
      readonly: true
    - name: OneESPT.OS
      value: windows
      readonly: true
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: skipComponentGovernanceDetection
      value: false
    - name: windowsImageTag
      value: $[ dependencies.common.outputs['setup.windowsImageTag'] ]
    - name: windowsTelemetryTag
      value: $[ dependencies.common.outputs['setup.windowsTelemetryTag'] ]
    - name: windows2019BaseImageVersion
      value: ltsc2019
    - name: Codeql.Enabled
      value: true
    - name: Codeql.BuildIdentifier
      value: windowsbuild
    - name: windowsAMAUrl
      value: $[ dependencies.common.outputs['setup.windowsAMAUrl'] ]
    - name: OneES_targetName
      value: host
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: true
    - task: 1ESGPTRunTask@3.0.342
      displayName: Validate Hosted Pool Information (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        HOST_ARCHITECTURE: amd64
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_DEFINITIONID: $(System.DefinitionId)
        SYSTEM_COLLECTIONURI: $(System.CollectionUri)
        SYSTEM_TEAMPROJECT: $(System.TeamProject)
        SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
        BUILD_REPOSITORY_ID: $(Build.Repository.ID)
        BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
        PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
        PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
      inputs:
        repoId: microsoft/Docker-Provider
        path: validateHostedPool.ps1
        arguments: '-TargetName $(OneES_targetName) -StepTargets [] -StepsLength 14 -SkipStatelessValidation False -OS windows -IsOfficialTemplate -IgnoreProductionPoolCheck '
    - task: CodeQL3000Init@0
      displayName: "\U0001F6E1 CodeQL Initialize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])), ne(variables['ONEESPT_CODEQL_HAS_INITIALIZED'], true))
      target:
        container: host
      continueOnError: true
      inputs:
        Enabled: true
        BuildIdentifier: stage_build_windows_2019
        LanguageDetectorFilter: compiled
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: 'Start Network Isolation'
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Enforce
    - task: PowerShell@2
      inputs:
        targetType: filePath
        filePath: $(System.DefaultWorkingDirectory)/scripts/build/windows/install-build-pre-requisites.ps1
      target:
        container: host
      displayName: install prereqs
    - task: CodeQL3000Init@0
      condition: eq(variables.IS_MAIN_BRANCH, true)
      target:
        container: host
      displayName: CodeQL3000Init@0
    - task: CmdLine@2
      inputs:
        script: >
          setlocal enabledelayedexpansion

          powershell.exe -ExecutionPolicy Unrestricted -NoProfile -WindowStyle Hidden -File "build\windows\Makefile.ps1"

          endlocal

          exit /B %ERRORLEVEL%
      target:
        container: host
      displayName: build base
    - task: AzureCLI@2
      inputs:
        azureSubscription: ci-1es-acr-connection
        scriptType: ps
        scriptLocation: inlineScript
        retryCountOnTaskFailure: 2
        inlineScript: >
          mkdir -p $(Build.ArtifactStagingDirectory)/windows

          cd kubernetes/windows

          az --version

          az account show

          az account set -s 9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb

          az acr login -n containerinsightsprod

          docker build --isolation=hyperv --tag containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)-$(windows2019BaseImageVersion)-unsigned --build-arg WINDOWS_VERSION=$(windows2019BaseImageVersion) --build-arg IMAGE_TAG=$(windowsTelemetryTag) --build-arg WINDOWS_AMA_URL=$(windowsAMAUrl) .
      target:
        container: host
      displayName: Docker windows build for ltsc2019
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: >
          echo "Creating docker container"

          docker create --name signingContainer containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)-$(windows2019BaseImageVersion)-unsigned

          echo "Creating fist party directory"

          mkdir -p $(Build.ArtifactStagingDirectory)/fpSigning

          cd $(Build.ArtifactStagingDirectory)/fpSigning

          echo "Extract CertificateGenerator"

          docker cp signingContainer:C:\opt\amalogswindows\certgenerator\CertificateGenerator.exe .

          docker cp signingContainer:C:\opt\amalogswindows\certgenerator\CertificateGenerator.dll .

          echo "Extract LivenessProbe"

          docker cp signingContainer:C:\opt\amalogswindows\scripts\cmd\livenessprobe.exe .

          echo "Extract ps scripts"

          docker cp signingContainer:C:\opt\amalogswindows\scripts\powershell .

          echo "Creating OSS directory"

          mkdir -p $(Build.ArtifactStagingDirectory)/ossSigning

          cd $(Build.ArtifactStagingDirectory)/ossSigning

          echo "Extract CertificateGenerator"

          docker cp signingContainer:C:\opt\amalogswindows\certgenerator\BouncyCastle.Crypto.dll .

          docker cp signingContainer:C:\opt\amalogswindows\certgenerator\Newtonsoft.Json.dll .

          echo "Extract fluent-bit"

          docker cp signingContainer:C:\opt\fluent-bit .

          echo "Extract Ruby"

          docker cp signingContainer:C:\ruby31 .

          echo "Extract telegraf"

          docker cp signingContainer:C:\opt\telegraf\telegraf.exe .

          echo "Extract out oms"

          docker cp signingContainer:C:\opt\amalogswindows\out_oms.so .

          echo "Extract containerinventory.so"

          docker cp signingContainer:C:\opt\fluent-bit\bin\containerinventory.so .

          echo "Extract perf.so"

          docker cp signingContainer:C:\opt\fluent-bit\bin\perf.so .

          echo "Removing container"

          docker rm signingContainer

          echo "List ArtifactStagingDirectory"

          ls $(Build.ArtifactStagingDirectory)

          ls .
      target:
        container: host
      displayName: Extract files to sign
    - task: CmdLine@2
      inputs:
        script: dir $(System.DefaultWorkingDirectory)
      target:
        container: host
      displayName: List files in DefaultWorking Directory
    - task: CmdLine@2
      inputs:
        script: dir $(Build.ArtifactStagingDirectory)
      target:
        container: host
      displayName: List files in Staging Directory
    - task: EsrpCodeSigning@5
      inputs:
        ConnectedServiceName: AME ESRPContainerInsights MSI Service Connection
        AppRegistrationClientId: $(appRegistrationClientId)
        AppRegistrationTenantId: $(appRegistrationTenantId)
        AuthAKVName: $(authAKVName)
        AuthCertName: $(authCertName)
        AuthSignCertName: $(authSignCertName)
        FolderPath: $(Build.ArtifactStagingDirectory)/fpSigning
        Pattern: '*.dll,*.exe,*.so,*.ps1'
        signConfigType: inlineSignParams
        inlineOperation: >
          [
                  {
                      "KeyCode" : "CP-230012",
                      "OperationCode" : "SigntoolSign",
                      "Parameters" : {
                          "OpusName" : "Microsoft",
                          "OpusInfo" : "http://www.microsoft.com",
                          "FileDigest" : "/fd \"SHA256\"",
                          "PageHash" : "/NPH",
                          "TimeStamp" : "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                      },
                      "ToolName" : "sign",
                      "ToolVersion" : "1.0"
                  },
                  {
                      "KeyCode" : "CP-230012",
                      "OperationCode" : "SigntoolVerify",
                      "Parameters" : {},
                      "ToolName" : "sign",
                      "ToolVersion" : "1.0"
                  }
              ]
        SessionTimeout: 60
        MaxConcurrency: 50
        MaxRetryAttempts: 5
      target:
        container: host
      displayName: EsrpCodeSigning for first party
    - task: EsrpCodeSigning@5
      inputs:
        ConnectedServiceName: AME ESRPContainerInsights MSI Service Connection
        AppRegistrationClientId: $(appRegistrationClientId)
        AppRegistrationTenantId: $(appRegistrationTenantId)
        AuthAKVName: $(authAKVName)
        AuthCertName: $(authCertName)
        AuthSignCertName: $(authSignCertName)
        FolderPath: $(Build.ArtifactStagingDirectory)/ossSigning
        Pattern: '*.dll,*.exe,*.so'
        signConfigType: inlineSignParams
        inlineOperation: >
          [
                  {
                      "KeyCode" : "CP-231522",
                      "OperationCode" : "SigntoolSign",
                      "Parameters" : {
                          "OpusName" : "Microsoft",
                          "OpusInfo" : "http://www.microsoft.com",
                          "Append" : "/as",
                          "FileDigest" : "/fd \"SHA256\"",
                          "PageHash" : "/NPH",
                          "TimeStamp" : "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                      },
                      "ToolName" : "sign",
                      "ToolVersion" : "1.0"
                  },
                  {
                      "KeyCode" : "CP-231522",
                      "OperationCode" : "SigntoolVerify",
                      "Parameters" : {},
                      "ToolName" : "sign",
                      "ToolVersion" : "1.0"
                  }
              ]
        SessionTimeout: 60
        MaxConcurrency: 50
        MaxRetryAttempts: 5
      target:
        container: host
      displayName: EsrpCodeSigning for OSS
    - task: BinSkim@4
      retryCountOnTaskFailure: 1
      inputs:
        InputType: CommandLine
        arguments: analyze --rich-return-code $(Build.ArtifactStagingDirectory)\ossSigning\out_oms.so $(Build.ArtifactStagingDirectory)\ossSigning\perf.so $(Build.ArtifactStagingDirectory)\ossSigning\containerinventory.so $(Build.ArtifactStagingDirectory)\fpSigning\livenessprobe.exe $(Build.ArtifactStagingDirectory)\fpSigning\CertificateGenerator.exe $(Build.ArtifactStagingDirectory)\fpSigning\CertificateGenerator.dll
      target:
        container: host
      displayName: 'SDL: run binskim'
    - task: PoliCheck@2
      inputs:
        targetType: F
        targetArgument: $(Build.SourcesDirectory)
      target:
        container: host
      displayName: 'SDL : Run PoliCheck'
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: >
          docker create --name pushContainer containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)-$(windows2019BaseImageVersion)-unsigned

          echo "Copy Signed binaries/folders back to docker image"

          docker cp $(Build.ArtifactStagingDirectory)/fpSigning/CertificateGenerator.exe pushContainer:C:\opt\amalogswindows\certgenerator\CertificateGenerator.exe

          docker cp $(Build.ArtifactStagingDirectory)/fpSigning/CertificateGenerator.dll pushContainer:C:\opt\amalogswindows\certgenerator\CertificateGenerator.dll

          docker cp $(Build.ArtifactStagingDirectory)/fpSigning/livenessprobe.exe pushContainer:C:\opt\amalogswindows\scripts\cmd\livenessprobe.exe

          docker cp $(Build.ArtifactStagingDirectory)/fpSigning/powershell/. pushContainer:C:\opt\amalogswindows\scripts\powershell/

          docker cp $(Build.ArtifactStagingDirectory)/ossSigning/BouncyCastle.Crypto.dll pushContainer:C:\opt\amalogswindows\certgenerator\BouncyCastle.Crypto.dll

          docker cp $(Build.ArtifactStagingDirectory)/ossSigning/Newtonsoft.Json.dll pushContainer:C:\opt\amalogswindows\certgenerator\Newtonsoft.Json.dll

          docker cp $(Build.ArtifactStagingDirectory)/ossSigning/fluent-bit/. pushContainer:C:\opt\fluent-bit/

          docker cp $(Build.ArtifactStagingDirectory)/ossSigning/ruby31/. pushContainer:C:\ruby31/

          docker cp $(Build.ArtifactStagingDirectory)/ossSigning/telegraf.exe pushContainer:C:\opt\telegraf\telegraf.exe

          docker cp $(Build.ArtifactStagingDirectory)/ossSigning/out_oms.so pushContainer:C:\opt\amalogswindows\out_oms.so

          docker commit pushContainer containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)-$(windows2019BaseImageVersion)

          docker rm pushContainer
      target:
        container: host
      displayName: Replace files in origin Image
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: >
          if ("$(Build.Reason)" -ne "PullRequest") {
            docker push containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)-$(windows2019BaseImageVersion)
          }
      target:
        container: host
      displayName: Push Docker Image
    - task: CodeQL3000Finalize@0
      condition: eq(variables.IS_MAIN_BRANCH, true)
      target:
        container: host
      displayName: CodeQL3000Finalize@0
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: 'Stop Network Isolation'
      condition: always()
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Stop
    - task: CodeQL3000Finalize@0
      displayName: "\U0001F6E1 CodeQL Finalize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
