        # - task: AzureCLI@2
        #   displayName: "Set up acr for windows nano server ltsc2025 build"
        #   inputs:
        #     azureSubscription: ${{ variables.armServiceConnectionName }}
        #     scriptType: ps
        #     scriptLocation: inlineScript
        #     retryCountOnTaskFailure: 2
        #     inlineScript: |
        #       az --version
        #       az account show
        #       az account set -s ${{ variables.subscription }}
        #       az acr login -n ${{ variables.containerRegistry }}
        - task: PowerShell@2          
          inputs:
            targetType: 'inline'
            script: |
              Write-Host "=== Docker Build Setup for Windows 2025 ===" -ForegroundColor Cyan
              
              # Check if directory exists and remove it before creating it to handle retry scenarios
              if (Test-Path -Path "$(Build.ArtifactStagingDirectory)/windows") {
                Remove-Item -Path "$(Build.ArtifactStagingDirectory)/windows" -Recurse -Force
              }
              New-Item -Path "$(Build.ArtifactStagingDirectory)/windows" -ItemType Directory -Force
              
              # Function to install Docker if not found
              function Install-DockerFallback {
                  Write-Host "Installing Docker as fallback..." -ForegroundColor Yellow
                  
                  # Check if chocolatey is available first
                  $chocoAvailable = $false
                  try {
                      $chocoVersion = & choco --version 2>&1
                      if ($LASTEXITCODE -eq 0) {
                          $chocoAvailable = $true
                          Write-Host "Chocolatey is available: $chocoVersion"
                      }
                  } catch {
                      Write-Host "Chocolatey not available, will use direct download"
                  }
                  
                  if ($chocoAvailable) {
                      try {
                          Write-Host "Attempting Docker installation via Chocolatey..."
                          choco install docker-desktop -y --no-progress --force
                          Write-Host "Docker Desktop installed via Chocolatey" -ForegroundColor Green
                          Start-Sleep -Seconds 30
                      } catch {
                          Write-Host "Chocolatey installation failed: $($_.Exception.Message)" -ForegroundColor Red
                          $chocoAvailable = $false
                      }
                  }
                  
                  if (-not $chocoAvailable) {
                      Write-Host "Using direct Docker Desktop download..."
                      $tempDir = $env:TEMP
                      $dockerTemp = Join-Path -Path $tempDir -ChildPath "docker_fallback"
                      New-Item -Path $dockerTemp -ItemType "directory" -Force -ErrorAction SilentlyContinue
                      
                      $url = "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"
                      $output = Join-Path -Path $dockerTemp -ChildPath "docker-desktop-installer.exe"
                      
                      Write-Host "Downloading Docker Desktop installer..."
                      Invoke-WebRequest -Uri $url -OutFile $output -ErrorAction Stop
                      
                      Write-Host "Installing Docker Desktop..."
                      Start-Process $output -Wait -ArgumentList 'install', '--quiet', '--accept-license'
                      Write-Host "Docker Desktop installation completed"
                  }
                  
                  # Give installation time to complete
                  Write-Host "Waiting for Docker installation to complete..."
                  Start-Sleep -Seconds 45
                  
                  # Try to start Docker Desktop
                  $dockerDesktopPaths = @(
                      "C:\Program Files\Docker\Docker\Docker Desktop.exe",
                      "C:\Program Files (x86)\Docker\Docker\Docker Desktop.exe"
                  )
                  
                  foreach ($dockerDesktopPath in $dockerDesktopPaths) {
                      if (Test-Path $dockerDesktopPath) {
                          Write-Host "Starting Docker Desktop from: $dockerDesktopPath"
                          try {
                              Start-Process -FilePath $dockerDesktopPath -WindowStyle Hidden
                              Write-Host "Docker Desktop started successfully"
                              Start-Sleep -Seconds 90  # Extended wait for Docker to fully start
                              break
                          } catch {
                              Write-Host "Failed to start Docker Desktop: $($_.Exception.Message)"
                          }
                      }
                  }
              }
              
              # Function to search for Docker installations more thoroughly
              function Find-DockerInstallation {
                  Write-Host "Performing comprehensive Docker search..."
                  
                  # Extended list of possible Docker locations
                  $dockerPaths = @(
                      "C:\Program Files\Docker\Docker\resources\bin",
                      "C:\ProgramData\DockerDesktop\version-bin",
                      "C:\Program Files\Docker\Docker\Resources\bin",
                      "C:\Program Files (x86)\Docker\Docker\resources\bin",
                      "C:\Windows\System32",
                      "C:\Docker\bin"
                  )
                  
                  foreach ($path in $dockerPaths) {
                      $dockerExe = Join-Path $path "docker.exe"
                      if (Test-Path $dockerExe) {
                          Write-Host "Found Docker executable at: $dockerExe" -ForegroundColor Green
                          
                          # Add to PATH if not already there
                          if ($env:PATH -notlike "*$path*") {
                              $env:PATH = "$path;$env:PATH"
                              Write-Host "Added $path to PATH"
                          }
                          
                          # Test if it works
                          try {
                              $dockerVersion = & $dockerExe --version 2>&1
                              if ($LASTEXITCODE -eq 0) {
                                  Write-Host "SUCCESS: Docker is working: $dockerVersion" -ForegroundColor Green
                                  return $dockerExe
                              }
                          } catch {
                              Write-Host "Docker executable found but not working from: $dockerExe"
                          }
                      }
                  }
                  
                  return $null
              }
              
              # Verify Docker is accessible
              Write-Host "Checking Docker availability..."
              $dockerFound = $false
              $dockerExecutable = "docker"
              $maxRetries = 5  # Increased retries
              $retryCount = 0
              
              while (-not $dockerFound -and $retryCount -lt $maxRetries) {
                  $retryCount++
                  Write-Host "Docker discovery attempt $retryCount of $maxRetries"
                  
                  # Test 1: Try direct docker command
                  try {
                      $dockerVersion = & docker --version 2>&1
                      if ($LASTEXITCODE -eq 0) {
                          Write-Host "SUCCESS: Docker found via PATH: $dockerVersion" -ForegroundColor Green
                          $dockerFound = $true
                          $dockerExecutable = "docker"
                          break
                      }
                  } catch {
                      Write-Host "Docker not accessible via PATH: $($_.Exception.Message)" -ForegroundColor Red
                  }
                  
                  # Test 2: Comprehensive search for Docker installations
                  if (-not $dockerFound) {
                      $foundDockerExe = Find-DockerInstallation
                      if ($foundDockerExe) {
                          $dockerFound = $true
                          $dockerExecutable = $foundDockerExe
                          break
                      }
                  }
                  
                  # Test 3: Try to start Docker Desktop service
                  if (-not $dockerFound) {
                      Write-Host "Attempting to start Docker Desktop service..."
                      
                      # Check for Docker Desktop in multiple locations
                      $dockerDesktopPaths = @(
                          "C:\Program Files\Docker\Docker\Docker Desktop.exe",
                          "C:\Program Files (x86)\Docker\Docker\Docker Desktop.exe"
                      )
                      
                      $desktopStarted = $false
                      foreach ($dockerDesktopPath in $dockerDesktopPaths) {
                          if (Test-Path $dockerDesktopPath) {
                              Write-Host "Starting Docker Desktop from: $dockerDesktopPath"
                              try {
                                  Start-Process -FilePath $dockerDesktopPath -WindowStyle Hidden
                                  Write-Host "Docker Desktop process started"
                                  $desktopStarted = $true
                                  break
                              } catch {
                                  Write-Host "Failed to start Docker Desktop: $($_.Exception.Message)"
                              }
                          }
                      }
                      
                      if ($desktopStarted) {
                          Write-Host "Waiting for Docker Desktop to initialize..."
                          Start-Sleep -Seconds 75  # Extended wait for Docker Desktop
                          continue  # Retry Docker detection
                      }
                  }
                  
                  # Test 4: Install Docker if needed (only on first retry)
                  if (-not $dockerFound -and $retryCount -eq 1) {
                      Write-Host "Installing Docker as fallback..."
                      Install-DockerFallback
                      Write-Host "Waiting after Docker installation..."
                      Start-Sleep -Seconds 45
                      continue
                  }
                  
                  # Wait before next retry
                  if (-not $dockerFound -and $retryCount -lt $maxRetries) {
                      $waitTime = 30  # Increased wait time
                      Write-Host "Docker not found, waiting $waitTime seconds before retry..." -ForegroundColor Yellow
                      Start-Sleep -Seconds $waitTime
                  }
              }
              
              if (-not $dockerFound) {
                  Write-Error "Docker is not available after $maxRetries attempts. Cannot proceed with Docker build."
                  exit 1
              }
              
              # Test Docker service status
              Write-Host "Verifying Docker service status..."
              try {
                  $dockerInfo = & docker info 2>&1
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "SUCCESS: Docker service is running" -ForegroundColor Green
                  } else {
                      Write-Host "WARNING: Docker executable found but service may not be fully ready" -ForegroundColor Yellow
                      Write-Host "Docker info output: $dockerInfo" -ForegroundColor Gray
                      
                      # Wait a bit longer for Docker to be ready
                      Write-Host "Waiting for Docker service to be ready..."
                      Start-Sleep -Seconds 30
                  }
              } catch {
                  Write-Host "WARNING: Could not check Docker service status" -ForegroundColor Yellow
              }
              
              # Determine Docker executable path for build command
              $dockerExecutable = "docker"
              try {
                  $dockerPath = Get-Command docker -ErrorAction SilentlyContinue
                  if ($dockerPath) {
                      $dockerExecutable = $dockerPath.Source
                      Write-Host "Using Docker executable: $dockerExecutable" -ForegroundColor Green
                  }
              } catch {
                  Write-Host "Using default 'docker' command" -ForegroundColor Yellow
              }
              
              # Navigate to build directory
              Write-Host "Navigating to build directory: kubernetes/windows-nano"
              cd kubernetes/windows-nano
              
              # Build the Docker image using the determined executable path
              Write-Host "Starting Docker build with executable: $dockerExecutable"
              & $dockerExecutable build --isolation=hyperv --tag ${{ variables.repoImageName }}:$(windowsImageTag)-$(windows2025BaseImageVersion)-unsigned --build-arg WINDOWS_VERSION=$(windows2025BaseImageVersion) --build-arg IMAGE_TAG=$(windowsTelemetryTag) --build-arg WINDOWS_AMA_URL=$(windowsAMAUrl) .
          displayName: "Docker windows build for nano server ltsc2025"
          retryCountOnTaskFailure: 2
