      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      continueOnError: true
      target:
        container: host
      timeoutInMinutes: 20
      inputs:
        Action: 'analyze'
        Target: '$(OneES_DirectoryToRunScan)\*'
        TimeoutInSeconds: 900
        MaxFileSizeInKB: 10000
      env:
        DOTNET_ROLL_FORWARD: Major
    - task: 1ESGPTRunTask@3.0.342
      displayName: "\U0001F6E1 Guardian: Set BinSkim targets (1ES PT)"
      continueOnError: false
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_BINSKIM_ENABLED'], 'false'), succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)))
      env:
        OneES_OutputDirectory: $(Build.ArtifactStagingDirectory)
