trigger:
  batch: true
  branches:
    include:
    - ci_prod
pr:
  branches:
    include:
    - ci_prod
variables:
- name: armServiceConnectionName
  value: 'ci-1es-acr-connection'
- name: subscription
  value: '9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb'
- name: containerRegistry
  value: 'containerinsightsprod'
- name: repoImageName
  value: containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev
- name: IS_PR
  value: $[eq(variables['Build.Reason'], 'PullRequest')]
- name: IS_MAIN_BRANCH
  value: $[eq(variables['Build.SourceBranchName'], 'ci_prod')]
- name: IS_RELEASE
  value: $[ne(variables['TELEMETRY_TAG'], '')]
- name: appRegistrationClientId
  value: $[variables['APP_REGISTRATION_CLIENT_ID']]
- name: appRegistrationTenantId
  value: $[variables['APP_REGISTRATION_TENANT_ID']]
- name: authAKVName
  value: $[variables['AUTH_AKV_NAME']]
- name: authCertName
  value: $[variables['AUTH_CERT_NAME']]
- name: authSignCertName
  value: $[variables['AUTH_SIGN_CERT_NAME']]
resources:
  containers: []
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
stages:
- stage: stage
  pool:
    name: Azure-Pipelines-Windows-CI-Test-EO
    os: windows
  jobs:
  - job: common
    displayName: "Build: Common"
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    templateContext:
      outputs:
      - output: pipelineArtifact
        displayName: 'Ev2: publish Ev2 deployment artifacts'
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifactName: ev2-drop
    variables:
    - name: OneESPT
      value: true
      readonly: true
    - name: OneESPT.BuildType
      value: Official
      readonly: true
    - name: OneESPT.OS
      value: windows
      readonly: true
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: skipComponentGovernanceDetection
      value: true
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: OneES_targetName
      value: host
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: true
    - task: 1ESGPTRunTask@3.0.342
      displayName: Validate Hosted Pool Information (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        HOST_ARCHITECTURE: amd64
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_DEFINITIONID: $(System.DefinitionId)
        SYSTEM_COLLECTIONURI: $(System.CollectionUri)
        SYSTEM_TEAMPROJECT: $(System.TeamProject)
        SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
        BUILD_REPOSITORY_ID: $(Build.Repository.ID)
        BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
        PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
        PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
      inputs:
        repoId: microsoft/Docker-Provider
        path: validateHostedPool.ps1
        arguments: '-TargetName $(OneES_targetName) -StepTargets [] -StepsLength 9 -SkipStatelessValidation False -OS windows -IsOfficialTemplate -IgnoreProductionPoolCheck '
    - task: CodeQL3000Init@0
      displayName: "\U0001F6E1 CodeQL Initialize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])), ne(variables['ONEESPT_CODEQL_HAS_INITIALIZED'], true))
      target:
        container: host
      continueOnError: true
      inputs:
        Enabled: true
        BuildIdentifier: stage_common
        LanguageDetectorFilter: compiled
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: 'Start Network Isolation'
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Enforce
    - task: ComponentGovernanceComponentDetection@0
      target:
        container: host
      displayName: ComponentGovernanceComponentDetection@0
    - task: Bash@3
      name: setup
      inputs:
        targetType: inline
        script: >
          commit=$(git describe)

          datetime=$(date +%Y%m%d%H%M%S)

          linuxImagetag="$commit"-"$datetime"

          windowsImageTag=win-"$commit"-"$datetime"

          telemetryTag=$linuxImagetag

          if [ -z "$TELEMETRY_TAG" ]
            then
              echo "\$TELEMETRY_TAG variable is not set"
            else
              telemetryTag=$TELEMETRY_TAG
              echo "\$TELEMETRY_TAG is $TELEMETRY_TAG"
          fi

          linuxTelemetryTag="$telemetryTag"

          windowsTelemetryTag=win-"$telemetryTag"

          echo "linuxImagetag is $linuxImagetag"

          echo "windowsImageTag is $windowsImageTag"

          echo "linuxTelemetryTag is $linuxTelemetryTag"

          echo "windowsTelemetryTag is $windowsTelemetryTag"

          echo "##vso[task.setvariable variable=linuxImagetag;isOutput=true]$linuxImagetag"

          echo "##vso[task.setvariable variable=windowsImageTag;isOutput=true]$windowsImageTag"

          echo "##vso[task.setvariable variable=linuxTelemetryTag;isOutput=true]$linuxTelemetryTag"

          echo "##vso[task.setvariable variable=windowsTelemetryTag;isOutput=true]$windowsTelemetryTag"

          echo "appRegistrationClientId is $APP_REGISTRATION_CLIENT_ID"

          echo "appRegistrationTenantId is $APP_REGISTRATION_TENANT_ID"

          echo "authAKVName is $AUTH_AKV_NAME"

          echo "authCertName is $AUTH_CERT_NAME"

          echo "authSignCertName is $AUTH_SIGN_CERT_NAME"

          cd $(Build.SourcesDirectory)/deployment/mergebranch-multiarch-agent-deployment/ServiceGroupRoot/Scripts

          tar -czvf ../artifacts.tar.gz pushAgentToAcr.sh

          cd $(Build.SourcesDirectory)/deployment/arc-k8s-extension/ServiceGroupRoot/Scripts

          tar -czvf ../artifacts.tar.gz ../../../../charts/azuremonitor-containers/ pushChartToAcr.sh

          cd $(Build.SourcesDirectory)/deployment/arc-k8s-extension-release-v2/ServiceGroupRoot/Scripts

          tar -czvf ../artifacts.tar.gz arcExtensionRelease.sh

          windowsAMAUrl=""

          if [ -z "$WINDOWS_AMA_URL" ]
            then
              echo "\$WINDOWS_AMA_URL variable is not set"
            else
              windowsAMAUrl=$WINDOWS_AMA_URL
              echo "\$WINDOWS_AMA_URL is $WINDOWS_AMA_URL"
          fi

          echo "##vso[task.setvariable variable=windowsAMAUrl;isOutput=true]$windowsAMAUrl"
      target:
        container: host
      displayName: Bash@3
    - task: CredScan@3
      target:
        container: host
      displayName: 'SDL : Run credscan'
    - task: CopyFiles@2
      inputs:
        SourceFolder: $(Build.SourcesDirectory)/deployment
        Contents: >
          **/*
        TargetFolder: $(Build.ArtifactStagingDirectory)/build
      target:
        container: host
      displayName: Copy ev2 deployment artifacts
    - task: CopyFiles@2
      inputs:
        SourceFolder: $(Build.SourcesDirectory)/.pipelines
        Contents: >
          **/*.sh
        TargetFolder: $(Build.ArtifactStagingDirectory)/build
      target:
        container: host
      displayName: Copy ev2 deployment scripts
    - task: CopyFiles@2
      inputs:
        SourceFolder: $(Build.SourcesDirectory)/kubernetes
        Contents: >
          *.yaml
        TargetFolder: $(Build.ArtifactStagingDirectory)/build
      target:
        container: host
      displayName: Copy ev2 deployment scripts
    - task: CopyFiles@2
      inputs:
        SourceFolder: $(Build.SourcesDirectory)/charts
        Contents: >
          **/*
        TargetFolder: $(Build.ArtifactStagingDirectory)/build
      target:
        container: host
      displayName: Copy ev2 deployment scripts
    - task: CopyFiles@2
      inputs:
        SourceFolder: $(Build.SourcesDirectory)/test/e2e
        Contents: >
          *.yaml
        TargetFolder: $(Build.ArtifactStagingDirectory)/build
      target:
        container: host
      displayName: Copy ev2 deployment scripts
    - task: Armory@2
      inputs:
        toolVersion: Latest
        targetDirectory: $(Build.SourcesDirectory)
      target:
        container: host
      displayName: Run ARMory
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: 'Stop Network Isolation'
      condition: always()
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Stop
    - task: CodeQL3000Finalize@0
      displayName: "\U0001F6E1 CodeQL Finalize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
    - task: 1ESGPTRunTask@3.0.342
      displayName: SDL Binary Analysis Checks (1ES PT)
      continueOnError: false
      target:
        container: host
      condition: succeeded()
      env:
        SCAN_DIRECTORY: $(Build.ArtifactStagingDirectory)
      inputs:
        repoId: microsoft/Docker-Provider
        path: sdlBinaryAnalysisChecks.ps1
        arguments: '-PublishLogsArtifactName drop_stage_common_sdl_analysis '
    - task: 1ESGPTRunTask@3.0.342
      displayName: Get GitHub Token (1ES PT)
      continueOnError: true
      target:
        container: host
      condition: and( succeeded(), eq(variables['skipScanDir'], false), contains(variables['Build.Repository.Uri'], 'github.com'))
      inputs:
        repoId: microsoft/Docker-Provider
        path: get_github_token.py
    - task: 1ESGPTRunTask@3.0.342
      displayName: Auto-baselining mode and SDL pre-checks (1ES PT)
      continueOnError: true
      target:
        container: host
      condition: succeeded()
      env:
        categories: retail.binary
        condition: and( succeeded(), eq(variables['skipScanDir'], false) )
        isMultirepoScenario: False
        enableMultirepoScenario: True
        autoBaselineFeatureFlag: ''
        credscanEnabled: True
        policheckEnabled: False
        eslintEnabled: True
        banditEnabled: False
        csrfEnabled: False
        psscriptanalyzerEnabled: True
        armoryEnabled: True
        binskimEnabled: True
        prefastEnabled: False
        spotbugsEnabled: True
        roslynEnabled: False
        localRetailBaselineFilePath: $(Build.SourcesDirectory)/.config/guardian/.gdnbaselines
        systemAccessToken: $(System.AccessToken)
        systemCollectionUri: $(System.CollectionUri)
        systemTeamProject: $(System.TeamProject)
        systemDefinitionId: $(System.DefinitionId)
        buildSourceVersion: $(Build.SourceVersion)
        buildSourceBranch: $(Build.SourceBranch)
        buildSourcesDirectory: $(Build.SourcesDirectory)
        buildRepositoryId: $(Build.Repository.ID)
        buildRepositoryName: $(Build.Repository.Name)
        buildRepositoryProvider: $(Build.Repository.Provider)
        pipelineWorkspace: $(Pipeline.Workspace)
        toolsToUpdateAfterCertainDate: retail.binary.credscan:2024-02-29,retail.binary.binskim:2024-02-29,retail.binary.prefast:2024-02-29,retail.binary.spotbugs:2024-02-29,retail.binary.roslyn:2024-02-29
        toolsToAddOnlyNewResultsAfterCertainDate: retail.binary.binskim:2025-03-03,retail.binary.prefast:2025-03-03
        deleteBaselineEntriesBeforeDate: 2024-02-29 00:00:00Z
        credscanBreak: True
        policheckBreak: True
        eslintBreak: True
        banditBreak: False
        csrfBreak: False
        psscriptanalyzerBreak: True
        armoryBreak: True
        binskimBreak: True
        prefastBreak: False
        spotbugsBreak: True
        roslynBreak: True
        GDN_CB_TEMPLATE_INTERNAL: $(GDN_CB_TEMPLATE)
        isOfficial: True
        disableAutoBaselineOnNonDefaultBranches: False
        isMainPipeline: False
        skipUsingMainPipelineConfig: False
        agentOS: windows
        githubToken: $(OneES_GITHUB_TOKEN)
        enableForGitHub: True
        isForkedBuild: $(System.PullRequest.IsFork)
        useGitOps: True
      inputs:
        repoId: microsoft/Docker-Provider
        path: autobaselining_mode_and_sdl_breakglass_checks.py
    - task: PublishPipelineArtifact@1
      displayName: Publish new tools list (1ES PT)
      condition: and( succeeded(), eq(variables['skipScanDir'], false), ne('', variables['OneES_AutoBaseline_MetadataFolder']) )
      continueOnError: true
      inputs:
        artifactName: 1espt-autobaseline-stage-common
        targetPath: $(OneES_AutoBaseline_MetadataFolder)
    - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
      displayName: "\U0001F6E1 Component Governance"
      condition: and(ne(variables['ONEES_ENFORCED_COMPONENTGOVERNANCE_ENABLED'], 'false'), and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)), and(succeeded(), and(eq(variables['OneES_JobScannedCount'], 0), eq(variables['skipScanDir'], false), not(False))) ))
      target:
        container: host
      inputs:
        scanType: 'Register'
        verbosity: Verbose
        sourceScanPath: '$(Build.SourcesDirectory)'
        ignoreDirectories: ''
        alertWarningLevel: ''
        failOnAlert: ''
    - task: 1ESGPTRunTask@3.0.342
      displayName: "\U0001F512 Setup AntiMalware (1ES PT)"
      continueOnError: true
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ANTIMALWARESCAN_ENABLED'], 'false'), and(succeeded(), eq(variables['skipScanDir'], false)))
      env:
        OneES_AntiMalware_DirectoryToScan: $(Build.ArtifactStagingDirectory)
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
      inputs:
        repoId: microsoft/Docker-Provider
        path: setupAntiMalware.ps1
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-antimalware.AntiMalware@4
      displayName: "\U0001F6E1 Guardian: AntiMalware Scanner (Binary)"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ANTIMALWARESCAN_ENABLED'], 'false'), and(succeeded(), eq(variables['skipScanDir'], false)))
      inputs:
        InputType: 'Basic'
        ScanType: 'CustomScan'
        FileDirPath: $(Build.ArtifactStagingDirectory)
        EnableServices: true
        SupportLogOnError: true
        TreatSignatureUpdateFailureAs: 'Warning'
        SignatureFreshness: 'OneDay'
        TreatStaleSignatureAs: 'Error'
        AcceptableOutdatedSignatureInHours: 72
        TreatAcceptableOutdatedSignatureAs: 'Warning'
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-codesignvalidation.CodeSign@1
      displayName: "\U0001F6E1 Guardian: CodeSign Validation"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)), eq(variables['1espt.codesignvalidation.enforced'], true), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'), ne(True, false))
      continueOnError: true
      timeoutInMinutes: 10
      inputs:
        Path: $(Build.ArtifactStagingDirectory)
        MaxThreads: $(OneES_UsableProcessorCount)
        FailIfNoTargetsFound: false
        ExcludePassesFromLog: False
        Targets: f|**\*.dll;f|**\*.exe;f|**\*.sys;f|**\*.ps1;f|**\*.psm1;f|**\*.ps1xml;f|**\*.psc1;f|**\*.psd1;f|**\*.cdxml;f|**\*.vbs;f|**\*.js;f|**\*.wsf;-|.gdn\**;
    - task: 1ESGPTRunTask@3.0.342
      displayName: "\U0001F6E1 Guardian: Check CodeSign Validation Results (1ES PT)"
      continueOnError: true
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)), eq(variables['1espt.codesignvalidation.enforced'], true), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'), ne(True, false))
      env:
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
        OneES_DeleteCodeSignValidationResult: True
        OneES_CustomPolicyFile: ''
      inputs:
        repoId: microsoft/Docker-Provider
        path: check_csv_results.ps1
    - task: PowerShell@2
      displayName: "\U0001F6E1 Guardian: Check if the path to run Secret Scanning is a directory (1ES PT)"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      env:
        OneES_OutputDirectory: $(Build.ArtifactStagingDirectory)
      inputs:
        targetType: inline
        script: |
          if ((Get-Item $env:OneES_OutputDirectory) -is [System.IO.DirectoryInfo]) {
            Write-Host "$env:OneES_OutputDirectory is a directory"
            Write-Host "##vso[task.setvariable variable=OneES_DirectoryToRunScan;issecret=false]$Env:OneES_OutputDirectory"
          } else {
            $directory = [System.IO.Path]::GetDirectoryName("$env:OneES_OutputDirectory")
            Write-Host "$env:OneES_OutputDirectory is a file, will scan the directory $directory instead because CredScan doesn't support scanning single file"
            Write-Host "##vso[task.setvariable variable=OneES_DirectoryToRunScan;issecret=false]$directory"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-credscan.CredScan@3
      displayName: "\U0001F6E1 Guardian: CredScan (Binary)"
      condition: and(ne(variables['ONEES_ENFORCED_CREDSCAN_ENABLED'], 'false'), succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)))
      target:
        container: host
      inputs:
        outputFormat: pre
        scanFolder: $(OneES_DirectoryToRunScan)
        suppressionsFile: ''
        debugMode: false
        batchSize: $(OneES_UsableProcessorCount)
    - task: 1ESSecretScanning@1
      displayName: "\U0001F6E1 Guardian: 1ES Secret Scanning (SPMI)"
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      continueOnError: true
      target:
        container: host
      timeoutInMinutes: 20
      inputs:
        Action: 'analyze'
        Target: '$(OneES_DirectoryToRunScan)\*'
        TimeoutInSeconds: 900
        MaxFileSizeInKB: 10000
      env:
        DOTNET_ROLL_FORWARD: Major
    - task: 1ESGPTRunTask@3.0.342
      displayName: "\U0001F6E1 Guardian: Set BinSkim targets (1ES PT)"
      continueOnError: false
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_BINSKIM_ENABLED'], 'false'), succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)))
      env:
        OneES_OutputDirectory: $(Build.ArtifactStagingDirectory)
      inputs:
        repoId: microsoft/Docker-Provider
        path: binSkimSetTargets.ps1
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-binskim.BinSkim@4
      displayName: "\U0001F6E1 Guardian: BinSkim 4.3.1"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_BINSKIM_ENABLED'], 'false'), ne(variables['ONEES_SKIP_BINSKIM'], true), succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)), or(ne('', ''), eq(variables['SDL_BINSKIM_ENABLED'], true), ne('4.3.1', '')))
      continueOnError: false
      inputs:
        TargetPattern: guardianGlob
        AnalyzeTargetGlob: $(ONEES_BINSKIM_TARGETS)
        AnalyzeConfigPath: default
        AnalyzeRecurse: false
        AnalyzeHashes: true
        AnalyzeStatistics: true
        AnalyzeIgnorePdbLoadError: true
        toolVersion: '4.3.1'
      env:
        GDN_ALLOW_ANALYZE_NO_TARGETS: true
    - task: PowerShell@2
      displayName: "\U0001F6E1 Guardian: Check if enable SpotBugs"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      env:
        OneES_SpotBugsSourcePath: $(Build.ArtifactStagingDirectory)
      inputs:
        targetType: inline
        script: |
          $jarFiles = Get-ChildItem -Path $env:OneES_SpotBugsSourcePath -Force -Filter *.jar -Recurse
          Write-Host "Jar files count: $($jarFiles.Count)"
          if ($jarFiles.Count -gt 0) {
            Write-Host "##vso[task.setvariable variable=SDL_SPOTBUGS_ENABLED;issecret=false]true"
          } else {
            Write-Host "##vso[task.setvariable variable=SDL_SPOTBUGS_ENABLED;issecret=false]false"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-spotbugs.SpotBugs@1
      displayName: "\U0001F6E1 Guardian: SpotBugs"
      target:
        container: host
      condition: eq(variables['SDL_SPOTBUGS_ENABLED'], true)
      continueOnError: false
      inputs:
        inputType: spotBugsSyntax
        targetClassPaths: $(Build.ArtifactStagingDirectory)
        sourcePath: $(Build.SourcesDirectory)
        ruleset: sdlRequired
        effort: max
    - task: PowerShell@2
      displayName: "\U0001F512 Set Artifacts name suffix"
      condition: and(succeeded(), eq(variables['skipScanDir'], false))
      target:
        container: host
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          if ($env:SYSTEM_JOBATTEMPT -gt 1) {
            Write-Host "##vso[task.setvariable variable=GuardianArtifactNameJobAttemptSuffix]_jobAttempt$($env:SYSTEM_JOBATTEMPT)"
          } else {
            Write-Host "##vso[task.setvariable variable=GuardianArtifactNameJobAttemptSuffix]"
          }

          # Temporary workaround for SPMI timeout generating incorrect SARIF
          try {
            if (Test-Path "$(Pipeline.Workspace)\.gdn\.r\sarifpatternmatcher")
            {
              Write-Host "Deleting SPMI SARIF files: $(Pipeline.Workspace)\.gdn\.r\sarifpatternmatcher"
              Remove-Item -Recurse -Force "$(Pipeline.Workspace)\.gdn\.r\sarifpatternmatcher"
            }
          } catch {
            Write-Host "Failed to delete SPMI SARIF files"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-report.SdtReport@2
      displayName: "\U0001F6E1 Guardian: Security Analysis Report"
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      target:
        container: host
      continueOnError: true
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
        GDN_HYDRATE_RESULT_SETS: true
        GDN_SUPPRESS_HYDRATION_WARNING: true
      inputs:
        GdnExportPolicy: Microsoft
        GdnExportVstsConsole: false
        GdnExportSarifFile: true
        GdnExportTsvFile: false
        GdnExportHtmlFile: true
        GdnExportAllTools: true
        GdnExportOutputBaselineFile: $(Pipeline.Workspace)\.gdn\r\.gdnbaselines
        GdnExportOutputBaseline: default
        GdnExportOutputSuppressionFile: $(Pipeline.Workspace)\.gdn\r\.gdnsuppress
        GdnExportOutputSuppressionSet: default
        GdnExportBaselines: default
        GdnExportSuppressionFiles: ''
        GdnExportSuppressionSets: default
        GdnExportPolicyMinSev: Error
        GdnExportGdnToolCredScanSeverity: Default
        GdnExportGdnToolArmorySeverity: Default
        GdnExportGdnToolApiScanSeverity: Default
        GdnExportGdnToolBinSkimSeverity: Default
        GdnExportGdnToolCodesignValidationSeverity: Default
        GdnExportGdnToolFxCopSeverity: Default
        GdnExportGdnToolRoslynAnalyzersSeverity: Default
        GdnExportGdnToolSemmleSeverity: Default
        GdnExportGdnToolSpotBugsSeverity: Default
        GdnExportGdnToolSDLNativeRulesSeverity: Default
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
      displayName: "\U0001F6E1 Guardian: Publish SDL Logs to Artifacts"
      condition: and( succeeded(), and(succeeded(), eq(variables['skipScanDir'], false)) )
      target:
        container: host
      continueOnError: true
      inputs:
        AllTools: true
        ArtifactName: $(OneES_PublishLogsArtifactName)$(GuardianArtifactNameJobAttemptSuffix)
        ArtifactType: Container
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@2
      displayName: "\U0001F6E1 Guardian: Post Analysis"
      condition: and(succeeded(), eq(variables['skipScanDir'], false))
      target:
        container: host
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
      inputs:
        GdnBreakAllTools: false
        GdnBreakPolicy: Microsoft
        GdnBreakPolicyMinSev: Error
        GdnBreakDisableFlighting: False
        GdnBreakGdnToolCredScanSeverity: Default
        GdnBreakGdnToolArmorySeverity: Default
        GdnBreakGdnToolApiScanSeverity: Default
        GdnBreakGdnToolBinSkimSeverity: Default
        GdnBreakGdnToolCodesignValidationSeverity: Default
        GdnBreakGdnToolFxCopSeverity: Default
        GdnBreakGdnToolRoslynAnalyzersSeverity: Default
        GdnBreakGdnToolSemmleSeverity: Default
        GdnBreakGdnToolSpotBugsSeverity: Default
        GdnBreakGdnToolSDLNativeRulesSeverity: Default
        GdnBreakGdnToolCredScan: $(OneES_AutoBaseline_credscan_break)
        GdnBreakGdnToolFortifySca: false
        GdnBreakGdnToolModernCop: false
        GdnBreakGdnToolPoliCheck: false
        GdnBreakGdnToolCodesignValidation: False
        GdnBreakGdnToolSpotBugs: $(OneES_AutoBaseline_spotBugs_break)
        GdnBreakGdnToolArmory: false
        GdnBreakGdnToolSemmle: false
