          echo "Extract Ruby"

          docker cp signingContainer:C:\ruby31 .

          echo "Extract telegraf"

          docker cp signingContainer:C:\opt\telegraf\telegraf.exe .

          echo "Extract out oms"

          docker cp signingContainer:C:\opt\amalogswindows\out_oms.so .

