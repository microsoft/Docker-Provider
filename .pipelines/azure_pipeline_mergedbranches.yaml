        inlineScript: >
          mkdir -p $(Build.ArtifactStagingDirectory)/linux

          sudo apt-get update && sudo apt-get -y install qemu binfmt-support qemu-user-static

          docker system prune --all -f

          docker images -q --filter "dangling=true" | xargs docker rmi

          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

          docker buildx create --name testbuilder

          docker buildx use testbuilder

          az --version

          az account show

          az account set -s 9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb

          az acr login -n containerinsightsprod

          # NOTE: Using the prometheus-collector team's cached buildx image since moby/buildkit:buildx-stable-1 getting throttled

          docker pull mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images:buildx-stable-1

          docker buildx create --name dockerbuilder --driver docker-container --driver-opt image=mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images:buildx-stable-1 --use

          docker buildx inspect --bootstrap

          if [ "$(Build.Reason)" != "PullRequest" ]; then
            docker buildx build --platform $(BUILD_PLATFORMS) --tag containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(linuxImagetag) -f kubernetes/linux/Dockerfile.multiarch --metadata-file $(Build.ArtifactStagingDirectory)/linux/metadata.json --build-arg IMAGE_TAG=$(linuxTelemetryTag) --build-arg GOLANG_BASE_IMAGE=$(GOLANG_BASE_IMAGE) --build-arg CI_BASE_IMAGE=$(CI_BASE_IMAGE) --push --provenance=false .
            echo "##vso[task.logissue type=warning]Linux image built with tag: containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(linuxImagetag)"
            docker pull containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(linuxImagetag)
          else
            docker buildx build --platform $(BUILD_PLATFORMS) --tag containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(linuxImagetag) -f kubernetes/linux/Dockerfile.multiarch --metadata-file $(Build.ArtifactStagingDirectory)/linux/metadata.json --build-arg IMAGE_TAG=$(linuxTelemetryTag) --build-arg GOLANG_BASE_IMAGE=$(GOLANG_BASE_IMAGE) --build-arg CI_BASE_IMAGE=$(CI_BASE_IMAGE) --provenance=false .
            # load the multi-arch image to run tests
            docker buildx build --tag containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(linuxImagetag) -f kubernetes/linux/Dockerfile.multiarch --metadata-file $(Build.ArtifactStagingDirectory)/linux/metadata.json --build-arg IMAGE_TAG=$(linuxTelemetryTag) --build-arg GOLANG_BASE_IMAGE=$(GOLANG_BASE_IMAGE) --build-arg CI_BASE_IMAGE=$(CI_BASE_IMAGE) --load --provenance=false .
          fi
      target:
