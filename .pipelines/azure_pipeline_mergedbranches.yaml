- stage: SDLSources
  displayName: "\U0001F512 SDLSources"
  isSkippable: false
  dependsOn: []
  pool:
    name: Azure-Pipelines-Windows-CI-Test-EO
    os: windows
  jobs:
  - job: SDLSources_self
    displayName: SDL Sources Analysis (self)
    continueOnError: false
    timeoutInMinutes: 120
    variables:
    - name: OneES_SkipSDLSourcesAnalysis
      value: false
    - name: GDN_SUPPRESS_FORKED_BUILD_WARNING
      value: true
    - name: runCodesignValidationInjection
      value: false
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: skipComponentGovernanceDetection
      value: true
    - name: skipNugetSecurityAnalysis
      value: true
    - name: OneESPT
      value: true
      readonly: true
    - name: OneESPT.BuildType
      value: Official
      readonly: true
    - name: OneESPT.OS
      value: windows
      readonly: true
    steps:
    - task: 1ESGPTRunTask@3.0.342
      displayName: Validate Hosted Pool Information (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        HOST_ARCHITECTURE: amd64
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_DEFINITIONID: $(System.DefinitionId)
        SYSTEM_COLLECTIONURI: $(System.CollectionUri)
        SYSTEM_TEAMPROJECT: $(System.TeamProject)
        SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
        BUILD_REPOSITORY_ID: $(Build.Repository.ID)
        BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
        PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
        PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
      inputs:
        repoId: microsoft/Docker-Provider
        path: validateHostedPool.ps1
        arguments: -TargetName '' -StepTargets '' -StepsLength 0 -SkipStatelessValidation True -OS windows -IgnoreProductionPoolCheck -IsOfficialTemplate
    - task: 1ESGPTRunTask@3.0.342
      displayName: Tag build and log custom issues (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        BuildTags: >-
          [
            "ES365AIMigrationTooling",
            "1ES.PT.Official",
            "1ES.PT.Build"
          ]
        LogIssues: '[]'
        SkipBuildTagsForGitHubPullRequests: ''
      inputs:
        repoId: microsoft/Docker-Provider
        path: tagBuild.ps1
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true))
      inputs:
        repository: self
        submodules: True
        lfs: True
        fetchDepth: 1
        fetchTags: False
        fetchFilter: ''
        persistCredentials: True
        path: s
    - task: 1ESGPTRunTask@3.0.342
      displayName: Get GitHub Token (1ES PT)
      continueOnError: true
      target:
        container: host
      condition: and( succeeded(), true, contains(variables['Build.Repository.Uri'], 'github.com'))
      inputs:
        repoId: microsoft/Docker-Provider
        path: get_github_token.py
    - task: 1ESGPTRunTask@3.0.342
      displayName: Auto-baselining mode and SDL pre-checks (1ES PT)
      continueOnError: true
      target:
        container: host
      condition: succeeded()
      env:
        categories: retail.source
        condition: and( succeeded(), true )
        isMultirepoScenario: False
        enableMultirepoScenario: True
        autoBaselineFeatureFlag: ''
        credscanEnabled: True
        policheckEnabled: False
        eslintEnabled: True
        banditEnabled: False
        csrfEnabled: False
        psscriptanalyzerEnabled: True
        armoryEnabled: True
        binskimEnabled: True
        prefastEnabled: False
        spotbugsEnabled: True
        roslynEnabled: False
        localRetailBaselineFilePath: $(Build.SourcesDirectory)/.config/guardian/.gdnbaselines
        systemAccessToken: $(System.AccessToken)
        systemCollectionUri: $(System.CollectionUri)
        systemTeamProject: $(System.TeamProject)
        systemDefinitionId: $(System.DefinitionId)
        buildSourceVersion: $(Build.SourceVersion)
        buildSourceBranch: $(Build.SourceBranch)
        buildSourcesDirectory: $(Build.SourcesDirectory)
        buildRepositoryId: $(Build.Repository.ID)
        buildRepositoryName: $(Build.Repository.Name)
        buildRepositoryProvider: $(Build.Repository.Provider)
        pipelineWorkspace: $(Pipeline.Workspace)
        toolsToUpdateAfterCertainDate: retail.source.credscan:2024-02-29,retail.source.policheck:2024-02-29,retail.source.eslint:2024-02-29,retail.source.bandit:2024-02-29,retail.source.csrf:2024-02-29,retail.source.psscriptanalyzer:2024-02-29,retail.source.armory:2024-02-29
        deleteBaselineEntriesBeforeDate: 2024-02-29 00:00:00Z
        credscanBreak: True
        policheckBreak: True
        eslintBreak: True
        banditBreak: False
        csrfBreak: False
        psscriptanalyzerBreak: True
        armoryBreak: True
        binskimBreak: True
        prefastBreak: False
        spotbugsBreak: True
        roslynBreak: True
        GDN_CB_TEMPLATE_INTERNAL: $(GDN_CB_TEMPLATE)
        isOfficial: True
        disableAutoBaselineOnNonDefaultBranches: False
        isMainPipeline: False
        skipUsingMainPipelineConfig: False
        agentOS: windows
        githubToken: $(OneES_GITHUB_TOKEN)
        enableForGitHub: True
        isForkedBuild: $(System.PullRequest.IsFork)
        useGitOps: True
      inputs:
        repoId: microsoft/Docker-Provider
        path: autobaselining_mode_and_sdl_breakglass_checks.py
    - task: PublishPipelineArtifact@1
      displayName: Publish new tools list (1ES PT)
      condition: and( succeeded(), true, ne('', variables['OneES_AutoBaseline_MetadataFolder']) )
      continueOnError: true
      inputs:
        artifactName: 1espt-autobaseline-SDLSources-SDLSources
        targetPath: $(OneES_AutoBaseline_MetadataFolder)
    - task: NodeTool@0
      displayName: Install Node.js 20.x for CodeQL (1ES PT)
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      continueOnError: true
      inputs:
        versionSpec: '20.x'
    - task: UsePythonVersion@0
      displayName: Install Python 3.x for CodeQL (1ES PT)
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      continueOnError: true
      inputs:
        versionSpec: '3.x'
    - task: CodeQL3000Init@0
      displayName: "\U0001F6E1 CodeQL Initialize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
      inputs:
        Enabled: true
        BuildIdentifier: SDLSources_SDLSources
        BuildMode: none
        LanguageDetectorFilter: interpreted
    - task: CodeQL3000Finalize@0
      displayName: "\U0001F6E1 CodeQL Finalize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
    - task: 1ESGPTRunTask@3.0.342
      displayName: "\U0001F512 Setup AntiMalware (1ES PT)"
      continueOnError: true
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ANTIMALWARESCAN_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)))
      env:
        OneES_AntiMalware_DirectoryToScan: $(Build.SourcesDirectory)
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
      inputs:
        repoId: microsoft/Docker-Provider
        path: setupAntiMalware.ps1
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-antimalware.AntiMalware@4
      displayName: "\U0001F6E1 Guardian: AntiMalware Scanner (Source)"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ANTIMALWARESCAN_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)))
      inputs:
        InputType: 'Basic'
        ScanType: 'CustomScan'
        FileDirPath: $(Build.SourcesDirectory)
        EnableServices: true
        SupportLogOnError: true
        TreatSignatureUpdateFailureAs: 'Warning'
        SignatureFreshness: 'OneDay'
        TreatStaleSignatureAs: 'Error'
        AcceptableOutdatedSignatureInHours: 72
        TreatAcceptableOutdatedSignatureAs: 'Warning'
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-credscan.CredScan@3
      displayName: "\U0001F6E1 Guardian: CredScan (Source)"
      condition: and(ne(variables['ONEES_ENFORCED_CREDSCAN_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)))
      target:
        container: host
      inputs:
        outputFormat: pre
        scanFolder: $(Build.SourcesDirectory)
        suppressionsFile: ''
        debugMode: false
        batchSize: $(OneES_UsableProcessorCount)
    - task: 1ESGPTRunTask@3.0.342
      displayName: "\U0001F6E1 Guardian: Check if enable ESLint (1ES PT)"
      continueOnError: false
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ESLINT_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)))
      env:
        OneES_ScanAllEslintScriptExtensions: ''
        OneES_EslintExclusionPatterns: '*.d.ts\n*.spec.js\n*.spec.jsx\n*.spec.ts\n*.spec.tsx'
        OneES_EslintExclusionsFilePath: ''
        OneES_ScanDirectory: $(Build.SourcesDirectory)
      inputs:
        repoId: microsoft/Docker-Provider
        path: checkIfEnableEslint.ps1
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-eslint.ESLint@1
      displayName: "\U0001F6E1 Guardian: ESLint (JavaScript)"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ESLINT_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)), eq(variables['SDL_INTERNAL_ESLINT_JS_ENABLED'], 'true'))
      continueOnError: False
      inputs:
        Configuration: recommended
        TargetType: 'eslint'
        TargetsESLint: >
          $(Build.SourcesDirectory)/**/*.js
        ErrorLevel: 'warn'
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-eslint.ESLint@1
      displayName: "\U0001F6E1 Guardian: ESLint (TypeScript)"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ESLINT_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)), eq(variables['SDL_INTERNAL_ESLINT_TS_ENABLED'], 'true'))
      continueOnError: False
      inputs:
        Configuration: recommended
        TargetType: 'eslint'
        TargetsESLint: >
          $(Build.SourcesDirectory)/**/*.ts
        ErrorLevel: 'warn'
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-psscriptanalyzer.PSScriptAnalyzer@1
      inputs:
        Path: $(Build.SourcesDirectory)
        Settings: recommended
        Recurse: true
        policyName: Microsoft
      displayName: "\U0001F6E1 Guardian: PSScriptAnalyzer"
      condition: and(ne(variables['ONEES_ENFORCED_PSSCRIPTANALYZER_ENABLED'], 'false'), and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true)))
      target:
        container: host
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-armory.Armory@2
      displayName: "\U0001F6E1 Guardian: ARMory"
      condition: and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true))
      target:
        container: host
      continueOnError: False
      inputs:
        targetDirectory: $(Build.SourcesDirectory)
        targetFiles: f|**\*.json;-|.gdn\**;
        excludePassesFromLog: true
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-report.SdtReport@2
      displayName: "\U0001F6E1 Guardian: Security Analysis Report"
      target:
        container: host
      continueOnError: true
      condition: and(succeeded(), ne(variables['OneES_SkipSDLSourcesAnalysis'], true))
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
        GDN_HYDRATE_RESULT_SETS: true
        GDN_SUPPRESS_HYDRATION_WARNING: true
      inputs:
        GdnExportPolicy: Microsoft
        GdnExportVstsConsole: false
        GdnExportSarifFile: true
        GdnExportTsvFile: false
        GdnExportHtmlFile: true
        GdnExportAllTools: true
        GdnExportOutputBaselineFile: $(Pipeline.Workspace)\.gdn\r\.gdnbaselines
        GdnExportOutputBaseline: default
        GdnExportOutputSuppressionFile: $(Pipeline.Workspace)\.gdn\r\.gdnsuppress
        GdnExportOutputSuppressionSet: default
        GdnExportBaselines: default
        GdnExportSuppressionFiles: ''
        GdnExportSuppressionSets: default
        GdnExportPolicyMinSev: Error
        GdnExportGdnToolCredScanSeverity: Default
        GdnExportGdnToolPoliCheckSeverity: Default
        GdnExportGdnToolArmorySeverity: Default
        GdnExportGdnToolESLintSeverity: Default
        GdnExportGdnToolBanditSeverity: Default
        GdnExportGdnToolCSRFSeverity: Default
        GdnExportGdnToolSemmleSeverity: Default
        GdnExportGdnToolPSScriptAnalyzerSeverity: Default
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
