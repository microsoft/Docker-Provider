trigger: none
pr: none
parameters:
- name: telemetryValidationVersion
  type: string
  default: '3.8.0-ci-prod-09-20-2026-8e6bef56'
variables:
  armServiceConnectionName: 'ci-1es-acr-connection'
  subscription: '9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb'
  containerRegistry: 'containerinsightsprod'
  repoImageName: '${{ variables.containerRegistry }}.azurecr.io/public/azuremonitor/containerinsights/cidev'
  # Helm chart is pushed to a dedicated chart path, decoupled from the agent image path
  # (repoImageName). The chart reuses the already-onboarded `preview` MCR repo instead of a
  # new cidev chart repo; the prod release promotes it to the `helmchart/... /ciprod` path.
  chartRepoName: '${{ variables.containerRegistry }}.azurecr.io/public/azuremonitor/containerinsights/preview'
  GOLANG_BASE_IMAGE: 'mcr.microsoft.com/oss/go/microsoft/golang:1.27.0'
  # QEMU used to emulate linux/arm64 during the multi-arch docker build. Keep this current:
  # older QEMU builds make the emulated gcc segfault at random while compiling ruby native
  # gem extensions. MCR mirror of tonistiigi/binfmt, used to avoid Docker Hub rate limiting.
  QEMU_BINFMT_IMAGE: 'mcr.microsoft.com/mirror/docker/tonistiigi/binfmt:qemu-v9.2.2-52'
  IS_PR: $[eq(variables['Build.Reason'], 'PullRequest')]
  IS_MAIN_BRANCH: $[eq(variables['Build.SourceBranchName'], 'ci_prod')]
  IS_RELEASE: $[ne(variables['TELEMETRY_TAG'], '')]
  appRegistrationClientId: $[variables['APP_REGISTRATION_CLIENT_ID']]
  appRegistrationTenantId: $[variables['APP_REGISTRATION_TENANT_ID']]
  esrpClientId: $[variables['ESRP_CLIENT_ID']]
  authAKVName: $[variables['AUTH_AKV_NAME']]
  authCertName: $[variables['AUTH_CERT_NAME']]
  authSignCertName: $[variables['AUTH_SIGN_CERT_NAME']]
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-CI-Test-EO
      image: ci-1es-managed-ubuntu-2204
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-CI-Test-EO
        image: ci-1es-managed-windows-2022
        os: windows
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: Deploy_and_Test_Images_In_Dev_Clusters
      displayName: Validate Existing Agent Telemetry
      lockBehavior: sequential
      dependsOn: []
      condition: and(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/suyadav/add-heartbeat-test'))
      variables:
        # Override the helm chart's default image repository (/azuremonitor/containerinsights/ciprod) to use cidev
        ImageRepositoryOverride: '/azuremonitor/containerinsights/cidev'
        linuxImageTagUnderTest: ${{ parameters.telemetryValidationVersion }}
        windowsImageTagUnderTest: win-${{ parameters.telemetryValidationVersion }}
      jobs:
      # ============================================================
      # Cluster: ci-logs-prod-aks-geneva-integration-multi-tenancy — Deploy via Helm
      # ============================================================
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-geneva-integration-multi-tenancy'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-GenevaIntegrationMultiTenancy'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_aks_geneva_integration_multi_tenancy'
          azureClientId: $(AksGenevaIntegrationMultiTenancyClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'GenevaIntegration=true AgentTelemetryResourceId=$(AGENT_TELEMETRY_RESOURCE_ID) AgentTelemetryVersion=$(linuxImageTagUnderTest)'

      # ============================================================
      # Cluster: ci-logs-prod-aks-work-load-identity — Deploy via Helm
      # ============================================================
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-work-load-identity'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-WorkLoadIdentity'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_aks_work_load_identity'
          azureClientId: $(AksWorkLoadIdentityClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'LinuxTestsOnly=true AgentTelemetryResourceId=$(AGENT_TELEMETRY_RESOURCE_ID) AgentTelemetryVersion=$(linuxImageTagUnderTest)'

      # ============================================================
      # Cluster: ci-logs-prod-wcus-fips — Deploy via Helm
      # ============================================================
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-wcus-fips'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-WcusFips'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_wcus_fips'
          azureClientId: $(WcusFipsClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'AgentTelemetryResourceId=$(AGENT_TELEMETRY_RESOURCE_ID) AgentTelemetryVersion=$(linuxImageTagUnderTest)'

      # ============================================================
      # Cluster: ci-logs-prod-aks-networkflowlogs — Deploy via Helm
      # ============================================================
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-networkflowlogs'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-NetworkFlowLogs'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_aks_networkflowlogs'
          azureClientId: $(NetworkFlowLogsClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'LinuxTestsOnly=true AgentTelemetryResourceId=$(AGENT_TELEMETRY_RESOURCE_ID) AgentTelemetryVersion=$(linuxImageTagUnderTest)'

      # ============================================================
      # Cluster: ci-logs-dev-aks-std-prof-config-test1 — Deploy via Helm
      # This cluster is used for ConfigMap testing
      # ============================================================
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-dev-aks-all-nodes'
          resourceGroup: 'ci-logs-dev-aks-eastus'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-Dev-Aks-All-Nodes'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_dev_aks_all_nodes'
          azureClientId: $(AllNodesClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'PerNodeLogCoverage=true AgentTelemetryResourceId=$(AGENT_TELEMETRY_RESOURCE_ID) AgentTelemetryVersion=$(linuxImageTagUnderTest)'
