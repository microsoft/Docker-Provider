                          "operationSetCode": "NotaryCoseSign",
                          "parameters": [
                            {
                              "parameterName": "CoseFlags",
                              "parameterValue": "chainunprotected"
                            }
                          ],
                          "toolName": "sign",
                          "toolVersion": "1.0"
                      }
                    ]
        SessionTimeout: 60
        MaxConcurrency: 50
        MaxRetryAttempts: 5
        PendingAnalysisWaitTimeoutMinutes: 5
