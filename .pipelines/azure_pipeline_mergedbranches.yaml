          cd kubernetes/windows

          az --version

          az account show

          az account set -s 9b96ebbd-c57a-42d1-bbe9-b69296e4c7fb

          az acr login -n containerinsightsprod

          @{"image.name"="containerinsightsprod.azurecr.io/public/azuremonitor/containerinsights/cidev:$(windowsImageTag)"} | ConvertTo-Json -Compress | Out-File -Encoding ascii $(Build.ArtifactStagingDirectory)/windows/metadata.json

          if ("$(Build.Reason)" -ne "PullRequest") {
