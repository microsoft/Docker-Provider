      - job: build_windows_multi_arc
        pool:
          name: Azure-Pipelines-CI-Test-EO
          image: ci-1es-managed-windows-2022
          os: windows
        timeoutInMinutes: 120
        dependsOn:
        - common
        - build_windows_2019
        - build_windows_2022
        variables:
          windowsImageTag: $[ dependencies.common.outputs['setup.windowsImageTag'] ]
          windowsTelemetryTag: $[ dependencies.common.outputs['setup.windowsTelemetryTag'] ]
          windows2019BaseImageVersion: ltsc2019
          windows2022BaseImageVersion: ltsc2022
          Codeql.SkipTaskAutoInjection: true
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)'
            artifactName: windows-drop
        steps:
        - task: AzureCLI@2
          displayName: "Docker windows build for multi-arc image"
          inputs:
            azureSubscription: ${{ variables.armServiceConnectionName }}
            scriptType: ps
            scriptLocation: inlineScript
            inlineScript: |
              mkdir -p $(Build.ArtifactStagingDirectory)/windows
              cd kubernetes/windows
              az --version
              az account show
              az account set -s ${{ variables.subscription }}
              az acr login -n ${{ variables.containerRegistry }}
              @{"image.name"="${{ variables.repoImageName }}:$(windowsImageTag)"} | ConvertTo-Json -Compress | Out-File -Encoding ascii $(Build.ArtifactStagingDirectory)/windows/metadata.json
              if ("$(Build.Reason)" -ne "PullRequest") {
                 docker manifest create ${{ variables.repoImageName }}:$(windowsImageTag) ${{ variables.repoImageName }}:$(windowsImageTag)-$(windows2019BaseImageVersion) ${{ variables.repoImageName }}:$(windowsImageTag)-$(windows2022BaseImageVersion)
                 docker manifest push ${{ variables.repoImageName }}:$(windowsImageTag)
                 Write-Host "##vso[task.logissue type=warning]Windows image built with tag: ${{ variables.repoImageName }}:$(windowsImageTag)"
              }
        - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
          displayName: 'Generation Task'
          condition: eq(variables.IS_PR, true)
          inputs:
            BuildDropPath: '$(Build.ArtifactStagingDirectory)/windows'
            DockerImagesToScan: 'mcr.microsoft.com/windows/servercore:ltsc2019,mcr.microsoft.com/windows/servercore:ltsc2022'
        - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
          displayName: 'Generation Task'
          condition: eq(variables.IS_PR, false)
          inputs:
            BuildDropPath: '$(Build.ArtifactStagingDirectory)/windows'
            DockerImagesToScan: 'mcr.microsoft.com/windows/servercore:ltsc2019,mcr.microsoft.com/windows/servercore:ltsc2022,${{ variables.repoImageName }}:$(windowsImageTag)'
        - powershell: |
            curl.exe -sLO  "https://github.com/oras-project/oras/releases/download/v1.0.0/oras_1.0.0_windows_amd64.zip"
            $currentDirectory = Get-Location
            Expand-Archive -Path $currentDirectory\oras_1.0.0_windows_amd64.zip -DestinationPath . -Force
            New-Item -ItemType Directory -Force -Path $env:USERPROFILE\bin
            Copy-Item -Path $currentDirectory\oras.exe -Destination "$env:USERPROFILE\bin\"
            $env:PATH = "$env:USERPROFILE\bin;$env:PATH"
            $output = oras manifest fetch ${{ variables.repoImageName }}:$(windowsImageTag) --descriptor
            $outputObject = $output | ConvertFrom-Json
            $payload = @{
                targetArtifact = $outputObject
            } | ConvertTo-Json -Depth 2
            $utf8NoBomEncoding = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::WriteAllLines("$(Build.ArtifactStagingDirectory)/windows/payload.json", $payload, $utf8NoBomEncoding)
            Get-Content "$(Build.ArtifactStagingDirectory)/windows/payload.json"
          workingDirectory: $(Build.ArtifactStagingDirectory)/windows
          displayName: "Install oras and build the payload json file"
          condition: eq(variables.IS_PR, false)
        - task: EsrpCodeSigning@5
          condition: eq(variables.IS_PR, false)
          inputs:
            ConnectedServiceName: 'AME ESRPContainerInsights MSI FIC'
            UseMSIAuthentication: true
            AppRegistrationClientId: $(appRegistrationClientId)
            AppRegistrationTenantId: $(appRegistrationTenantId)
            EsrpClientId: $(esrpClientId)
            AuthAKVName: $(authAKVName)
            AuthCertName: $(authCertName)
            AuthSignCertName: $(authSignCertName)
            FolderPath: '$(Build.ArtifactStagingDirectory)/windows'
            Pattern: 'payload.json'
            signConfigType: 'inlineSignParams'
            inlineOperation: |
              [
                          {
                              "keyCode": "CP-469451",
                              "operationSetCode": "NotaryCoseSign",
                              "parameters": [
                                {
                                  "parameterName": "CoseFlags",
                                  "parameterValue": "chainunprotected"
                                }
                              ],
                              "toolName": "sign",
                              "toolVersion": "1.0"
                          }
                        ]
            SessionTimeout: '60'
            MaxConcurrency: '50'
            MaxRetryAttempts: '5'
            PendingAnalysisWaitTimeoutMinutes: '5'
          displayName: 'Esrp Image Signing for windows image'
        - powershell: |
            $env:PATH = "$env:USERPROFILE\bin;$env:PATH"
            oras attach ${{ variables.repoImageName }}:$(windowsImageTag) --artifact-type application/vnd.cncf.notary.signature ./payload.json:application/cose -a io.cncf.notary.x509chain.thumbprint#S256=[\"49D6CD5DB42623144D6990AA1669CE5D97F1F3D7\"]
          workingDirectory: $(Build.ArtifactStagingDirectory)/windows
          displayName: "Run oras attach"
          condition: eq(variables.IS_PR, false)
        - powershell: |
            $env:PATH = "$env:USERPROFILE\bin;$env:PATH"
            oras attach ${{ variables.repoImageName }}:$(windowsImageTag) --artifact-type 'application/vnd.microsoft.artifact.lifecycle' --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$(powershell -Command "(Get-Date).AddHours(-1).ToString('yyyy-MM-ddTHH:mm:ssZ')")"
          workingDirectory: $(Build.ArtifactStagingDirectory)/windows
          displayName: "Run oras attach"
          condition: and(eq(variables.IS_RELEASE, false), eq(variables.IS_PR, false))
        - task: AntiMalware@4
          displayName: 'Run MpCmdRun.exe'
          inputs:
            InputType: Basic
            ScanType: CustomScan
            FileDirPath: '$(Build.ArtifactStagingDirectory)'
            DisableRemediation: false
            AcceptableOutdatedSignatureInHours: 72

      - job: helm_chart
        displayName: "Package and Publish Helm Chart"
        dependsOn: common
        pool:
          name: Azure-Pipelines-CI-Test-EO
          image: ci-1es-managed-ubuntu-2204
          os: linux
        variables:
          HELM_SEMVER: $[ dependencies.common.outputs['setup.SEMVER'] ]
          IMAGE_TAG: $[ dependencies.common.outputs['setup.linuxImagetag'] ]
          IMAGE_TAG_WINDOWS: $[ dependencies.common.outputs['setup.windowsImageTag'] ]
          skipComponentGovernanceDetection: true
          Codeql.SkipTaskAutoInjection: true
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)/helm-chart'
            artifactName: helm-chart-drop
            condition: and(succeeded(), eq(variables.IS_PR, false), eq(variables.IS_MAIN_BRANCH, true))
        steps:
        - task: HelmInstaller@1
          displayName: "Install Helm"
          inputs:
            helmVersionToInstall: 'latest'
        - bash: |
            set -e
            mkdir -p $(Build.ArtifactStagingDirectory)/helm-chart
            # Generate the chart from the committed templates using the SEMVER-derived
            # tags, then lint + package. The chart is pushed to the preview chart repo on
            # every build (mirrors ama-metrics, whose chart push is ungated); only the ADO
            # pipeline artifact publish is gated to non-PR ci_prod builds (see the gated
            # output above).
            export HELM_SEMVER="$(HELM_SEMVER)"
            export IMAGE_TAG="$(IMAGE_TAG)"
            export IMAGE_TAG_WINDOWS="$(IMAGE_TAG_WINDOWS)"
            cd $(Build.SourcesDirectory)/charts/azuremonitor-containerinsights
            envsubst '${HELM_SEMVER} ${IMAGE_TAG} ${IMAGE_TAG_WINDOWS}' < Chart-template.yaml > Chart.yaml
            envsubst '${HELM_SEMVER} ${IMAGE_TAG} ${IMAGE_TAG_WINDOWS}' < values-template.yaml > values.yaml
            echo "----- generated Chart.yaml -----"
            cat Chart.yaml
            helm lint .
            helm package . --version "$(HELM_SEMVER)" --destination $(Build.ArtifactStagingDirectory)/helm-chart
            # Package the same chart a second time under an -arc prerelease version so the
            # build publishes both an AKS-extension tag (<SEMVER>) and an Arc tag
            # (<SEMVER>-arc) to the preview chart repo, mirroring the ama-metrics build. The
            # prod release promotes both tags to the ciprod chart repo.
            helm package . --version "$(HELM_SEMVER)-arc" --destination $(Build.ArtifactStagingDirectory)/helm-chart
            ls -l $(Build.ArtifactStagingDirectory)/helm-chart
          displayName: "Generate, lint and package Helm chart"
        - task: AzureCLI@2
          displayName: "Push Helm chart to ACR"
          inputs:
            azureSubscription: ${{ variables.armServiceConnectionName }}
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              az account set -s ${{ variables.subscription }}
              az acr login -n ${{ variables.containerRegistry }}
              CHART_TGZ="$(Build.ArtifactStagingDirectory)/helm-chart/azuremonitor-containers-$(HELM_SEMVER).tgz"
              CHART_TGZ_ARC="$(Build.ArtifactStagingDirectory)/helm-chart/azuremonitor-containers-$(HELM_SEMVER)-arc.tgz"
              helm push "$CHART_TGZ" oci://${{ variables.chartRepoName }}
              # Arc tag: same chart, pushed under <SEMVER>-arc for the Arc K8s extension path.
              helm push "$CHART_TGZ_ARC" oci://${{ variables.chartRepoName }}
              echo "{\"helmChartName\":\"azuremonitor-containers\",\"helmChartVersion\":\"$(HELM_SEMVER)\",\"helmChartRef\":\"oci://${{ variables.chartRepoName }}/azuremonitor-containers:$(HELM_SEMVER)\",\"helmChartArcRef\":\"oci://${{ variables.chartRepoName }}/azuremonitor-containers:$(HELM_SEMVER)-arc\"}" > $(Build.ArtifactStagingDirectory)/helm-chart/metadata.json
              cat $(Build.ArtifactStagingDirectory)/helm-chart/metadata.json
              echo "##vso[task.logissue type=warning]Helm chart pushed: oci://${{ variables.chartRepoName }}/azuremonitor-containers:$(HELM_SEMVER) and :$(HELM_SEMVER)-arc"

    - stage: Deploy_and_Test_Images_In_Dev_Clusters
      displayName: Deploy and Test Images in Dev Clusters
      lockBehavior: sequential
      dependsOn: 
        - stage
      condition: |
        and(eq(dependencies.stage.result, 'Succeeded'), eq(variables.IS_PR, false), eq(variables.IS_MAIN_BRANCH, true))
      variables:
        # Override the helm chart's default image repository (/azuremonitor/containerinsights/ciprod) to use cidev
        ImageRepositoryOverride: '/azuremonitor/containerinsights/cidev'
        # Use image tags built from the previous build stage
        linuxImageTagUnderTest: $[stageDependencies.stage.common.outputs['setup.linuxImagetag']]
        windowsImageTagUnderTest: $[stageDependencies.stage.common.outputs['setup.windowsImageTag']]
      jobs:
      # ============================================================
      # Cluster: ci-logs-prod-aks-geneva-integration-multi-tenancy — Deploy via Helm
      # ============================================================
      - template: /.pipelines/helm-deploy-templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-geneva-integration-multi-tenancy'
          resourceGroup: 'ci-logs-prod-aks'
          region: 'uksouth'
          subscriptionId: $(CI_BUILD_SUB_ID)
          workspaceId: $(GENEVA_INTEGRATION_MULTI_TENANCY_LAW_ID)
          amalogsLinuxImage: $(linuxImageTagUnderTest)
          amalogsWindowsImage: $(windowsImageTagUnderTest)
          imageRepository: $(ImageRepositoryOverride)
          environment: 'CI-Agent-GenevaIntegrationMultiTenancy'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'

      # Cluster: ci-logs-prod-aks-geneva-integration-multi-tenancy — Run E2E Tests
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-geneva-integration-multi-tenancy'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-GenevaIntegrationMultiTenancy'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_aks_geneva_integration_multi_tenancy'
          azureClientId: $(AksGenevaIntegrationMultiTenancyClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'GenevaIntegration=true'

      # ============================================================
      # Cluster: ci-logs-prod-aks-work-load-identity — Deploy via Helm
      # ============================================================
      - template: /.pipelines/helm-deploy-templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-work-load-identity'
          resourceGroup: 'ci-logs-prod-aks'
          region: 'eastus2'
          subscriptionId: $(CI_BUILD_SUB_ID)
          workspaceId: $(WORK_LOAD_IDENTITY_LAW_ID)
          amalogsLinuxImage: $(linuxImageTagUnderTest)
          amalogsWindowsImage: $(windowsImageTagUnderTest)
          imageRepository: $(ImageRepositoryOverride)
          environment: 'CI-Agent-WorkLoadIdentity'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'

      # Cluster: ci-logs-prod-aks-work-load-identity — Run E2E Tests
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-work-load-identity'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-WorkLoadIdentity'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_aks_work_load_identity'
          azureClientId: $(AksWorkLoadIdentityClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'LinuxTestsOnly=true'

      # ============================================================
      # Cluster: ci-logs-prod-wcus-fips — Deploy via Helm
      # ============================================================
      - template: /.pipelines/helm-deploy-templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'ci-logs-prod-wcus-fips'
          resourceGroup: 'ci-logs-prod-aks'
          region: 'westcentralus'
          subscriptionId: $(CI_BUILD_SUB_ID)
          workspaceId: $(WCUS_FIPS_LAW_ID)
          amalogsLinuxImage: $(linuxImageTagUnderTest)
          amalogsWindowsImage: $(windowsImageTagUnderTest)
          imageRepository: $(ImageRepositoryOverride)
          environment: 'CI-Agent-WcusFips'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'

      # Cluster: ci-logs-prod-wcus-fips — Run E2E Tests
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-wcus-fips'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-WcusFips'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_wcus_fips'
          azureClientId: $(WcusFipsClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)

      # ============================================================
      # Cluster: ci-logs-prod-aks-networkflowlogs — Deploy via Helm
      # ============================================================
      - template: /.pipelines/helm-deploy-templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-networkflowlogs'
          resourceGroup: 'ci-logs-prod-aks'
          region: 'westus2'
          subscriptionId: $(CI_BUILD_SUB_ID)
          workspaceId: $(NETWORKFLOWLOGS_LAW_ID)
          amalogsLinuxImage: $(linuxImageTagUnderTest)
          amalogsWindowsImage: $(windowsImageTagUnderTest)
          imageRepository: $(ImageRepositoryOverride)
          environment: 'CI-Agent-NetworkFlowLogs'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          additionalOverrides: 'OmsAgent.retinaFlowLogsEnabled=true'

      # Cluster: ci-logs-prod-aks-networkflowlogs — Run E2E Tests
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-prod-aks-networkflowlogs'
          resourceGroup: 'ci-logs-prod-aks'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-NetworkFlowLogs'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_prod_aks_networkflowlogs'
          azureClientId: $(NetworkFlowLogsClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'LinuxTestsOnly=true'

      # ============================================================
      # Cluster: ci-logs-dev-aks-std-prof-config-test1 — Deploy via Helm
      # This cluster is used for ConfigMap testing
      # ============================================================
      - template: /.pipelines/helm-deploy-templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'ci-logs-dev-aks-std-prof-config-test1'
          resourceGroup: 'ci-logs-dev-aks-configmap-test'
          region: 'westus2'
          subscriptionId: $(CI_BUILD_SUB_ID)
          workspaceId: $(CI-LOGS-DEV-AKS-CONFIGMAP-TEST_LAW_ID)
          amalogsLinuxImage: $(linuxImageTagUnderTest)
          amalogsWindowsImage: $(windowsImageTagUnderTest)
          imageRepository: $(ImageRepositoryOverride)
          environment: 'CI-Agent-Dev-Aks-Configmap-Test1'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'

      # ============================================================
      # Cluster: ci-logs-dev-aks-all-nodes — Deploy via Helm
      # Matrix-coverage cluster with one node per OS / arch / FIPS combo
      # (Ubuntu, AzureLinux, Windows2022; amd64 + arm64; non-FIPS + FIPS).
      # Used to validate ama-logs works across different type of node variants.
      # ============================================================
      - template: /.pipelines/helm-deploy-templates/ama-logs-helm-deploy.yaml@self
        parameters:
          clusterName: 'ci-logs-dev-aks-all-nodes'
          resourceGroup: 'ci-logs-dev-aks-eastus'
          region: 'eastus'
          subscriptionId: $(CI_BUILD_SUB_ID)
          workspaceId: $(CI_LOGS_DEV_AKS_EASTUS_LAW_ID)
          amalogsLinuxImage: $(linuxImageTagUnderTest)
          amalogsWindowsImage: $(windowsImageTagUnderTest)
          imageRepository: $(ImageRepositoryOverride)
          environment: 'CI-Agent-Dev-Aks-All-Nodes'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'

      # Cluster: ci-logs-dev-aks-all-nodes — Run E2E Tests
      # PerNodeLogCoverage=true enables the per-node ContainerLogV2 ingestion
      # check; this cluster has a log generator deployed on every node so
      # every node is expected to ship logs.
      - template: /.pipelines/e2e-test-templates/test-ci-image-in-aks-cluster.yml@self
        parameters:
          clusterName: 'ci-logs-dev-aks-all-nodes'
          resourceGroup: 'ci-logs-dev-aks-eastus'
          azureSubscription: 'ContainerInsights_Build_Subscription_CI'
          environmentName: 'CI-Agent-Dev-Aks-All-Nodes'
          dependsOnDeployJob: 'Deploy_AmaLogs_ci_logs_dev_aks_all_nodes'
          azureClientId: $(AllNodesClientId)
          azureTenantId: $(CI_BUILD_AZURE_TENANT_ID)
          teamsWebhookUri: $(TeamsWebhookUri)
          additionalTestParams: 'PerNodeLogCoverage=true'
