apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DOTNET_TEST_APP_NAME}
  namespace: ${TEST_NS}
  labels:
    app: dotnet-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-test-app
  template:
    metadata:
      labels:
        app: dotnet-test-app
    spec:
      containers:
      - name: dotnet-test-app
        image: appmonitoring.azurecr.io/demoaks-dotnet-app:latest
        imagePullPolicy: Always
        env:
        - name: TARGET_URL
          value: "http://${TEST_APP_SOURCE_NAME}-service.default.svc.cluster.local:3001"
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: ${DOTNET_TEST_APP_NAME}-service
  namespace: ${TEST_NS}
  labels:
    app: dotnet-test-app
spec:
  type: ClusterIP
  ports:
    - port: 3001
      protocol: TCP
      targetPort: 3001
  selector:
    app: dotnet-test-app