# Default values for java-instrumented
image: appmonitoringaddontestacr.azurecr.io/demoaks-java-app:latest

# Basic configuration
port: 8080
serviceName: "java-test-app"
targetUrl: "http://localhost:8080/"

# Service type (ClusterIP, LoadBalancer, etc.)
serviceType: LoadBalancer

# OpenTelemetry settings
otel:
  environment: "production"
  version: "1.0.0"