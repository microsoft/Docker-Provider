# Server configuration
server.port=8080

# Application configuration  
spring.application.name=java-instrumented-test-app
target.url=http://localhost:8080/

# OpenTelemetry configuration
otel.service.name=java-instrumented-test-app
otel.service.version=1.0.0
otel.environment=development

# OTLP Metrics configuration
otel.exporter.otlp.metrics.endpoint=http://localhost:56682/v1/metrics
otel.exporter.otlp.metrics.protocol=http/protobuf
otel.exporter.otlp.metrics.insecure=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.example=INFO
logging.level.io.opentelemetry=INFO
logging.pattern.console=[%d{HH:mm:ss.SSS}] %5p [trace_id=%X{trace_id:-no-trace}] [span_id=%X{span_id:-no-span}] --- [%15.15t] %-40.40logger{39} : %m%n
