apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoaks-java-app
  labels:
    app: demoaks-java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoaks-java-app
  template:
    metadata:
      labels:
        app: demoaks-java-app
    spec:
      containers:
      - name: demoaks-java-app
        image: "{{ .Values.image }}"
        imagePullPolicy: Always
        env:
        # OpenTelemetry configuration
        - name: OTEL_SERVICE_NAME
          value: "{{ .Values.serviceName }}"
        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.otel.version }}"
        - name: OTEL_ENVIRONMENT
          value: "{{ .Values.otel.environment }}"
        # Application configuration
        - name: SERVER_PORT
          value: "{{ .Values.port }}"
        - name: TARGET_URL
          value: "{{ .Values.targetUrl }}"
        # Java configuration
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        ports:
        - containerPort: {{ .Values.port }}
          name: http
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"