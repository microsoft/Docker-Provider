apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-test-app
  namespace: test-ns
  labels:
    app: test-app-nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app-nodejs
  template:
    metadata:
      labels:
        app: test-app-nodejs
    spec:
      containers:
      - name: test-app-nodejs
        image: appmonitoring.azurecr.io/demoaks-nodejs-app:latest
        imagePullPolicy: Always
        env:
        - name: APPLICATIONINSIGHTS_CONFIGURATION_CONTENT
          value: '{"logInstrumentationOptions":{"console": { "enabled": true },"bunyan": { "enabled": true },"winston": { "enabled": true }}}'
        - name: TARGET_URL
          value: "http://nodejs-source-app-service.default.svc.cluster.local:3001"
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: test-app-nodejs-service
  namespace: test-ns
  labels:
    app: test-app-nodejs
spec:
  type: LoadBalancer
  ports:
    - port: 3001
      protocol: TCP
      targetPort: 3001
  selector:
    app: test-app-nodejs