# http://<public ip>:3001/call-target
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-instrumented-test-app
  namespace: ns1
  labels:
    app: dotnet-instrumented-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-instrumented-test-app
  template:
    metadata:
      labels:
        app: dotnet-instrumented-test-app
      annotations:
        instrumentation.opentelemetry.io/inject-configuration: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9000
      containers:
      - name: dotnet-instrumented-test-app
        image: appmonitoring.azurecr.io/demoaks-dotnet-instrumented-app:latest
        imagePullPolicy: Always
        env:
        - name: OTEL_LOG_LEVEL
          value: "verbose"
        # Application configuration
        - name: PORT
          value: "3001"
        # .NET configuration
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:3001"
        - name: TARGET_URL
          value: "https://bing.com"
        - name: OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES
          value: "dotnet-instrumented-test-app"
        ports:
        - containerPort: 3001
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-instrumented-test-app-service
  namespace: ns1
  labels:
    app: dotnet-instrumented-test-app
spec:
  type: LoadBalancer
  selector:
    app: dotnet-instrumented-test-app
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
