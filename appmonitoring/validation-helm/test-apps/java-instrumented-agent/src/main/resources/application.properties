# Server configuration
server.port=8080

# Application configuration  
spring.application.name=java-instrumented-agent-app
target.url=http://localhost:8080/

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.example=INFO
logging.level.io.opentelemetry=INFO
logging.pattern.console=[%d{HH:mm:ss.SSS}] %5p [trace_id=%X{trace_id:-no-trace}] [span_id=%X{span_id:-no-span}] --- [%15.15t] %-40.40logger{39} : %m%n

# Note: OpenTelemetry configuration is done via environment variables
# when using the Java agent (see Dockerfile and chart.yaml)
