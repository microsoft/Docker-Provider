podSpec:
  restartPolicy: Never
  serviceAccountName: sonobuoy-serviceaccount
sonobuoy-config:
  driver: Job
  plugin-name: azure-arc-monitor
  result-format: junit
spec:
  image: mcr.microsoft.com/azuremonitor/containerinsights/cidev:ciconftest03212025
  imagePullPolicy: Always
  name: plugin
  resources: {}
  volumes:
  - name: results
    emptyDir: {}
  volumeMounts:
  - mountPath: /tmp/results
    name: results
