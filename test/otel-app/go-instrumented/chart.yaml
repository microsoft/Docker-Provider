# http://<public ip>:3001/generate-load?iterations=5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-instrumented-test-app
  namespace: ns1
  labels:
    app: go-instrumented-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-instrumented-test-app
  template:
    metadata:
      labels:
        app: go-instrumented-test-app
      annotations:
        #instrumentation.opentelemetry.io/inject-configuration: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # kubernetes.io/os label doesnt exist in k8s versions < 1.14  so make sure to choose label based on k8s version in aks yaml
              - key: otel
                operator: In
                values:
                - test
      containers:
      - name: go-instrumented-test-app
        image: gangams1980/go-instrumented-test-app:1.0
        imagePullPolicy: Always
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
               fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "http://$(NODE_IP):28331"
        - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
          value: "http://$(NODE_IP):28331"
        - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_EXPORTER_OTLP_LOGS_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "microsoft.applicationId=b89244ec-016a-441c-8730-4c554b99b98f,service.name=go-instrumented-test-app,service.instance.id=instance-1,service.version=1.0,deployment.environment=testing"
        - name: OTEL_LOG_LEVEL
          value: "verbose"
        # Application configuration
        - name: PORT
          value: "3001"
        # Go configuration
        - name: GOMAXPROCS
          value: "2"
        ports:
        - containerPort: 3001
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: go-instrumented-test-app-service
  namespace: ns1
  labels:
    app: go-instrumented-test-app
spec:
  type: LoadBalancer
  selector:
    app: go-instrumented-test-app
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
