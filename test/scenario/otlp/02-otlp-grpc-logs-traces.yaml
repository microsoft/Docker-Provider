# OTLP logs + traces over gRPC -> <nodeIP>:28332
#
# 28332 is the ama-logs host port for the OTLP gRPC receiver
# (APPMONITORING_OPENTELEMETRYLOGS_PORT_GRPC -> container port 4320).
# Each pod targets its own node via status.hostIP, so a DaemonSet exercises
# the receiver on every Linux node.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otlp-grpc-logs-gen
  namespace: otlp-grpc
  labels:
    app: otlp-gen
    signal: logs
    otlp-protocol: grpc
spec:
  selector:
    matchLabels:
      app: otlp-gen
      signal: logs
      otlp-protocol: grpc
  template:
    metadata:
      labels:
        app: otlp-gen
        signal: logs
        otlp-protocol: grpc
        app.kubernetes.io/component: otlp-grpc-logs-gen
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - logs
            - --otlp-endpoint=$(NODE_IP):28332
            - --otlp-insecure
            - --duration=inf
            - --rate=5
            - --workers=1
            - --interval=30s
            - --allow-export-failures
            - --service=$(OTEL_SERVICE_NAME)
            - --body=otlp grpc logs from $(NODE_NAME)
            - --severity-text=Info
            - --severity-number=9
            - --otlp-attributes=microsoft.applicationId="$(AI_APP_ID)"
            - --otlp-attributes=service.version="1.0.0"
            - --otlp-attributes=service.namespace="otlp-grpc"
            - --otlp-attributes=k8s.node.name="$(NODE_NAME)"
            - --otlp-attributes=k8s.pod.name="$(POD_NAME)"
            - --otlp-attributes=k8s.namespace.name="otlp-grpc"
            - --telemetry-attributes=otlp.transport="grpc"
            - --telemetry-attributes=otlp.target.port=28332
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: AI_APP_ID
              value: cfcfab17-8114-4a2f-94a6-a0ae5f186c14
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "microsoft.applicationId=$(AI_APP_ID),service.name=$(OTEL_SERVICE_NAME),service.namespace=otlp-grpc,service.version=1.0.0"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otlp-grpc-traces-gen
  namespace: otlp-grpc
  labels:
    app: otlp-gen
    signal: traces
    otlp-protocol: grpc
spec:
  selector:
    matchLabels:
      app: otlp-gen
      signal: traces
      otlp-protocol: grpc
  template:
    metadata:
      labels:
        app: otlp-gen
        signal: traces
        otlp-protocol: grpc
        app.kubernetes.io/component: otlp-grpc-traces-gen
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - traces
            - --otlp-endpoint=$(NODE_IP):28332
            - --otlp-insecure
            - --duration=inf
            - --rate=5
            - --workers=1
            - --interval=30s
            - --allow-export-failures
            - --service=$(OTEL_SERVICE_NAME)
            - --child-spans=3
            - --span-duration=50ms
            - --otlp-attributes=microsoft.applicationId="$(AI_APP_ID)"
            - --otlp-attributes=service.version="1.0.0"
            - --otlp-attributes=service.namespace="otlp-grpc"
            - --otlp-attributes=k8s.node.name="$(NODE_NAME)"
            - --otlp-attributes=k8s.pod.name="$(POD_NAME)"
            - --otlp-attributes=k8s.namespace.name="otlp-grpc"
            - --telemetry-attributes=otlp.transport="grpc"
            - --telemetry-attributes=otlp.target.port=28332
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: AI_APP_ID
              value: cfcfab17-8114-4a2f-94a6-a0ae5f186c14
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "microsoft.applicationId=$(AI_APP_ID),service.name=$(OTEL_SERVICE_NAME),service.namespace=otlp-grpc,service.version=1.0.0"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
