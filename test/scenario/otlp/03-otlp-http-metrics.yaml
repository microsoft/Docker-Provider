# OTLP metrics over HTTP/protobuf -> <nodeIP>:28333
#
# 28333 is the ama-metrics-node host port named otlp-http-port
# (-> prometheus-collector container port 56681).
# One pod per Linux node with three containers, one per metric type
# (Gauge / Sum / Histogram), so the full metric shape matrix is exercised.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otlp-http-metrics-gen
  namespace: otlp-http
  labels:
    app: otlp-gen
    signal: metrics
    otlp-protocol: http-protobuf
spec:
  selector:
    matchLabels:
      app: otlp-gen
      signal: metrics
      otlp-protocol: http-protobuf
  template:
    metadata:
      labels:
        app: otlp-gen
        signal: metrics
        otlp-protocol: http-protobuf
        app.kubernetes.io/component: otlp-http-metrics-gen
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: gauge
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - metrics
            - --otlp-endpoint=$(NODE_IP):28333
            - --otlp-http
            - --otlp-http-url-path=/v1/metrics
            - --otlp-insecure
            - --duration=inf
            - --rate=5
            - --workers=1
            - --interval=30s
            - --allow-export-failures
            - --service=$(OTEL_SERVICE_NAME)
            - --metric-type=Gauge
            - --otlp-metric-name=otlp_http_gauge
            - --otlp-attributes=microsoft.applicationId="$(AI_APP_ID)"
            - --otlp-attributes=service.version="1.0.0"
            - --otlp-attributes=service.namespace="otlp-http"
            - --otlp-attributes=k8s.node.name="$(NODE_NAME)"
            - --otlp-attributes=k8s.pod.name="$(POD_NAME)"
            - --otlp-attributes=k8s.namespace.name="otlp-http"
            - --telemetry-attributes=otlp.transport="http-protobuf"
            - --telemetry-attributes=otlp.target.port=28333
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: AI_APP_ID
              value: dc577961-1e7f-4715-a9fd-5fb35ae76911
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "microsoft.applicationId=$(AI_APP_ID),service.name=$(OTEL_SERVICE_NAME),service.namespace=otlp-http,service.version=1.0.0"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: sum
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - metrics
            - --otlp-endpoint=$(NODE_IP):28333
            - --otlp-http
            - --otlp-http-url-path=/v1/metrics
            - --otlp-insecure
            - --duration=inf
            - --rate=5
            - --workers=1
            - --interval=30s
            - --allow-export-failures
            - --service=$(OTEL_SERVICE_NAME)
            - --metric-type=Sum
            - --aggregation-temporality=delta
            - --otlp-metric-name=otlp_http_sum
            - --otlp-attributes=microsoft.applicationId="$(AI_APP_ID)"
            - --otlp-attributes=service.version="1.0.0"
            - --otlp-attributes=service.namespace="otlp-http"
            - --otlp-attributes=k8s.node.name="$(NODE_NAME)"
            - --otlp-attributes=k8s.pod.name="$(POD_NAME)"
            - --otlp-attributes=k8s.namespace.name="otlp-http"
            - --telemetry-attributes=otlp.transport="http-protobuf"
            - --telemetry-attributes=otlp.target.port=28333
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: AI_APP_ID
              value: dc577961-1e7f-4715-a9fd-5fb35ae76911
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "microsoft.applicationId=$(AI_APP_ID),service.name=$(OTEL_SERVICE_NAME),service.namespace=otlp-http,service.version=1.0.0"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: histogram
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - metrics
            - --otlp-endpoint=$(NODE_IP):28333
            - --otlp-http
            - --otlp-http-url-path=/v1/metrics
            - --otlp-insecure
            - --duration=inf
            - --rate=5
            - --workers=1
            - --interval=30s
            - --allow-export-failures
            - --service=$(OTEL_SERVICE_NAME)
            - --metric-type=Histogram
            - --otlp-metric-name=otlp_http_histogram
            - --otlp-attributes=microsoft.applicationId="$(AI_APP_ID)"
            - --otlp-attributes=service.version="1.0.0"
            - --otlp-attributes=service.namespace="otlp-http"
            - --otlp-attributes=k8s.node.name="$(NODE_NAME)"
            - --otlp-attributes=k8s.pod.name="$(POD_NAME)"
            - --otlp-attributes=k8s.namespace.name="otlp-http"
            - --telemetry-attributes=otlp.transport="http-protobuf"
            - --telemetry-attributes=otlp.target.port=28333
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: AI_APP_ID
              value: dc577961-1e7f-4715-a9fd-5fb35ae76911
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "microsoft.applicationId=$(AI_APP_ID),service.name=$(OTEL_SERVICE_NAME),service.namespace=otlp-http,service.version=1.0.0"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
