1. Update NetworkPolicy for Port 3002
bash
Copy
Download
cat <<EOF | kubectl apply -f -
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-http
  namespace: pets
spec:
  podSelector:
    matchLabels:
      app=store-front
  policyTypes: [Egress]
  egress:
  - to: []
    ports: 
    - port: 3002
      protocol: TCP
EOF
