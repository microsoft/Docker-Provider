
1. Check Service Definition
bash
Copy
Download
kubectl get svc -n pets product-service -o yaml
Look for spec.ports[*].targetPort in the output. This shows which port the service is using.

2. Verify Pod Container Ports
bash
Copy
Download
kubectl describe pod -n pets product-service-65c7fc7bf-s8s6q | grep -i port
This will show any declared container ports in the pod spec.

3. Use kubectl port-forward for Direct Test
bash
Copy
Download
# Forward local port 8080 to pod's port 80 (common web port)
kubectl port-forward -n pets product-service-65c7fc7bf-s8s6q 8080:80 &
curl -I localhost:8080
If you get HTTP headers, port 80 is active. Adjust the ports as needed.

