apiVersion: executor.testkube.io/v1
kind: Webhook
metadata:
  name: teams-integration
  namespace: testkube  
spec:
  events:
  - end-testsuite-failed
  uri: "$WEBHOOK_URI"
  payloadTemplate: "{\r\n    \"text\": \"Test Suite ''{{ .TestSuiteExecution.Name }}'' execution finished with ''{{ .TestSuiteExecution.Status }}'' status.\"\r\n}"