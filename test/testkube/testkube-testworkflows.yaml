apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: querylogs
  namespace: testkube
  labels:
    test-type: ginkgo-test
spec:
  config:
    AZURE_TENANT_ID:
      type: string
      default: ""
    AZURE_CLIENT_ID:
      type: string
      default: ""
    GENEVA_INTEGRATION:
      type: string
      default: "false"
  content:
    git:
      uri: https://github.com/microsoft/Docker-Provider/
      revision: ci_prod
      paths:
      - test/ginkgo-e2e
  container:
    workingDir: /data/repo/test/ginkgo-e2e
    image: golang:1.21
    env:
    - name: AZURE_TENANT_ID
      value: "{{config.AZURE_TENANT_ID}}"
    - name: AZURE_CLIENT_ID
      value: "{{config.AZURE_CLIENT_ID}}"
    - name: GENEVA_INTEGRATION
      value: "{{config.GENEVA_INTEGRATION}}"
  steps:
  - name: Install dependencies
    workingDir: /data/repo/test/ginkgo-e2e/querylogs
    shell: go mod download && go install github.com/onsi/ginkgo/v2/ginkgo@latest
  - name: Run Tests
    workingDir: /data/repo/test/ginkgo-e2e
    shell: ginkgo ./querylogs
  pod:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
---
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: e2e-tests-all
  namespace: testkube
  labels:
    test-type: test-suite
spec:
  config:
    GENEVA_INTEGRATION:
      type: string
      default: "false"
    AZURE_TENANT_ID:
      type: string
      default: ""
    AZURE_CLIENT_ID:
      type: string
      default: ""
  steps:
  - name: Run Container Status Tests
    execute:
      workflows:
      - name: containerstatus-linux
        config:
          GENEVA_INTEGRATION: "{{config.GENEVA_INTEGRATION}}"
      - name: containerstatus-windows
        config:
          GENEVA_INTEGRATION: "{{config.GENEVA_INTEGRATION}}"
  - name: Wait Before Query Logs
    delay: 2m
  - name: Run Query Logs Tests
    execute:
      workflows:
      - name: querylogs
        config:
          GENEVA_INTEGRATION: "{{config.GENEVA_INTEGRATION}}"
          AZURE_TENANT_ID: "{{config.AZURE_TENANT_ID}}"
          AZURE_CLIENT_ID: "{{config.AZURE_CLIENT_ID}}"
---
