apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: containerstatus-linux
  namespace: testkube
  labels:
    test-type: ginkgo-test
spec:
  config:
    GENEVA_INTEGRATION:
      type: string
      default: "false"
  content:
    git:
      uri: https://github.com/microsoft/Docker-Provider/
      revision: ci_prod
      paths:
      - test/ginkgo-e2e
  container:
    workingDir: /data/repo/test/ginkgo-e2e
    image: golang:1.21
    env:
    - name: GENEVA_INTEGRATION
      value: "{{config.GENEVA_INTEGRATION}}"
  steps:
  - name: Install dependencies
    workingDir: /data/repo/test/ginkgo-e2e/containerstatus
    shell: go mod download && go install github.com/onsi/ginkgo/v2/ginkgo@latest
  - name: Run Tests
    workingDir: /data/repo/test/ginkgo-e2e
    shell: ginkgo --label-filter "!(windows)" ./containerstatus
  pod:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
---
