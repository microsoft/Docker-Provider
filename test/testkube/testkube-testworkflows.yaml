apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: containerstatus-linux
  namespace: testkube
  labels:
    test-type: ginkgo-test
spec:
  content:
    git:
      uri: https://github.com/microsoft/Docker-Provider/
      revision: ci_prod
      paths:
      - test/ginkgo-e2e
  container:
    workingDir: /data/repo/test/ginkgo-e2e
    image: kubeshop/testkube-ginkgo-executor:latest
    env:
    - name: GENEVA_INTEGRATION
      value: "{{ shellquote(env.GENEVA_INTEGRATION) }}"
  steps:
  - name: Run Tests
    shell: ginkgo --label-filter "!(windows)" ./containerstatus
  pod:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
---
