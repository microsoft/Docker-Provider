apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: config-test-__SCENARIO__
  namespace: testkube
spec:
  config:
    GOTOOLCHAIN:
      type: string
      default: ""
  content:
    git:
      uri: https://github.com/microsoft/Docker-Provider/
      revision: __BRANCH__
      paths:
      - test/ginkgo-e2e
  steps:
    - name: Run test
      container:
        workingDir: /data/repo/test/ginkgo-e2e
        image: cerebro31/ginkgo-test:latest
        env:
        - name: GOTOOLCHAIN
          value: "{{config.GOTOOLCHAIN}}"
      shell: |
        ginkgo run -r --label-filter "__LABEL__" ./configprocessing
  pod:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
