apiVersion: tests.testkube.io/v3
kind: Test
metadata:
  name: containerstatus
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  type: ginkgo/test
  content:
    type: git
    repository:
      type: git
      uri: https://github.com/microsoft/Docker-Provider/
      branch: suyadav/runtestframeworkpipeline
      path: test/ginkgo-e2e
  executionRequest:
    args:
      - "--label-filter"
      - "!(arc-extension,linux-daemonset-custom-config)"
      - "./containerstatus"
    executePostRunScriptBeforeScraping: false
---
apiVersion: tests.testkube.io/v3
kind: Test
metadata:
  name: livenessprobe
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  type: ginkgo/test
  content:
    type: git
    repository:
      type: git
      uri: https://github.com/microsoft/Docker-Provider/
      branch: suyadav/runtestframeworkpipeline
      path: test/ginkgo-e2e
  executionRequest:
    args:
      - "--label-filter"
