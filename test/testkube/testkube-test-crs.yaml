---
apiVersion: tests.testkube.io/v3
kind: Test
metadata:
  name: querylogs
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  type: ginkgo/test
  content:
    type: git
    repository:
      type: git
      uri: https://github.com/microsoft/Docker-Provider/
      branch: suyadav/runtestframeworkpipeline
      path: test/ginkgo-e2e
  executionRequest:
    variables:
      AZURE_TENANT_ID:
        name: AZURE_TENANT_ID
        value: "$AZURE_TENANT_ID"
        type: basic
      AZURE_CLIENT_ID:
        name: AZURE_CLIENT_ID
        value: "$AZURE_CLIENT_ID"
        type: basic
    args:
      - "./querylogs"
    executePostRunScriptBeforeScraping: false
---
apiVersion: tests.testkube.io/v3
kind: TestSuite
metadata:
  name: e2e-tests-merge
  namespace: testkube
spec:
  steps:
  - stopOnFailure: false
    execute:
    - test: containerstatus
  - stopOnFailure: false
    execute:
    - delay: 2m0s
  - stopOnFailure: false
    execute:
    - test: querylogs