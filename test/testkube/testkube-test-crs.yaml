apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: containerstatus-linux
  namespace: testkube
  labels:
    executor: ginkgo-executor
    test-type: ginkgo-test
spec:
  config:
    GENEVA_INTEGRATION:
      type: string
      default: "false"
    GOTOOLCHAIN:
      type: string
      default: ""
  content:
    git:
      uri: https://github.com/microsoft/Docker-Provider/
      revision: ci_prod
      paths:
      - test/ginkgo-e2e
  steps:
    - name: Run test
      container:
        workingDir: /data/repo/test/ginkgo-e2e
        image: cerebro31/ginkgo-test:latest
        env:
        - name: GENEVA_INTEGRATION
          value: "{{config.GENEVA_INTEGRATION}}"
        - name: GOTOOLCHAIN
          value: "{{config.GOTOOLCHAIN}}"
      shell: |
        ginkgo run -r --label-filter "!(windows)" ./containerstatus
  pod:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
---
