# Default values for azuremonitor-containers-logs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

genevaLogsConfig:
  authidType: "AuthWorkloadIdentity"                                                          # supported AuthMSIToken or AuthWorkloadIdentity and recommended to use AuthWorkloadIdentity
  aadpodidbinding: "test"                                                                       # AAD POD Identity Name in case of AAD POD Managed Identity
  authid: "client_id#8c131584-2f4a-4c4b-8b8f-93236a16761e"                                    # MUST be in this format: client_id#<guid of the user assigned managed identity>
  environment: "Test"                                                                         # Supported values Test, Stage, DiagnosticsProd, FirstpartyProd, BillingProd, ExternalProd, CaMooncake, CaFairfax, CaBlackforest, Bleu
  account: "cigenevalogs"                                                                     # name of the Geneva Logs account
  namespace: "partnercilogs"                                                                    # name of the Geneva Logs account namespace
  region: "uksouth"                                                                           # GCS region of the Geneva Logs Account.
  configversion: "1.0"                                                                        # config version of the agent xml config.
  serviceAccountName: "ama-logs-geneva"                                                       # Service Account Name in case of AuthWorkloadIdentity. This account MUST be have federated credential configured in the User Assigned Managed Identity. https://learn.microsoft.com/en-us/azure/aks/workload-identity-deploy-cluster#create-the-federated-identity-credential

image:
  repository: mcr.microsoft.com/azuremonitor/containerinsights/ciprod
  tag: "3.1.30"
  pullPolicy: IfNotPresent
  agentVersion: "azure-mdsd-1.37.0"
nameOverride: ""
enableInternalMetrics: false
enableKubernetesMetadata: false
kubernetesMetadataIncludeFields: "podlabels,podannotations,poduid,image,imageid,imagerepo,imagetag"
fullnameOverride: ""
podAnnotations: {}
service:
  type: ClusterIP
  port: 24224
resources:
  limits:
    cpu: 4
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 900Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 30
  # hpa calculates the % usage against requests not limits
  targetMemoryUtilizationPercentage: 200
  targetCPUUtilizationPercentage: 200
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/os
          operator: In
          values:
          - linux
        - key: type
          operator: NotIn
          values:
          - virtual-kubelet
