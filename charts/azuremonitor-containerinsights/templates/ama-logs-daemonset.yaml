{{- $arcSettings := include "arc-extension-settings" . | fromYaml }}
{{- $isArcExtension := $arcSettings.isArcExtension }}
{{- $amalogsLinuxDefaultImageTag := dict "component" "ama-logs-linux" "version" .Values.global.commonGlobals.Versions.Kubernetes | include "get.addonImageTag" }}
{{/* Determine isusingaadauth value */}}
{{- $isusingaadauth := false -}}
{{- if not $isArcExtension -}}
  {{- if hasKey .Values.OmsAgent "isUsingAADAuth" -}}
    {{- $isusingaadauth = .Values.OmsAgent.isUsingAADAuth -}}
  {{- end -}}
{{- else -}}
  {{- if and .Values.amalogs (hasKey .Values.amalogs "useAADAuth") -}}
    {{- $isusingaadauth = .Values.amalogs.useAADAuth -}}
  {{- end -}}
{{- end -}}
{{/* Outer condition: AKS always renders, Arc renders with valid credentials */}}
{{- if or (not $isArcExtension) (and $isArcExtension (and (ne .Values.amalogs.secret.key "<your_workspace_key>") (ne .Values.amalogs.secret.wsid "<your_workspace_id>") (or (ne .Values.amalogs.env.clusterName "<your_cluster_name>") (ne .Values.amalogs.env.clusterId "<your_cluster_id>") (ne .Values.Azure.Cluster.ResourceId "<your_cluster_id>")))) }}
{{/* DaemonSet Sizing: AKS uses t-shirt sizing loop, Arc generates a single DaemonSet */}}
{{- $cloudEnv := lower $.Values.global.commonGlobals.CloudEnvironment }}
{{- $useDaemonSetSizing := false -}}
{{- $singleSize := dict -}}
{{- $sizes := list (dict) -}}
{{- $prevmaxCPU := 0 -}}
{{- if not $isArcExtension }}
{{- $useDaemonSetSizing = and (eq .Values.Azure.Cluster.Kind "automatic") .Values.OmsAgent.enableDaemonsetSizingForExtensions -}}
{{- $singleSize = .Values.OmsAgent.daemonSetSizingValues.singleSize -}}
{{- $sizes = list $singleSize -}}
{{- if $useDaemonSetSizing -}}
  {{- $sizes = prepend .Values.OmsAgent.daemonSetSizingValues.tShirtSizes $singleSize -}}
{{- else -}}
  {{- $sizes = list $singleSize -}}
{{- end -}}
{{- end }}
{{/* Generate DaemonSets */}}
{{- range $index, $size := $sizes -}}
{{- if gt $index 0 }}
---
{{ end -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ama-logs{{- if gt $index 0 }}-{{ $size.name }}{{- end }}
  namespace: kube-system
  labels:
{{- if $isArcExtension }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
{{- else }}
    kubernetes.azure.com/managedby: aks
{{- if $.Values.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
    {{- if and $useDaemonSetSizing $size.name }}
    kubernetes.azure.com/ds-tshirt-size: {{ $size.name }}
    {{- end }}
{{- end }}
    component: ama-logs-agent
    tier: node
spec:
  updateStrategy:
    type: RollingUpdate
{{- if not $isArcExtension }}
    rollingUpdate:
      maxUnavailable: 50%
{{- end }}
  selector:
    matchLabels:
{{- if $isArcExtension }}
      dsName: "ama-logs-ds"
{{- else }}
      component: ama-logs-agent
      tier: node
      {{- if and $useDaemonSetSizing $size.name }}
      kubernetes.azure.com/ds-tshirt-size: {{ $size.name }}
      {{- end }}
{{- end }}
  template:
    metadata:
      labels:
{{- if $isArcExtension }}
        dsName: "ama-logs-ds"
{{- else }}
        component: ama-logs-agent
        tier: node
        kubernetes.azure.com/managedby: aks
        {{- if and $useDaemonSetSizing $size.name }}
        kubernetes.azure.com/ds-tshirt-size: {{ $size.name }}
        {{- end }}
{{- end }}
      annotations:
{{- if $isArcExtension }}
        agentVersion: {{ $.Values.amalogs.image.agentVersion }}
        dockerProviderVersion: {{ $.Values.amalogs.image.dockerProviderVersion }}
        schema-versions: "v1"
        checksum/secret: {{ include (print $.Template.BasePath "/ama-logs-secret.yaml") $ | sha256sum }}
        checksum/config: {{ toYaml $.Values.amalogs.resources | sha256sum }}
        checksum/logsettings: {{ toYaml $.Values.amalogs.logsettings | sha256sum }}
{{- else }}
        agentVersion: "azure-mdsd-1.37.0"
        dockerProviderVersion: "18.0.1-0"
        schema-versions: "v1"
        WSID: {{ $.Values.OmsAgent.workspaceID | b64enc | quote }}
        kubernetes.azure.com/no-http-proxy-vars: "true"
{{- end }}
    spec:
{{- if $isArcExtension }}
      priorityClassName: ama-logs
{{- else }}
      priorityClassName: system-node-critical
{{- end }}
{{- if $isArcExtension }}
{{- if $.Values.amalogs.rbac }}
      serviceAccountName: ama-logs
{{- end }}
{{- else }}
      serviceAccountName: ama-logs
{{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "3"
      containers:
{{/* Addon Token Adapter Container */}}
{{- if $isArcExtension }}
{{- if and (ne $.Values.Azure.Cluster.ResourceId "<your_cluster_id>") ($.Values.amalogs.useAADAuth) }}
     {{- if not (eq $.Values.Azure.Cluster.Distribution "openshift") }}
        - name: addon-token-adapter
          imagePullPolicy: IfNotPresent
          env:
          - name: AZMON_COLLECT_ENV
            value: "false"
          - name: TOKEN_NAMESPACE
            value: "azure-arc"
{{-  $.Values.Azure.Identity.MSIAdapterYaml | nindent 10 }}
     {{- else }}
        - name: msi-adapter
          env:
          - name: AZMON_COLLECT_ENV
            value: "false"
          - name: TOKEN_NAMESPACE
            value: azure-arc
          - name: CLUSTER_IDENTITY
            value: "false"
          - name: CLUSTER_TYPE
            value: {{ (split "/" $.Values.Azure.Cluster.ResourceId)._7 }}
          - name: EXTENSION_ARMID
            value: {{ $.Values.Azure.Extension.ResourceId }}
          - name: EXTENSION_NAME
            value: {{ $.Values.Azure.Extension.Name }}
          - name: MSI_ADAPTER_LISTENING_PORT
            value: "8421"
          - name: MANAGED_IDENTITY_AUTH
            value: "true"
          - name: MSI_ADAPTER_LIVENESS_PORT
            value: "9090"
          - name: TEST_MODE
            value: "false"
          - name: TEST_FILE
            value: /data/token
          image: mcr.microsoft.com/azurearck8s/msi-adapter:1.29.3
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 9090
              scheme: "HTTP"
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              cpu: 50m
              memory: 100Mi
            requests:
              cpu: 20m
              memory: 50Mi
          lifecycle:
            postStart:
              exec:
                command: ["/data/msi-adapter-ready-watcher"]
     {{- end }}
{{- end }}
{{- else }}
{{- if $isusingaadauth }}
        - name: addon-token-adapter
{{ tpl $.Values.Azure.Identity.AADMsiTokenAdapterLinuxYaml $ | nindent 10 }}
{{- end }}
{{- end }}
{{/* Main ama-logs Container */}}
        - name: ama-logs
{{- if $isArcExtension }}
          image: {{ printf "%s:%s" $.Values.amalogs.image.repo $.Values.amalogs.image.tag }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml $.Values.amalogs.resources.daemonsetlinux | indent 12 }}
{{- else }}
          image: "{{ template "addon_mcr_repository_base" $ }}{{ $.Values.OmsAgent.imageRepository | default "/azuremonitor/containerinsights/ciprod" }}:{{- default $amalogsLinuxDefaultImageTag $.Values.OmsAgent.imageTagLinux -}}"
        {{- if $.Values.OmsAgent.isImagePullPolicyAlways }}
          imagePullPolicy: Always
        {{- else }}
          imagePullPolicy: IfNotPresent
        {{- end }}
          resources:
            limits:
              {{- $containerResources := index $size.containers "ama-logs" }}
              cpu: {{ include "maxResourceValue" (list $.Values.OmsAgent.omsAgentDsCPULimitLinux $containerResources.cpuLimit) }}
              memory: {{ include "maxResourceValue" (list $.Values.OmsAgent.omsAgentDsMemoryLimitLinux $containerResources.memoryLimit) }}
            requests:
              {{- $containerResources := index $size.containers "ama-logs" }}
              cpu: {{ $containerResources.cpuRequest }}
              memory: {{ $containerResources.memoryRequest }}
{{- end }}
          env:
{{- if $isArcExtension }}
          {{- if ne $.Values.amalogs.env.clusterId "<your_cluster_id>" }}
            - name: AKS_RESOURCE_ID
              value: {{ $.Values.amalogs.env.clusterId | quote }}
          {{- if ne $.Values.amalogs.env.clusterRegion "<your_cluster_region>" }}
            - name: AKS_REGION
              value: {{ $.Values.amalogs.env.clusterRegion | quote }}
          {{- end }}
          {{- else if ne $.Values.Azure.Cluster.ResourceId "<your_cluster_id>" }}
            - name: AKS_RESOURCE_ID
              value: {{ $.Values.Azure.Cluster.ResourceId | quote }}
            - name: USING_AAD_MSI_AUTH
              value: {{ $.Values.amalogs.useAADAuth | quote }}
          {{- if ne $.Values.Azure.Cluster.Region "<your_cluster_region>" }}
            - name: AKS_REGION
              value: {{ $.Values.Azure.Cluster.Region | quote }}
          {{- end }}
          {{- else }}
            - name: ACS_RESOURCE_NAME
              value: {{ $.Values.amalogs.env.clusterName | quote }}
          {{- end }}
{{- else }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: ama-logs
                  resource: limits.memory
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FBIT_SERVICE_FLUSH_INTERVAL
              value: "15"
            - name: FBIT_TAIL_BUFFER_CHUNK_SIZE
              value: "1"
            - name: FBIT_TAIL_BUFFER_MAX_SIZE
              value: "1"
            - name: AKS_CLUSTER_NAME
              value: "{{ $.Values.OmsAgent.aksClusterName }}"
            - name: AKS_RESOURCE_ID
              value: "{{ $.Values.OmsAgent.aksResourceID }}"
            - name: AKS_NODE_RESOURCE_GROUP
              value: "{{ $.Values.OmsAgent.aksNodeResourceGroup }}"
            - name: AKS_REGION
              value: "{{ $.Values.global.commonGlobals.Region }}"
            - name: USER_ASSIGNED_IDENTITY_CLIENT_ID
              value: "{{ $.Values.OmsAgent.identityClientID }}"
            - name: AZMON_CONTAINERLOGS_ONEAGENT_REGIONS
              value: "koreacentral,norwayeast,eastus2"
            - name: APPMONITORING_AUTOINSTRUMENTATION_ENABLED
              value: "{{ $.Values.AppmonitoringAgent.enabled }}"
            - name: APPMONITORING_OPENTELEMETRYLOGS_ENABLED
              value: "{{ $.Values.AppmonitoringAgent.isOpenTelemetryLogsEnabled | default false }}"
            - name: APPMONITORING_OPENTELEMETRYLOGS_PORT
              value: "{{ $.Values.AppmonitoringAgent.openTelemetryLogsPort | default 28331 }}"
            - name: APPMONITORING_OPENTELEMETRYLOGS_PORT_GRPC
              value: "{{ $.Values.AppmonitoringAgent.openTelemetryLogsPortGrpc | default 28332 }}"
            - name: AZMON_OPENTELEMETRYLOGS_CONTAINER_PORT
              value: "4319"
            - name: AZMON_OPENTELEMETRYLOGS_CONTAINER_PORT_GRPC
              value: "4320"
            - name: PROMETHEUS_METRICS_SCRAPING_DISABLED
              value: "{{ $.Values.OmsAgent.isPrometheusMetricsScrapingDisabled }}"
          {{- if (eq $cloudEnv "usnat") }}
            - name: MCR_URL
              value: "https://mcr.microsoft.eaglex.ic.gov/v2/"
          {{- end }}
          {{- if (eq $cloudEnv "ussec") }}
            - name: MCR_URL
              value: "https://mcr.microsoft.scloud/v2/"
          {{- end }}
          {{- if (eq $cloudEnv "azurebleucloud") }}
            - name: MCR_URL
              value: "https://mcr.microsoft.sovcloud-api.fr/v2/"
          {{- end }}
          {{- if $isusingaadauth }}
            - name: USING_AAD_MSI_AUTH
              value: "true"
          {{- else }}
            - name: USING_AAD_MSI_AUTH
              value: "false"
          {{- end }}
          {{- if eq ($.Values.OmsAgent.shouldMountSyslogHostPort | default false) true }}
            - name: SYSLOG_HOST_PORT
              value: {{ $.Values.OmsAgent.syslogHostPort | default 28330 | quote}}
          {{- end }}
            - name: AZMON_RETINA_FLOW_LOGS_ENABLED
              value: "{{ $.Values.OmsAgent.retinaFlowLogsEnabled | default false }}"
            - name: AZMON_RESOURCE_OPTIMIZATION_ENABLED
              value: "{{ $.Values.OmsAgent.isResourceOptimizationEnabled | default false }}"
            - name: AZMON_TELEGRAF_LIVENESSPROBE_ENABLED
              value: "{{ $.Values.OmsAgent.isTelegrafLivenessprobeEnabled | default false }}"
{{- end }}
            - name: CONTROLLER_TYPE
              value: "DaemonSet"
{{- if $isArcExtension }}
          {{- if $.Values.amalogs.enableHighLogScaleMode }}
            - name: ENABLE_HIGH_LOG_SCALE_MODE
              value: {{ $.Values.amalogs.enableHighLogScaleMode | quote }}
          {{- end }}
          {{- if $.Values.amalogs.syslog.enabled }}
            - name: SYSLOG_HOST_PORT
              value: {{ $.Values.amalogs.syslog.syslogPort | quote }}
          {{- end }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: ama-logs
                  resource: limits.memory
          {{- if not (empty $.Values.Azure.Extension.Name) }}
            - name: ARC_K8S_EXTENSION_NAME
              value: {{ $.Values.Azure.Extension.Name | quote }}
          {{- end }}
            - name: USER_ASSIGNED_IDENTITY_CLIENT_ID
              value: ""
          {{- if $.Values.amalogs.logsettings.logflushintervalsecs }}
            - name: FBIT_SERVICE_FLUSH_INTERVAL
              value: {{ $.Values.amalogs.logsettings.logflushintervalsecs | quote }}
          {{- end }}
          {{- if $.Values.amalogs.logsettings.tailbufchunksizemegabytes }}
            - name: FBIT_TAIL_BUFFER_CHUNK_SIZE
              value: {{ $.Values.amalogs.logsettings.tailbufchunksizemegabytes | quote }}
          {{- end }}
          {{- if $.Values.amalogs.logsettings.tailbufmaxsizemegabytes }}
            - name: FBIT_TAIL_BUFFER_MAX_SIZE
              value: {{ $.Values.amalogs.logsettings.tailbufmaxsizemegabytes | quote }}
          {{- end }}
            - name: ISTEST
              value: {{ $.Values.amalogs.ISTEST | quote }}
          {{- if $.Values.amalogs.isArcACluster }}
            - name: IS_ARCA_CLUSTER
              value: {{ $.Values.amalogs.isArcACluster | quote }}
          {{- end }}
          {{- if ne $.Values.amalogs.metricsEndpoint "<your_metrics_endpoint>" }}
            - name: CUSTOM_METRICS_ENDPOINT
              value: {{ $.Values.amalogs.metricsEndpoint | quote }}
          {{- else if ne $.Values.Azure.proxySettings.autonomousFqdn "<arca_autonomous_fqdn>" }}
            - name: CUSTOM_METRICS_ENDPOINT
              value: "https://metricsingestiongateway.monitoring.{{ $.Values.Azure.proxySettings.autonomousFqdn }}"
          {{- end }}
          {{- if ne $.Values.amalogs.tokenAudience "<your_token_audience>" }}
            - name: customResourceEndpoint
              value: {{ $.Values.amalogs.tokenAudience | quote }}
          {{- end }}
            - name: IS_CUSTOM_CERT
              value: {{ $.Values.Azure.proxySettings.isCustomCert | quote }}
            - name: ENABLE_CUSTOM_METRICS
              value: {{ $.Values.amalogs.enableCustomMetrics | quote }}
          {{- if $.Values.amalogs.ISTEST }}
            - name: AZMON_KUBERNETES_METADATA_ENABLED
              value: "true"
          {{- end }}
          {{- if $.Values.amalogs.enableTelegrafLivenessprobe }}
            - name: AZMON_TELEGRAF_LIVENESSPROBE_ENABLED
              value: {{ $.Values.amalogs.enableTelegrafLivenessprobe | quote }}
          {{- end }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_CLOUD_ENVIRONMENT
              value: "{{ $.Values.Azure.Cluster.Cloud | lower }}"
{{- else }}
            - name: CLUSTER_CLOUD_ENVIRONMENT
              value: "{{ $cloudEnv }}"
{{- end }}
            - name: AMCS_CLIENT_INSTALL_ID_OVERRIDE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            privileged: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          ports:
            - containerPort: 25225
              protocol: TCP
            - containerPort: 25224
              protocol: UDP
{{- if $isArcExtension }}
          {{- if $.Values.amalogs.syslog.enabled }}
            - name: syslog
              containerPort: {{ $.Values.amalogs.syslog.syslogPort }}
              hostPort: {{ $.Values.amalogs.syslog.syslogPort }}
              protocol: TCP
          {{- end }}
{{- else }}
          {{- if eq ($.Values.OmsAgent.shouldMountSyslogHostPort | default false) true }}
            - name: syslog
              containerPort: 28330
              hostPort: {{ $.Values.OmsAgent.syslogHostPort | default 28330 }}
              protocol: TCP
          {{- end }}
          {{- if eq ($.Values.AppmonitoringAgent.isOpenTelemetryLogsEnabled | default false) true }}
            - name: otlp-logs
              containerPort: 4319
              hostPort: {{ $.Values.AppmonitoringAgent.openTelemetryLogsPort | default 28331 }}
              protocol: TCP
            - name: otlp-logs-grpc
              containerPort: 4320
              hostPort: {{ $.Values.AppmonitoringAgent.openTelemetryLogsPortGrpc | default 28332 }}
              protocol: TCP
          {{- end }}
{{- end }}
          volumeMounts:
{{- if $isArcExtension }}
          {{- if $.Values.amalogs.enableServiceAccountTimeBoundToken }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          {{- end }}
{{- end }}
            - mountPath: /hostfs
              name: host-root
              readOnly: true
              mountPropagation: HostToContainer
            - mountPath: /var/log
              name: host-log
{{- if not $isArcExtension }}
          {{- if $.Values.OmsAgent.isSyslogEnabled }}
            - mountPath: /var/run/mdsd-ci
              name: mdsd-sock
          {{- end }}
          {{- if $.Values.OmsAgent.retinaFlowLogsEnabled }}
            - mountPath: /var/log/acns/hubble
              name: acns-hubble
          {{- end }}
            - mountPath: /var/run/mdsd-PrometheusSidecar
              name: mdsd-prometheus-sock
{{- end }}
            - mountPath: /var/lib/docker/containers
              name: containerlog-path
              readOnly: true
{{- if not $isArcExtension }}
            - mountPath: /mnt/docker
              name: containerlog-path-2
              readOnly: true
            - mountPath: /mnt/containers
              name: containerlog-path-3
              readOnly: true
{{- end }}
            - mountPath: /etc/kubernetes/host
              name: azure-json-path
            - mountPath: /etc/ama-logs-secret
              name: ama-logs-secret
              readOnly: true
{{- if not $isArcExtension }}
            - mountPath: /etc/omsagent-secret
              name: ama-logs-secret
              readOnly: true
{{- end }}
{{- if $isArcExtension }}
          {{- if and ($.Values.Azure.proxySettings.isProxyEnabled) ($.Values.Azure.proxySettings.proxyCert) (not $.Values.amalogs.ignoreExtensionProxySettings) }}
            - mountPath: /etc/ssl/certs/proxy-cert.crt
              subPath: PROXYCERT.crt
              name: ama-logs-secret
              readOnly: true
          {{- end }}
{{- end }}
            - mountPath: /etc/config/settings
              name: settings-vol-config
              readOnly: true
{{- if $isArcExtension }}
          {{- if $.Values.amalogs.logsettings.custommountpath }}
            - mountPath: {{ $.Values.amalogs.logsettings.custommountpath }}
              name: custom-mount-path
          {{- end }}
{{- end }}
            - mountPath: /etc/config/settings/adx
              name: ama-logs-adx-secret
              readOnly: true
{{- if not $isArcExtension }}
          {{- if (eq (include "should_mount_hostca" $ ) "true" ) }}
            - mountPath: /anchors/mariner
              name: anchors-mariner
              readOnly: true
            - mountPath: /anchors/ubuntu
              name: anchors-ubuntu
              readOnly: true
          {{- end }}
          {{- if $.Values.OmsAgent.trustedCA }}
            - mountPath: /etc/ssl/certs/proxy-cert.crt
              subPath: PROXYCERT.crt
              name: ama-logs-secret
              readOnly: true
          {{- end }}
{{- end }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/livenessprobe.sh
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
{{/* Prometheus Sidecar Container */}}
{{- if $isArcExtension }}
   {{- if $.Values.amalogs.sidecarscraping }}
        - name: ama-logs-prometheus
          image: {{ printf "%s:%s" $.Values.amalogs.image.repo $.Values.amalogs.image.tag }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml $.Values.amalogs.resources.daemonsetlinuxsidecar | indent 12 }}
          env:
          {{- if ne $.Values.amalogs.env.clusterId "<your_cluster_id>" }}
            - name: AKS_RESOURCE_ID
              value: {{ $.Values.amalogs.env.clusterId | quote }}
          {{- if ne $.Values.amalogs.env.clusterRegion "<your_cluster_region>" }}
            - name: AKS_REGION
              value: {{ $.Values.amalogs.env.clusterRegion | quote }}
          {{- end }}
          {{- else if ne $.Values.Azure.Cluster.ResourceId "<your_cluster_id>" }}
            - name: AKS_RESOURCE_ID
              value: {{ $.Values.Azure.Cluster.ResourceId | quote }}
            - name: USING_AAD_MSI_AUTH
              value: {{ $.Values.amalogs.useAADAuth | quote }}
          {{- if ne $.Values.Azure.Cluster.Region "<your_cluster_region>" }}
            - name: AKS_REGION
              value: {{ $.Values.Azure.Cluster.Region | quote }}
          {{- end }}
          {{- else }}
            - name: ACS_RESOURCE_NAME
              value: {{ $.Values.amalogs.env.clusterName | quote }}
          {{- end }}
            - name: CONTROLLER_TYPE
              value: "DaemonSet"
            - name: CONTAINER_TYPE
              value: "PrometheusSidecar"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: ama-logs-prometheus
                  resource: limits.memory
            - name: ISTEST
              value: {{ $.Values.amalogs.ISTEST | quote }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_CLOUD_ENVIRONMENT
              value: "{{ $.Values.Azure.Cluster.Cloud | lower }}"
            - name: AMCS_CLIENT_INSTALL_ID_OVERRIDE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            privileged: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          volumeMounts:
          {{- if $.Values.amalogs.enableServiceAccountTimeBoundToken }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          {{- end }}
            - mountPath: /etc/kubernetes/host
              name: azure-json-path
            - mountPath: /etc/ama-logs-secret
              name: ama-logs-secret
              readOnly: true
          {{- if and ($.Values.Azure.proxySettings.isProxyEnabled) ($.Values.Azure.proxySettings.proxyCert) (not $.Values.amalogs.ignoreExtensionProxySettings) }}
            - mountPath: /etc/ssl/certs/proxy-cert.crt
              subPath: PROXYCERT.crt
              name: ama-logs-secret
              readOnly: true
          {{- end }}
            - mountPath: /etc/config/settings
              name: settings-vol-config
              readOnly: true
            - mountPath: /etc/config/osm-settings
              name: osm-settings-vol-config
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/livenessprobe.sh
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
   {{- end }}
{{- else }}
      {{- if and (not $.Values.OmsAgent.isPrometheusMetricsScrapingDisabled) $.Values.OmsAgent.isSidecarScrapingEnabled }}
        - name: ama-logs-prometheus
          image: "{{ template "addon_mcr_repository_base" $ }}{{ $.Values.OmsAgent.imageRepository | default "/azuremonitor/containerinsights/ciprod" }}:{{- default $amalogsLinuxDefaultImageTag $.Values.OmsAgent.imageTagLinux -}}"
        {{- if $.Values.OmsAgent.isImagePullPolicyAlways }}
          imagePullPolicy: Always
        {{- else }}
          imagePullPolicy: IfNotPresent
        {{- end }}
          resources:
            limits:
              {{- $containerResources := index $size.containers "ama-logs-prometheus" }}
              cpu: {{ include "maxResourceValue" (list $.Values.OmsAgent.omsAgentPrometheusSidecarCPULimit $containerResources.cpuLimit) }}
              memory: {{ include "maxResourceValue" (list $.Values.OmsAgent.omsAgentPrometheusSidecarMemoryLimit $containerResources.memoryLimit) }}
            requests:
              {{- $containerResources := index $size.containers "ama-logs-prometheus" }}
              cpu: {{ $containerResources.cpuRequest }}
              memory: {{ $containerResources.memoryRequest }}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: ama-logs-prometheus
                  resource: limits.memory
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AKS_CLUSTER_NAME
              value: "{{ $.Values.OmsAgent.aksClusterName }}"
            - name: AKS_RESOURCE_ID
              value: "{{ $.Values.OmsAgent.aksResourceID }}"
            - name: AKS_NODE_RESOURCE_GROUP
              value: "{{ $.Values.OmsAgent.aksNodeResourceGroup }}"
            - name: AKS_REGION
              value: "{{ $.Values.global.commonGlobals.Region }}"
            - name: CONTROLLER_TYPE
              value: "DaemonSet"
            - name: CONTAINER_TYPE
              value: "PrometheusSidecar"
            - name: USER_ASSIGNED_IDENTITY_CLIENT_ID
              value: "{{ $.Values.OmsAgent.identityClientID }}"
          {{- if (eq $cloudEnv "usnat") }}
            - name: MCR_URL
              value: "https://mcr.microsoft.eaglex.ic.gov/v2/"
          {{- end }}
          {{- if (eq $cloudEnv "ussec") }}
            - name: MCR_URL
              value: "https://mcr.microsoft.scloud/v2/"
          {{- end }}
          {{- if (eq $cloudEnv "azurebleucloud") }}
            - name: MCR_URL
              value: "https://mcr.microsoft.sovcloud-api.fr/v2/"
          {{- end }}
          {{- if $isusingaadauth }}
            - name: USING_AAD_MSI_AUTH
              value: "true"
          {{- else }}
            - name: USING_AAD_MSI_AUTH
              value: "false"
          {{- end }}
          {{- if eq ($.Values.OmsAgent.shouldMountSyslogHostPort | default false) true }}
            - name: SYSLOG_HOST_PORT
              value: {{ $.Values.OmsAgent.syslogHostPort | default 28330 | quote}}
          {{- end }}
            - name: AZMON_TELEGRAF_LIVENESSPROBE_ENABLED
              value: "{{ $.Values.OmsAgent.isTelegrafLivenessprobeEnabled | default false }}"
            - name: CLUSTER_CLOUD_ENVIRONMENT
              value: "{{ $cloudEnv }}"
          securityContext:
            privileged: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          volumeMounts:
            - mountPath: /etc/kubernetes/host
              name: azure-json-path
            - mountPath: /etc/ama-logs-secret
              name: ama-logs-secret
              readOnly: true
            - mountPath: /etc/omsagent-secret
              name: ama-logs-secret
              readOnly: true
            - mountPath: /etc/config/settings
              name: settings-vol-config
              readOnly: true
            - mountPath: /etc/config/osm-settings
              name: osm-settings-vol-config
              readOnly: true
            - mountPath: /var/run/mdsd-PrometheusSidecar
              name: mdsd-prometheus-sock
          {{- if (eq (include "should_mount_hostca" $ ) "true" ) }}
            - mountPath: /anchors/mariner
              name: anchors-mariner
              readOnly: true
            - mountPath: /anchors/ubuntu
              name: anchors-ubuntu
              readOnly: true
          {{- end }}
          {{- if $.Values.OmsAgent.trustedCA }}
            - mountPath: /etc/ssl/certs/proxy-cert.crt
              subPath: PROXYCERT.crt
              name: ama-logs-secret
              readOnly: true
          {{- end }}
          {{- if $.Values.OmsAgent.isSyslogEnabled }}
            - mountPath: /var/run/mdsd-ci
              name: mdsd-sock
          {{- end }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/livenessprobe.sh
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
      {{- end }}
{{- end }}
{{/* Affinity and Tolerations */}}
{{- if $isArcExtension }}
   {{- with $.Values.amalogs.daemonset.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
   {{- end }}
   {{- if $.Values.amalogs.scheduleOnTaintedNodes }}
   {{- with $.Values.amalogs.tolerationsUnrestricted }}
      tolerations: {{- toYaml . | nindent 8 }}
   {{- end }}
   {{- else }}
   {{- with $.Values.amalogs.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
   {{- end }}
   {{- end }}
{{- else }}
{{- $useDaemonSetSizing := and (eq $.Values.Azure.Cluster.Kind "automatic") $.Values.OmsAgent.enableDaemonsetSizingForExtensions }}
{{- $singleSize := dict "name" "" }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.azure.com/cluster
                operator: Exists
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
              {{- if $useDaemonSetSizing -}}
              {{- if eq (default "" $size.name) (default "" $singleSize.name) -}}
              {{/* Target non-Karpenter nodes */}}
              - key: karpenter.azure.com/aksnodeclass
                operator: DoesNotExist
              {{- else }}
              {{/* Target Karpenter nodes with CPU range */}}
              {{- if gt $prevmaxCPU 0 -}}
              - key: karpenter.azure.com/sku-cpu
                operator: Gt
                values:
                - "{{ $prevmaxCPU }}"
              {{- end -}}
              {{/* Add new line. */}}
              {{- if and $prevmaxCPU $size.maxCPU }}
              {{ end -}}
              {{- if $size.maxCPU -}}
              - key: karpenter.azure.com/sku-cpu
                operator: Lt
                values:
                - "{{ add ($size.maxCPU | int) 1 }}"
              {{- end -}}
              {{- end -}}
              {{- end }}
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - operator: "Exists"
          effect: NoExecute
        - operator: "Exists"
          effect: NoSchedule
        - operator: "Exists"
          effect: PreferNoSchedule
{{- end }}
{{/* Volumes */}}
      volumes:
{{- if $isArcExtension }}
      {{- if $.Values.amalogs.enableServiceAccountTimeBoundToken }}
        - name: kube-api-access
          projected:
            sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3600
            - configMap:
                items:
                - key: ca.crt
                  path: ca.crt
                name: kube-root-ca.crt
            - downwardAPI:
                items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace
      {{- end }}
{{- end }}
        - name: host-root
          hostPath:
            path: /
{{- if not $isArcExtension }}
        - name: mdsd-prometheus-sock
          emptyDir: {}
{{- end }}
        - name: container-hostname
          hostPath:
            path: /etc/hostname
        - name: host-log
          hostPath:
            path: /var/log
{{- if not $isArcExtension }}
        {{- if $.Values.OmsAgent.isSyslogEnabled }}
        - name: mdsd-sock
          hostPath:
            path: /var/run/mdsd-ci
        {{- end }}
        {{- if $.Values.OmsAgent.retinaFlowLogsEnabled }}
        - name: acns-hubble
          hostPath:
            path: /var/log/acns/hubble
        {{- end }}
{{- end }}
        - name: containerlog-path
          hostPath:
            path: /var/lib/docker/containers
{{- if not $isArcExtension }}
        - name: containerlog-path-2
          hostPath:
            path: /mnt/docker
        - name: containerlog-path-3
          hostPath:
            path: /mnt/containers
{{- end }}
        - name: azure-json-path
          hostPath:
            path: /etc/kubernetes
        - name: ama-logs-secret
          secret:
            secretName: ama-logs-secret
        - name: settings-vol-config
          configMap:
            name: container-azm-ms-agentconfig
            optional: true
{{- if $isArcExtension }}
      {{- if $.Values.amalogs.logsettings.custommountpath }}
        - name: custom-mount-path
          hostPath:
            path: {{ $.Values.amalogs.logsettings.custommountpath }}
      {{- end }}
{{- end }}
        - name: ama-logs-adx-secret
          secret:
            secretName: ama-logs-adx-secret
            optional: true
        - name: osm-settings-vol-config
          configMap:
            name: container-azm-ms-osmconfig
            optional: true
{{- if not $isArcExtension }}
      {{- if (eq (include "should_mount_hostca" $ ) "true" ) }}
        - name: anchors-ubuntu
          hostPath:
            path: /usr/local/share/ca-certificates/
            type: DirectoryOrCreate
        - name: anchors-mariner
          hostPath:
            path: /etc/pki/ca-trust/source/anchors
            type: DirectoryOrCreate
      {{- end }}

{{- if and (ne (default "" $size.name) (default "" $singleSize.name)) $size.maxCPU }}
{{- $prevmaxCPU = $size.maxCPU | int }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
