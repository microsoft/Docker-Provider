# Unified values for Azure Monitor Container Insights
# This chart supports both AKS Addon and Arc K8s Extension deployment modes

# ============================================================================
# SHARED CONFIGURATION (at top to match AKS chart order)
# ============================================================================
# Global settings
global:
  commonGlobals:
    CloudEnvironment: <your_cluster_cloud>
    isAutomaticSKU: false
    Region: <your_cluster_region>
    Versions:
      Kubernetes: "1.32.7"

# Application monitoring settings
AppmonitoringAgent:
  enabled: false
  isOpenTelemetryLogsEnabled: false
  openTelemetryLogsPort: 28331
  openTelemetryLogsPortGrpc: 28332

legacyAddonDelivery: false

# ============================================================================
# OmsAgent - AKS ADDON VALUES
# ============================================================================
# Default values for ama-logs configuration
# OmsAgent configuration
OmsAgent:
  aksResourceID: <your_cluster_id>
  enableDaemonsetSizingForExtensions: true
  isCustomMetricsDisabled: false
  isUsingAADAuth: "true"
  workspaceID: "<your_workspace_id>"
  accessTokenSecretName: "ama-logs-secret"
  # Cloud environment
  isMoonCake: false
  isFairfax: false
  workspaceKey: "<your_workspace_key>"
  
  # Image configuration
  imageRepository: "/azuremonitor/containerinsights/ciprod"
  imageTagLinux: "${IMAGE_TAG}"
  imageTagWindows: "${IMAGE_TAG_WINDOWS}"
  isImagePullPolicyAlways: false

  # Resource ID and cluster information
  # aksResourceID: "<your_cluster_id>"
  # aksClusterName: "<your_cluster_name>"
  # aksNodeResourceGroup: "<your_node_resource_group>"
  # aksRegion: "<your_cluster_region>"
  
  # Resource limits and requests
  omsAgentDsCPULimitLinux: "500m"
  omsAgentDsMemoryLimitLinux: "1Gi"
  omsAgentDsCPULimitWindows: "2"
  omsAgentDsMemoryLimitWindows: "2Gi"
  omsAgentDsCPURequestWindows: "100m"
  omsAgentDsMemoryRequestWindows: "150Mi"
  omsAgentRsCPULimit: "1"
  omsAgentRsMemoryLimit: "1.5Gi"
  omsAgentPrometheusSidecarCPULimit: "500m"
  omsAgentPrometheusSidecarMemoryLimit: "1Gi"

  # Multitenancy settings
  omsAgentMultitenancyCPULimitLinux: "1"
  omsAgentMultitenancyMemoryLimitLinux: "1Gi"
  omsAgentMultitenancyCPURequestLinux: "100m"
  omsAgentMultitenancyMemoryRequestLinux: "100Mi"
  omsAgentMultitenancyLogsHPAMinReplicas: 2
  omsAgentMultitenancyLogsHPAMaxReplicas: 50
  omsAgentMultitenancyHPAAvgCPUUtilization: 700
  omsAgentMultitenancyHPAAvgMemoryUtilization: 700

  # Feature flags
  isSyslogEnabled: true
  isPrometheusMetricsScrapingDisabled: false
  isSidecarScrapingEnabled: true
  isRSVPAEnabled: false
  retinaFlowLogsEnabled: false
  isResourceOptimizationEnabled: false
  isWindowsAMAFluentBitEnabled: false
  isMultitenancyLogsEnabled: false
  isWindowsBurstableQoSEnabled: true
  isTelegrafLivenessprobeEnabled: false
  isWindowsAMAEnabled: true
  isWindowsAddonTokenAdapterDisabled: false
  legacyAddonDelivery: false

  # Network settings
  syslogHostPort: "28330"
  shouldMountSyslogHostPort: true
  # httpProxy: ""
  # httpsProxy: ""
  # trustedCA: ""

  # # Identity settings
  # identityClientID: "<your_identity_client_id>"
  # accessTokenSecretName: "aad-msi-auth-token"

  # DaemonSet sizing configuration
  daemonSetSizingValues:
    singleSize:
      containers:
        addon-token-adapter:
          cpuLimit: "100m"
          memoryLimit: "100Mi"
          cpuRequest: "20m"
          memoryRequest: "50Mi"
        ama-logs:
          cpuLimit: "0"  # Toggle always wins - no tier minimum
          memoryLimit: "0"  # Toggle always wins - no tier minimum
          cpuRequest: "75m"
          memoryRequest: "325Mi"
        ama-logs-prometheus:
          cpuLimit: "0"  # Toggle always wins - no tier minimum
          memoryLimit: "0"  # Toggle always wins - no tier minimum
          cpuRequest: "75m"
          memoryRequest: "225Mi"
    tShirtSizes:
      - name: "xs"
        maxCPU: 2
        containers:
          addon-token-adapter:
            cpuLimit: "100m"
            memoryLimit: "100Mi"
            cpuRequest: "10m"
            memoryRequest: "20Mi"
          ama-logs:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "45m"
            memoryRequest: "343Mi"
          ama-logs-prometheus:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "20m"
            memoryRequest: "100Mi"
      - name: "s"
        maxCPU: 4
        containers:
          addon-token-adapter:
            cpuLimit: "100m"
            memoryLimit: "100Mi"
            cpuRequest: "10m"
            memoryRequest: "20Mi"
          ama-logs:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "100m"
            memoryRequest: "476Mi"
          ama-logs-prometheus:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "20m"
            memoryRequest: "100Mi"
      - name: "m"
        maxCPU: 8
        containers:
          addon-token-adapter:
            cpuLimit: "100m"
            memoryLimit: "100Mi"
            cpuRequest: "10m"
            memoryRequest: "20Mi"
          ama-logs:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "2196Mi"  # Tier-specific minimum - will be max of toggle vs this
            cpuRequest: "161m"
            memoryRequest: "978Mi"
          ama-logs-prometheus:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "20m"
            memoryRequest: "100Mi"
      - name: "l"
        maxCPU: 16
        containers:
          addon-token-adapter:
            cpuLimit: "100m"
            memoryLimit: "100Mi"
            cpuRequest: "10m"
            memoryRequest: "20Mi"
          ama-logs:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "2356Mi"  # Tier-specific minimum - will be max of toggle vs this
            cpuRequest: "229m"
            memoryRequest: "1058Mi"
          ama-logs-prometheus:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "20m"
            memoryRequest: "100Mi"
      - name: "xl"
        containers:
          addon-token-adapter:
            cpuLimit: "100m"
            memoryLimit: "100Mi"
            cpuRequest: "10m"
            memoryRequest: "20Mi"
          ama-logs:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "2918Mi"  # Tier-specific minimum - will be max of toggle vs this
            cpuRequest: "404m"
            memoryRequest: "1339Mi"
          ama-logs-prometheus:
            cpuLimit: "0"  # Toggle always wins - no tier minimum
            memoryLimit: "0"  # Toggle always wins - no tier minimum
            cpuRequest: "20m"
            memoryRequest: "100Mi"
# ============================================================================
# amalogs - ARC K8S EXTENSION VALUES
# ============================================================================
amalogs:
  image:
    repo: "mcr.microsoft.com/azuremonitor/containerinsights/ciprod"
    tag: "${IMAGE_TAG}"
    tagWindows: "${IMAGE_TAG_WINDOWS}"
    pullPolicy: IfNotPresent
    dockerProviderVersion: "18.0.1-0"
    agentVersion: "azure-mdsd-1.42.0"
    winAgentVersion: "47.7.1" # there is no base agent version for windows agent

  # The priority used by the ama-logs priority class for the daemonset pods
  # Note that this is not execution piority - it is scheduling priority, as
  # in getting scheduled to the node.  This needs to be greater than 0 such
  # that the daemonset pods, which can not schedule onto different nodes as
  # they are defined to run on specific nodes, are not accidentally frozen
  # out of a node due to other pods showing up earlier in scheduling.
  # (DaemonSet pods by definition only are created once the node exists for
  # them to be created for and thus it is possible to have "normal" pods
  # already in line to run on the node before the DeamonSet controller got a
  # chance to build pod for the node and give it to the scheduler)
  # Should be some number greater than default (0)
  priority: 10

  # This flag used to determine whether to run is high log scale mode or not
  enableHighLogScaleMode: false

  # This used for running agent pods in test mode.
  # if set to true additional agent workflow logs will be emitted which are used for e2e and arc k8s conformance testing
  ISTEST: false

  # This flag used to determine whether to use AAD MSI auth or not for Arc K8s cluster
  useAADAuth: false

  # This flag used to determine whether this cluster is connected to ArcA control plane. This value will be setup before pushed into on-premise ArcA ACR.
  isArcACluster: false

  # This flag used to ignore the proxy settings
  ignoreExtensionProxySettings: false

  # This flag allows ama-logs pods to be scheduled on nodes with taints
  scheduleOnTaintedNodes: false

  # This flag to enable and disable service account timebound token and default is enabled
  enableServiceAccountTimeBoundToken: true

  # This flag to enable and disable custom metrics. Custom metrics is getting deprecated so default is disabled
  enableCustomMetrics: false

  # This flag to enable and disable Telegraf livenessprobe and default is disabled
  enableTelegrafLivenessprobe: false

  ## To get your workspace id and key do the following
  ## You can create a Azure Loganalytics workspace from portal.azure.com and get its ID & PRIMARY KEY from 'Advanced Settings' tab in the Ux.

  secret:
    wsid: <your_workspace_id>
    key: <your_workspace_key>
  domain: opinsights.azure.com
  proxy: <your_proxy_config>
  # This metricsEndpoint used to define the endpoint custom metrics emit to. If not defined, default public Azure monitoring endpoint '{aks_region}.monitoring.azure.com' will be used.
  metricsEndpoint: <your_metrics_endpoint>
  tokenAudience: <your_token_audience>
  env:
    clusterName: <your_cluster_name>
    ## Applicable for only managed clusters hosted in Azure
    clusterId: <your_cluster_id>
    clusterRegion: <your_cluster_region>
  rbac: true
  sidecarscraping: true
  # Syslog collection on Arc K8s clusters requires additional config dependencies on the node and is currently not supported. Please open a service ticket if there is a syslog collection requirement.
  syslog:
    enabled: false
    syslogPort: 28330
  logsettings:
    logflushintervalsecs: "15"
    tailbufchunksizemegabytes: "1"
    tailbufmaxsizemegabytes: "1"
    ## Applicable for only Azure Stack Edge K8s since it has custom mount path for container logs which will have symlink to /var/log path
    custommountpath: ""

  ## Configure node tolerations for scheduling onto nodes with taints
  ## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
  ## https://kubernetes.io/blog/2022/04/07/upcoming-changes-in-kubernetes-1-24/
  ##
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoExecute"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "PreferNoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoExecute"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "PreferNoSchedule"
  tolerationsUnrestricted:
    - operator: "Exists"
      effect: "NoSchedule"
    - operator: "Exists"
      effect: "NoExecute"
    - operator: "Exists"
      effect: "PreferNoSchedule"

  ## Pod scheduling preferences.
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ##
  daemonset:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: type
              operator: NotIn
              values:
                - virtual-kubelet
  deployment:
    affinity:
      nodeAffinity:
        # affinity to schedule on to ephemeral os node if its available
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: storageprofile
                operator: NotIn
                values:
                - managed
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: type
              operator: NotIn
              values:
                - virtual-kubelet
            - key: kubernetes.io/role
              operator: NotIn
              values:
                - master
  ## Configure resource requests and limits
  ## ref: http://kubernetes.io/docs/user-guide/compute-resources/
  ##
  resources:
    daemonsetlinux:
      requests:
        cpu: 75m
        memory: 325Mi
      limits:
        cpu: 150m
        memory: 750Mi
    daemonsetwindows:
      requests:
        cpu: 500m
        memory: 700Mi
      limits:
        cpu: 2
        memory: 2Gi
    deployment:
      requests:
        cpu: 150m
        memory: 250Mi
      limits:
        cpu: 1
        memory: 1Gi
    daemonsetlinuxsidecar:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 75m
          memory: 225Mi

# ============================================================================
# AZURE ARC K8S EXTENSION METADATA
# ============================================================================
Azure:
  Cluster:
    Cloud: <your_cluster_cloud>
    Region: <your_cluster_region>
    ResourceId: <your_cluster_id>
    Kind: "base"  # Can be "automatic" or "base"
    Distribution: ""  # e.g., "openshift", "aks_edge_k3s", "aks_edge_k8s", etc.
  Extension:
    Name: ""
    ResourceId: ""
  Identity:
    AADMsiTokenAdapterLinuxYaml: |-
      command:
        - /addon-token-adapter
      args:
        - --secret-namespace=kube-system
        - --secret-name=aad-msi-auth-token
        - --token-server-listening-port={{ .Values.msiTokenServerListeningPort | default 7777 }}
        - --health-server-listening-port={{ .Values.msiTokenHealthServerPort | default 9999 }}
        - --restart-pod-waiting-minutes-on-broken-connection={{ .Values.msiTokenRestartPodMinutes | default 240 }}
      image: "mcr.microsoft.com/aks/msi/addon-token-adapter:master.260209.2"
      imagePullPolicy: IfNotPresent
      env:
        - name: AZMON_COLLECT_ENV
          value: "false"
      livenessProbe:
        httpGet:
          path: /healthz
          port: {{ .Values.msiTokenHealthServerPort | default 9999 }}
        initialDelaySeconds: 10
        periodSeconds: 60
      resources:
        limits:
          cpu: {{ ((.Values.msiTokenAdapterLinux | default dict).cpuLimit) | default "500m" }}
          memory: {{ ((.Values.msiTokenAdapterLinux | default dict).memoryLimit) | default "500Mi" }}
        requests:
          cpu: {{ ((.Values.msiTokenAdapterLinux | default dict).cpuRequest) | default "20m" }}
          memory: {{ ((.Values.msiTokenAdapterLinux | default dict).memoryRequest) | default "30Mi" }}
      securityContext:
        capabilities:
          drop:
            - ALL
          add:
            - NET_ADMIN
            - NET_RAW
    AADMsiTokenAdapterWindowsYaml: |-
      command:
        - addon-token-adapter-win
      args:
        - --secret-namespace=kube-system
        - --secret-name=aad-msi-auth-token
        - --token-server-listening-port={{ .Values.msiTokenServerListeningPort | default 7777 }}
        - --health-server-listening-port={{ .Values.msiTokenHealthServerPort | default 9999 }}
        - --restart-pod-waiting-minutes-on-broken-connection={{ .Values.msiTokenRestartPodMinutes | default 240 }}
      image: "mcr.microsoft.com/aks/msi/addon-token-adapter:master.260209.2"
      imagePullPolicy: IfNotPresent
      livenessProbe:
        httpGet:
          path: /healthz
          port: {{ .Values.msiTokenHealthServerPort | default 9999 }}
        initialDelaySeconds: 10
        periodSeconds: 60
      resources:
        limits:
          cpu: {{ ((.Values.msiTokenAdapterWin | default dict).cpuLimit) | default "250m" }}
          memory: {{ ((.Values.msiTokenAdapterWin | default dict).memoryLimit) | default "500Mi" }}
        requests:
          cpu: {{ ((.Values.msiTokenAdapterWin | default dict).cpuRequest) | default "100m" }}
          memory: {{ ((.Values.msiTokenAdapterWin | default dict).memoryRequest) | default "100Mi" }}
      securityContext:
        capabilities:
          drop:
            - ALL
          add:
            - NET_ADMIN
  proxySettings:
    isProxyEnabled: false
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
    proxyCert: ""
    isCustomCert: false
    autonomousFqdn: "<arca_autonomous_fqdn>"

msiTokenAdapterLinux:
  cpuLimit: "500m"
  memoryLimit: "500Mi"
  cpuRequest: "20m"
  memoryRequest: "30Mi"
msiTokenAdapterWin:
  cpuLimit: "250m"
  memoryLimit: "500Mi"
  cpuRequest: "100m"
  memoryRequest: "100Mi"
