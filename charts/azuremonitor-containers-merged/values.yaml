# Unified values for Azure Monitor Containers
# Supports both AKS Addon and Arc K8s Extension deployment modes

# ============================================================================
# Azure Arc K8s Extension Parameters
# These are populated automatically by Azure Arc K8s Resource Provider
# ============================================================================
Azure:
  Cluster:
    Cloud: <your_cluster_cloud>
    Region: <your_cluster_region>
    ResourceId: <your_cluster_id>
    Distribution: ""  # e.g., "openshift", "aks_edge_k3s", "aks_edge_k8s", etc.
  Extension:
    Name: ""
    ResourceId: ""
  proxySettings:
    isProxyEnabled: false
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
    proxyCert: ""
    isCustomCert: false
    autonomousFqdn: "<arca_autonomous_fqdn>"
  Identity:
    MSIAdapterYaml: ""  # OpenShift-specific MSI adapter configuration

# ============================================================================
# Arc K8s Specific Configuration (amalogs.*)
# ============================================================================
amalogs:
  # Image configuration
  image:
    repo: "mcr.microsoft.com/azuremonitor/containerinsights/ciprod"
    tag: "3.1.34"
    tagWindows: "win-3.1.34"
    pullPolicy: IfNotPresent
    dockerProviderVersion: "18.0.1-0"
    agentVersion: "azure-mdsd-1.37.0"
    winAgentVersion: "46.31.3"
  
  # Pod priority (must be > 0 for proper scheduling)
  priority: 10
  
  # Feature flags
  enableHighLogScaleMode: false
  ISTEST: false
  useAADAuth: false
  isArcACluster: false
  ignoreExtensionProxySettings: false
  scheduleOnTaintedNodes: false
  enableServiceAccountTimeBoundToken: true
  enableCustomMetrics: false
  enableTelegrafLivenessprobe: false
  
  # Workspace credentials
  secret:
    wsid: <your_workspace_id>
    key: <your_workspace_key>
  
  # Domain (auto-configured based on cloud)
  domain: opinsights.azure.com
  
  # Proxy and endpoints
  proxy: <your_proxy_config>
  metricsEndpoint: <your_metrics_endpoint>
  tokenAudience: <your_token_audience>
  
  # Cluster environment
  env:
    clusterName: <your_cluster_name>
    clusterId: <your_cluster_id>
    clusterRegion: <your_cluster_region>
  
  # RBAC
  rbac: true
  
  # Prometheus sidecar
  sidecarscraping: true
  
  # Syslog
  syslog:
    enabled: false
    syslogPort: 28330
  
  # Log settings
  logsettings:
    logflushintervalsecs: "15"
    tailbufchunksizemegabytes: "1"
    tailbufmaxsizemegabytes: "1"
    custommountpath: ""
  
  # Tolerations (aligned with Arc source for control-plane and master)
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoExecute"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "PreferNoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoExecute"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "PreferNoSchedule"
  
  tolerationsUnrestricted:
    - operator: "Exists"
      effect: "NoSchedule"
    - operator: "Exists"
      effect: "NoExecute"
    - operator: "Exists"
      effect: "PreferNoSchedule"
  
  # Affinity
  daemonset:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: type
              operator: NotIn
              values:
                - virtual-kubelet
  
  deployment:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: storageprofile
                  operator: NotIn
                  values:
                    - managed
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: type
              operator: NotIn
              values:
                - virtual-kubelet
            - key: kubernetes.io/role
              operator: NotIn
              values:
                - master
  
  # Resources
  resources:
    daemonsetlinux:
      requests:
        cpu: 75m
        memory: 325Mi
      limits:
        cpu: 150m
        memory: 750Mi
    daemonsetwindows:
      requests:
        cpu: 500m
        memory: 700Mi
      limits:
        cpu: 2
        memory: 2Gi
    deployment:
      requests:
        cpu: 150m
        memory: 250Mi
      limits:
        cpu: 1
        memory: 1Gi
    daemonsetlinuxsidecar:
      requests:
        cpu: 75m
        memory: 225Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ============================================================================
# AKS Addon Configuration (OmsAgent.*)
# ============================================================================
OmsAgent:
  # Cluster information
  aksResourceID: <your_cluster_id>
  aksClusterName: ""
  aksNodeResourceGroup: ""
  aksRegion: ""
  
  # Workspace
  workspaceID: "<your_workspace_id>"
  workspaceKey: "<your_workspace_key>"
  
  # Authentication
  isUsingAADAuth: "true"
  identityClientID: ""
  accessTokenSecretName: "ama-logs-secret"
  
  # Cloud environment
  isMoonCake: false
  isFairfax: false
  
  # Feature flags
  isMultitenancyLogsEnabled: false
  isRSVPAEnabled: false
  isSyslogEnabled: true
  isSidecarScrapingEnabled: true
  isPrometheusMetricsScrapingDisabled: false
  isRetinaFlowLogsEnabled: false
  isResourceOptimizationEnabled: false
  isWindowsAMAEnabled: true
  isWindowsAMAFluentBitEnabled: false
  isWindowsBurstableQoSEnabled: true
  isWindowsAddonTokenAdapterDisabled: false
  isCustomMetricsDisabled: true
  isTelegrafLivenessprobeEnabled: false
  
  # Image configuration
  imageTagLinux: "3.1.34"
  imageTagWindows: "win-3.1.34"
  isImagePullPolicyAlways: false
  
  # Dynamic sizing
  enableDaemonSetSizing: false
  
  # Resource limits
  omsAgentDsCPULimitLinux: "500m"
  omsAgentDsMemoryLimitLinux: "1Gi"
  omsAgentDsCPULimitWindows: "2"
  omsAgentDsMemoryLimitWindows: "2Gi"
  omsAgentDsCPURequestWindows: "100m"
  omsAgentDsMemoryRequestWindows: "150Mi"
  omsAgentRsCPULimit: "1"
  omsAgentRsMemoryLimit: "1.5Gi"
  omsAgentPrometheusSidecarCPULimit: "500m"
  omsAgentPrometheusSidecarMemoryLimit: "1Gi"
  
  # Multitenancy
  omsAgentMultitenancyCPULimitLinux: "1"
  omsAgentMultitenancyMemoryLimitLinux: "1Gi"
  omsAgentMultitenancyCPURequestLinux: "100m"
  omsAgentMultitenancyMemoryRequestLinux: "100Mi"
  omsAgentMultitenancyLogsHPAMinReplicas: 2
  omsAgentMultitenancyLogsHPAMaxReplicas: 50
  omsAgentMultitenancyHPAAvgCPUUtilization: 700
  omsAgentMultitenancyHPAAvgMemoryUtilization: 700
  
  # Syslog
  syslogHostPort: "28330"
  shouldMountSyslogHostPort: true
  
  # Proxy
  httpProxy: ""
  httpsProxy: ""
  trustedCA: ""

# ============================================================================
# Application Monitoring
# ============================================================================
AppmonitoringAgent:
  enabled: false
  isOpenTelemetryLogsEnabled: false
  openTelemetryLogsPort: 28331

# ============================================================================
# Global Settings
# ============================================================================
global:
  commonGlobals:
    CloudEnvironment: <your_cluster_cloud>
    isAutomaticSKU: false
    Region: <your_cluster_region>
    Versions:
      Kubernetes: "1.29.0"

# Legacy addon delivery mode
legacyAddonDelivery: false