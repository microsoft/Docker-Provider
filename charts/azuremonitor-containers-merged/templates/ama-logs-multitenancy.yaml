{{- $settings := include "arc-extension-settings" . | fromYaml }}
{{- if and $settings.isAKSAddon $settings.usingAADAuth $settings.multitenancyEnabled }}
#
# AKS-only: Multitenancy logs - HPA, Service, and Deployment
#
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ama-logs-hpa
  namespace: kube-system
  labels:
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ama-logs-multitenancy
  minReplicas: {{ .Values.OmsAgent.omsAgentMultitenancyLogsHPAMinReplicas }}
  maxReplicas: {{ .Values.OmsAgent.omsAgentMultitenancyLogsHPAMaxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.OmsAgent.omsAgentMultitenancyHPAAvgCPUUtilization }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.OmsAgent.omsAgentMultitenancyHPAAvgMemoryUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 1200
      policies:
      - type: Percent
        value: 5
        periodSeconds: 180
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 5
        periodSeconds: 5
      - type: Percent
        value: 100
        periodSeconds: 5
      selectPolicy: Max
---
apiVersion: v1
kind: Service
metadata:
  name: ama-logs-service
  namespace: kube-system
  labels:
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 24225
      targetPort: 24225
      protocol: TCP
      name: fluentbit-fwd
  selector:
    rsName: "ama-logs-multitenancy"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ama-logs-multitenancy
  namespace: kube-system
  labels:
    component: ama-logs-agent
    tier: node
    kubernetes.azure.com/managedby: aks
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      rsName: "ama-logs-multitenancy"
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        rsName: "ama-logs-multitenancy"
        kubernetes.azure.com/managedby: aks
      annotations:
        agentVersion: "azure-mdsd-1.37.0"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        dockerProviderVersion: "18.0.1-0"
        schema-versions: "v1"
        WSID: {{ $settings.workspaceID | b64enc | quote }}
        kubernetes.azure.com/no-http-proxy-vars: "true"
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
      volumes:
        - name: ama-logs-secret
          secret:
            secretName: ama-logs-secret
        - name: settings-vol-config
          configMap:
            name: container-azm-ms-agentconfig
            optional: true
{{- if (eq (include "should_mount_hostca" .) "true") }}
        - name: anchors-ubuntu
          hostPath:
            path: /usr/local/share/ca-certificates/
            type: DirectoryOrCreate
        - name: anchors-mariner
          hostPath:
            path: /etc/pki/ca-trust/source/anchors
            type: DirectoryOrCreate
{{- end }}
      serviceAccountName: ama-logs
      containers:
        - name: addon-token-adapter
          command:
            - /addon-token-adapter
          args:
            - --secret-namespace=kube-system
            - --secret-name={{ $settings.accessTokenSecretName }}
            - --token-server-listening-port=8888
            - --health-server-listening-port=9999
            - --restart-pod-waiting-minutes-on-broken-connection=240
          image: "{{ template "addon_mcr_repository_base" . }}/aks/msi/addon-token-adapter:{{ dict "component" "addon-token-adapter-linux" "version" .Values.global.commonGlobals.Versions.Kubernetes | include "get.imagetag" }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: AZMON_COLLECT_ENV
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
        - name: ama-logs
          image: "{{ $settings.imageRepo }}:{{ $settings.imageTagLinux }}"
          imagePullPolicy: {{ $settings.imagePullPolicy }}
          resources:
            limits:
              cpu: {{ .Values.OmsAgent.omsAgentMultitenancyCPULimitLinux }}
              memory: {{ .Values.OmsAgent.omsAgentMultitenancyMemoryLimitLinux }}
            requests:
              cpu: {{ .Values.OmsAgent.omsAgentMultitenancyCPURequestLinux }}
              memory: {{ .Values.OmsAgent.omsAgentMultitenancyMemoryRequestLinux }}
          env:
            - name: AZMON_MULTI_TENANCY_LOG_COLLECTION
              value: "true"
            - name: AZMON_MULTI_TENANCY_LOGS_SERVICE_MODE
              value: "true"
            - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: ama-logs
                  resource: limits.memory
            - name: AKS_CLUSTER_NAME
              value: {{ $settings.clusterName | quote }}
            - name: AKS_RESOURCE_ID
              value: {{ $settings.resourceId | quote }}
            - name: AKS_NODE_RESOURCE_GROUP
              value: {{ .Values.OmsAgent.aksNodeResourceGroup | quote }}
            - name: AKS_REGION
              value: {{ $settings.region | quote }}
            - name: CONTROLLER_TYPE
              value: "ReplicaSet"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: USING_AAD_MSI_AUTH
              value: "true"
            - name: APPMONITORING_AUTOINSTRUMENTATION_ENABLED
              value: "{{ $settings.appMonitoringEnabled }}"
            - name: CLUSTER_CLOUD_ENVIRONMENT
              value: {{ $settings.cloudEnvironment | quote }}
          securityContext:
            privileged: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          ports:
            - name: http
              containerPort: 24225
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/ama-logs-secret
              name: ama-logs-secret
              readOnly: true
            - mountPath: /etc/config/settings
              name: settings-vol-config
              readOnly: true
{{- if (eq (include "should_mount_hostca" .) "true") }}
            - mountPath: /anchors/mariner
              name: anchors-mariner
              readOnly: true
            - mountPath: /anchors/ubuntu
              name: anchors-ubuntu
              readOnly: true
{{- end }}
{{- if $settings.isProxyEnabled }}
{{- if $settings.proxyCert }}
            - mountPath: /etc/ssl/certs/proxy-cert.crt
              subPath: PROXYCERT.crt
              name: ama-logs-secret
              readOnly: true
{{- end }}
{{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/livenessprobe.sh
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 24225
            initialDelaySeconds: 10
            periodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/cluster
                operator: Exists
              - key: type
                operator: NotIn
                values:
                  - virtual-kubelet
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.azure.com/mode
                operator: In
                values:
                  - system
{{- end }}
