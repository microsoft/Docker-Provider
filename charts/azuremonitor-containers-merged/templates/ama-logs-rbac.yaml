{{- $settings := include "arc-extension-settings" . | fromYaml }}
{{- $rbacApiVersion := "rbac.authorization.k8s.io/v1" }}
{{- if not (semverCompare ">=1.16.0" .Capabilities.KubeVersion.Version) }}
{{- $rbacApiVersion = "rbac.authorization.k8s.io/v1beta1" }}
{{- end }}
{{- if $settings.rbacEnabled }}
#
# RBAC Resources for ama-logs
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ama-logs
  namespace: kube-system
  labels:
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
---
kind: ClusterRole
apiVersion: {{ $rbacApiVersion }}
metadata:
  name: ama-logs-reader
  labels:
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
rules:
- apiGroups: [""]
  resources: ["pods", "events", "nodes", "nodes/stats", "nodes/metrics", "nodes/spec", "nodes/proxy", "namespaces", "services", "persistentvolumes"]
  verbs: ["list", "get", "watch"]
- apiGroups: ["apps", "extensions", "autoscaling"]
  resources: ["replicasets", "deployments", "horizontalpodautoscalers"]
  verbs: ["list"]
{{- if $settings.isArcExtension }}
- apiGroups: ["clusterconfig.azure.com"]
  resources: ["azureclusteridentityrequests", "azureclusteridentityrequests/status"]
  verbs: ["get", "create", "patch", "list", "update", "delete"]
{{- end }}
{{- if $settings.rsvpaEnabled }}
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["ama-logs-rs"]
  verbs: ["get", "patch"]
{{- end }}
{{- if $settings.usingAADAuth }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $settings.accessTokenSecretName | quote }}]
  verbs: ["get", "watch"]
{{- end }}
{{- if and $settings.isArcExtension (empty $settings.arcExtensionName) }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["container-insights-clusteridentityrequest-token"]
  verbs: ["get"]
{{- end }}
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
kind: ClusterRoleBinding
apiVersion: {{ $rbacApiVersion }}
metadata:
  name: amalogsclusterrolebinding
  labels:
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
subjects:
  - kind: ServiceAccount
    name: ama-logs
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ama-logs-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}