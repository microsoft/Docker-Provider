{{- $settings := include "arc-extension-settings" . | fromYaml }}
{{- $renderWindows := false }}
{{- if $settings.isAKSAddon }}
{{- if $settings.windowsAMAEnabled }}
{{- $renderWindows = true }}
{{- end }}
{{- else if and $settings.isArcExtension (not $settings.usingAADAuth) (ne $settings.workspaceID "") (ne $settings.workspaceID "<your_workspace_id>") }}
{{- $renderWindows = true }}
{{- end }}
{{- if $renderWindows }}
#
# Windows DaemonSet for ama-logs
# AKS: when windowsAMAEnabled; Arc: when not using AAD auth and workspace configured
#
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ama-logs-windows
  namespace: kube-system
  labels:
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: ama-logs-agent-windows
    tier: node-win
{{- if $settings.isAKSAddon }}
    kubernetes.azure.com/managedby: aks
{{- end }}
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
spec:
  updateStrategy:
    type: RollingUpdate
{{- if $settings.isAKSAddon }}
    rollingUpdate:
      maxUnavailable: 50%
{{- end }}
  selector:
    matchLabels:
{{- if $settings.isArcExtension }}
      dsName: "ama-logs-ds"
{{- else }}
      component: ama-logs-agent-windows
      tier: node-win
{{- end }}
  template:
    metadata:
      labels:
{{- if $settings.isArcExtension }}
        dsName: "ama-logs-ds"
{{- else }}
        component: ama-logs-agent-windows
        tier: node-win
        kubernetes.azure.com/managedby: aks
{{- end }}
      annotations:
        agentVersion: {{ if $settings.isArcExtension }}{{ .Values.amalogs.image.winAgentVersion }}{{ else }}46.17.2{{ end }}
        dockerProviderVersion: {{ if $settings.isArcExtension }}{{ .Values.amalogs.image.dockerProviderVersion }}{{ else }}18.0.1-0{{ end }}
        schema-versions: "v1"
        WSID: {{ $settings.workspaceID | b64enc | quote }}
        kubernetes.azure.com/no-http-proxy-vars: "true"
{{- if $settings.isArcExtension }}
        checksum/secret: {{ include (print $.Template.BasePath "/ama-logs-secret.yaml") . | sha256sum }}
        checksum/config: {{ toYaml .Values.amalogs.resources | sha256sum }}
{{- end }}
    spec:
{{- if $settings.isAKSAddon }}
      priorityClassName: system-node-critical
{{- else }}
      priorityClassName: ama-logs
{{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "3"
      nodeSelector:
        kubernetes.io/os: windows
{{- if $settings.rbacEnabled }}
      serviceAccountName: ama-logs
{{- end }}
      containers:
{{- if and $settings.isAKSAddon $settings.usingAADAuth (not $settings.windowsAddonTokenAdapterDisabled) }}
        - name: addon-token-adapter-win
          command:
            - addon-token-adapter-win
          args:
            - --secret-namespace=kube-system
            - --secret-name={{ $settings.accessTokenSecretName }}
            - --token-server-listening-port=8888
            - --health-server-listening-port=9999
            - --restart-pod-waiting-minutes-on-broken-connection=240
          image: "{{ template "addon_mcr_repository_base" . }}/aks/msi/addon-token-adapter:{{ dict "component" "addon-token-adapter-windows" "version" .Values.global.commonGlobals.Versions.Kubernetes | include "get.imagetag" }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: AZMON_COLLECT_ENV
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            limits:
              cpu: 400m
              memory: 400Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
{{- end }}
        - name: ama-logs-windows
          image: "{{ $settings.imageRepo }}:{{ $settings.imageTagWindows }}"
          imagePullPolicy: {{ $settings.imagePullPolicy }}
          resources:
{{- if $settings.isArcExtension }}
{{ toYaml .Values.amalogs.resources.daemonsetwindows | indent 12 }}
{{- else }}
{{- if .Values.OmsAgent.isWindowsBurstableQoSEnabled }}
            requests:
              cpu: {{ .Values.OmsAgent.omsAgentDsCPURequestWindows }}
              memory: {{ .Values.OmsAgent.omsAgentDsMemoryRequestWindows }}
            limits:
              cpu: {{ .Values.OmsAgent.omsAgentDsCPULimitWindows }}
              memory: {{ .Values.OmsAgent.omsAgentDsMemoryLimitWindows }}
{{- else }}
            limits:
              cpu: {{ .Values.OmsAgent.omsAgentDsCPULimitWindows }}
              memory: {{ .Values.OmsAgent.omsAgentDsMemoryLimitWindows }}
{{- end }}
{{- end }}
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          env:
            - name: FBIT_SERVICE_FLUSH_INTERVAL
              value: "15"
            - name: FBIT_TAIL_BUFFER_CHUNK_SIZE
              value: "1"
            - name: FBIT_TAIL_BUFFER_MAX_SIZE
              value: "1"
            - name: AKS_RESOURCE_ID
              value: {{ $settings.resourceId | quote }}
            - name: AKS_REGION
              value: {{ $settings.region | quote }}
            - name: CONTROLLER_TYPE
              value: "DaemonSet"
            - name: USER_ASSIGNED_IDENTITY_CLIENT_ID
              value: {{ $settings.identityClientID | quote }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PODNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONTAINER_MEMORY_LIMIT_IN_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: ama-logs-windows
                  resource: limits.memory
            - name: SIDECAR_SCRAPING_ENABLED
              value: {{ $settings.sidecarScrapingEnabled | quote }}
            - name: ENABLE_CUSTOM_METRICS
              value: {{ $settings.customMetricsEnabled | quote }}
            - name: CLUSTER_CLOUD_ENVIRONMENT
              value: {{ $settings.cloudEnvironment | quote }}
{{- if $settings.isAKSAddon }}
            - name: USING_AAD_MSI_AUTH
              value: {{ if $settings.usingAADAuth }}"true"{{ else }}"false"{{ end }}
            - name: APPMONITORING_AUTOINSTRUMENTATION_ENABLED
              value: "{{ $settings.appMonitoringEnabled }}"
            - name: PROMETHEUS_METRICS_SCRAPING_DISABLED
              value: "{{ $settings.prometheusScrapingDisabled }}"
            - name: AZMON_TELEGRAF_LIVENESSPROBE_ENABLED
              value: "{{ $settings.telegrafLivenessprobeEnabled }}"
            - name: AZMON_WINDOWS_FLUENT_BIT_ENABLED
              value: "{{ $settings.windowsFluentBitEnabled }}"
{{- if or (eq $settings.cloudEnvironment "usnat") (eq $settings.cloudEnvironment "ussec") (eq $settings.cloudEnvironment "azurebleucloud") }}
            - name: REQUIRES_CERT_BOOTSTRAP
              value: "true"
{{- end }}
{{- else }}
            - name: USING_AAD_MSI_AUTH
              value: {{ $settings.usingAADAuth | quote }}
{{- if $settings.isTestMode }}
            - name: AZMON_KUBERNETES_METADATA_ENABLED
              value: "true"
{{- end }}
{{- end }}
          volumeMounts:
            - mountPath: C:\ProgramData\docker\containers
              name: docker-windows-containers
              readOnly: true
            - mountPath: C:\var
              name: docker-windows-kuberenetes-container-logs
            - mountPath: C:\etc\config\settings
              name: settings-vol-config
              readOnly: true
            - mountPath: C:\etc\ama-logs-secret
              name: ama-logs-secret
              readOnly: true
{{- if $settings.isAKSAddon }}
            - mountPath: C:\etc\omsagent-secret
              name: ama-logs-secret
              readOnly: true
            - mountPath: C:\etc\config\adx
              name: ama-logs-adx-secret
              readOnly: true
            - mountPath: C:\etc\kubernetes\host
              name: azure-json-path
              readOnly: true
{{- if and $settings.usingAADAuth (eq (include "should_mount_hostca" .) "true") }}
            - mountPath: C:\ca
              name: ca-certs
              readOnly: true
{{- end }}
{{- if $settings.usingAADAuth }}
            - mountPath: C:\etc\IMDS-access-token
              name: imds-token
              readOnly: true
{{- end }}
{{- end }}
          livenessProbe:
            exec:
              command:
                - cmd
                - /c
                - C:\opt\amalogswindows\scripts\cmd\livenessprobe.exe
                - fluent-bit.exe
                - fluentdwinaks
                - "C:\\etc\\amalogswindows\\filesystemwatcher.txt"
                - "C:\\etc\\amalogswindows\\renewcertificate.txt"
{{- if and $settings.isAKSAddon $settings.usingAADAuth }}
                - "MonAgentCore.exe"
{{- end }}
            periodSeconds: 60
            initialDelaySeconds: 180
            timeoutSeconds: 15
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - windows
              - key: type
                operator: NotIn
                values:
                  - virtual-kubelet
{{- if $settings.isAKSAddon }}
              - key: kubernetes.azure.com/cluster
                operator: Exists
{{- end }}
      tolerations:
{{- if $settings.isAKSAddon }}
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - operator: "Exists"
          effect: NoExecute
        - operator: "Exists"
          effect: NoSchedule
        - operator: "Exists"
          effect: PreferNoSchedule
{{- else }}
{{- if $settings.scheduleOnTaintedNodes }}
{{- with .Values.amalogs.tolerationsUnrestricted }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- else }}
{{- with .Values.amalogs.tolerations }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
      volumes:
        - name: docker-windows-kuberenetes-container-logs
          hostPath:
            path: C:\var
        - name: docker-windows-containers
          hostPath:
            path: C:\ProgramData\docker\containers
            type: DirectoryOrCreate
        - name: settings-vol-config
          configMap:
            name: container-azm-ms-agentconfig
            optional: true
        - name: ama-logs-secret
          secret:
            secretName: ama-logs-secret
        - name: ama-logs-adx-secret
          secret:
            secretName: ama-logs-adx-secret
            optional: true
{{- if $settings.isAKSAddon }}
        - name: azure-json-path
          hostPath:
            path: C:\k
{{- if (eq (include "should_mount_hostca" .) "true") }}
        - name: ca-certs
          hostPath:
            path: C:\ca
{{- end }}
{{- if $settings.usingAADAuth }}
        - name: imds-token
          secret:
            secretName: {{ $settings.accessTokenSecretName }}
{{- end }}
{{- end }}
{{- end }}
