{{- $settings := include "arc-extension-settings" . | fromYaml }}
#
# ConfigMap for cluster resource ID
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: container-azm-ms-aks-k8scluster
  namespace: kube-system
  labels:
{{- if $settings.legacyAddonDelivery }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
{{- end }}
data:
  CLUSTER_RESOURCE_ID: {{ $settings.resourceId | quote }}