{{- $settings := include "arc-extension-settings" . | fromYaml }}
{{- if $settings.isArcExtension }}
{{- if or (contains "microsoft.kubernetes/connectedclusters" ($settings.resourceId | lower)) (contains "microsoft.hybridcontainerservice/provisionedclusters" ($settings.resourceId | lower)) }}
#
# Arc K8s Extension Identity Resources
# These CRDs are required for Arc K8s extension authentication
#
{{- if not (empty $settings.arcExtensionName) }}
apiVersion: clusterconfig.azure.com/v1beta1
kind: AzureExtensionIdentity
metadata:
  name: {{ $settings.arcExtensionName }}
  namespace: azure-arc
spec:
  serviceAccounts:
    - name: ama-logs
      namespace: kube-system
  tokenNamespace: azure-arc
---
{{- end }}
apiVersion: clusterconfig.azure.com/v1beta1
kind: AzureClusterIdentityRequest
metadata:
  name: container-insights-clusteridentityrequest
  namespace: azure-arc
spec:
  {{- $cloudEnv := $settings.cloudEnvironment | upper }}
  {{- if eq $cloudEnv "AZUREPUBLICCLOUD" }}
  audience: https://monitor.azure.com/
  {{- else if eq $cloudEnv "AZURECHINACLOUD" }}
  audience: https://monitor.azure.cn/
  {{- else if eq $cloudEnv "AZUREBLEUCLOUD" }}
  audience: https://monitor.sovcloud-api.fr/
  {{- else if eq $cloudEnv "AZUREUSGOVERNMENTCLOUD" }}
  audience: https://monitor.azure.us/
  {{- else if and $settings.isArcACluster (ne $settings.tokenAudience "") }}
  audience: {{ $settings.tokenAudience | quote }}
  {{- else }}
  audience: https://monitor.azure.com/
  {{- end }}
  {{- if not (empty $settings.arcExtensionName) }}
  resourceId: {{ $settings.arcExtensionName }}
  {{- end }}
{{- end }}
{{- end }}