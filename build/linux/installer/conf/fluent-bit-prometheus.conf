[INPUT]
    Name prometheus_scrape
    Tag prometheus.metrics
    host 10.224.0.5
    port 10250
    scrape_interval 15
    bearer_token /var/run/secrets/kubernetes.io/serviceaccount/token
    tls.ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    tls.verify off
    tls on

[FILTER]
    Name grep
    Match prometheus.metrics
    Regex __name__ kubelet_running_pod_count|kubelet_running_pods|volume_manager_total_volumes|kubelet_node_config_error|process_resident_memory_bytes|process_cpu_seconds_total

[OUTPUT]
    Name file
    Match prometheus.metrics
    File /var/log/prometheus_metrics_test.log