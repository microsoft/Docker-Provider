[INPUT]
    Name tail
    Alias ama-logs_mdsd_diagnostics_tail
    Tag ama.mdsd.diagnostics
    Path /var/opt/microsoft/linuxmonagent/log/mdsd.err,/var/opt/microsoft/linuxmonagent/log/mdsd.warn
    Read_from_Head true
    DB /var/opt/microsoft/docker-cimprov/state/mdsd-stdout.db
    DB.Sync Normal
    Mem_Buf_Limit 1m
    Skip_Long_Lines On
    Refresh_Interval 1
    Rotate_Wait 20

[OUTPUT]
    Name stdout
    Match ama.mdsd.diagnostics
    Format json_lines
