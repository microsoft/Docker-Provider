[INPUT]
    Name containerinventory
    Tag  oms.container.oneagent.containerInsights.CONTAINER_INVENTORY_BLOB
    run_interval 60

[INPUT]
    Name perf
    Tag  oms.container.oneagent.containerInsights.LINUX_PERF_BLOB
    run_interval 60

[INPUT]
    Name disk
    Tag  oms.container.oneagent.containerInsights.DISK_BLOB
    run_interval 180

[OUTPUT]
    Name  file
    Match oms.container.oneagent.containerInsights.DISK_BLOB
    Path  /var/log/fluent-bit-disk.log
    Format json_lines