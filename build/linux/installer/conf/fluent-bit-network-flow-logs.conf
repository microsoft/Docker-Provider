[INPUT]
    Name                tail
    Alias               oms_networkflow_input
    Tag                 oms.networkflow.*
    Path                /var/log/acns/hubble/events.log
    Read_from_Head      true
    DB                  /var/opt/microsoft/docker-cimprov/state/network_flow.db
    DB.Sync             Off
    Parser              json
    Rotate_Wait         20
    Refresh_Interval    5
    storage.type        filesystem
    Skip_Long_Lines     On
    Ignore_Older        2m # configurable
    Threaded            On

#${NetworkFlowLogsThrottleEnabled}[FILTER]
#${NetworkFlowLogsThrottleEnabled}    Name                throttle
#${NetworkFlowLogsThrottleEnabled}    Alias               oms_networkflow_throttle
#${NetworkFlowLogsThrottleEnabled}    Match               oms.networkflow.*
#${NetworkFlowLogsThrottleEnabled}    Rate                ${NETWORKFLOW_LOGS_THROTTLE_RATE}
#${NetworkFlowLogsThrottleEnabled}    Window              ${NETWORKFLOW_LOGS_THROTTLE_WINDOW}
#${NetworkFlowLogsThrottleEnabled}    Interval            ${NETWORKFLOW_LOGS_THROTTLE_INTERVAL}
#${NetworkFlowLogsThrottleEnabled}    Print_Status        ${NETWORKFLOW_LOGS_THROTTLE_PRINT}

[OUTPUT]
    Name                oms
    Alias               oms_network_flow_output
    EnableTelemetry     true
    TelemetryPushIntervalSeconds 300
    Retry_Limit         10
    Match               oms.networkflow.*
