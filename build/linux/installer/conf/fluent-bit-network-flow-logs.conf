[INPUT]
    Name                tail
    Alias               oms_networkflow_input
    Tag                 oms.networkflow.*
    Path                /var/run/acns/hubble/events.log
    Read_from_Head      true
    DB                  /var/opt/microsoft/docker-cimprov/state/network_flow.db
    DB.Sync             Off
    Parser              json
    Rotate_Wait         20
    Refresh_Interval    5
    storage.type        filesystem
    Skip_Long_Lines     On
    Ignore_Older        2m # configurable

[FILTER]
    Name                throttle
    Alias               oms_networkflow_throttle
    Match               oms.networkflow.*
    Rate                1200
    Window              300
    Interval            1s
    Print_Status        true

[OUTPUT]
    Name                oms
    Alias               oms_network_flow_output
    EnableTelemetry     true
    TelemetryPushIntervalSeconds 300
    Retry_Limit         10
    Match               oms.networkflow.*
