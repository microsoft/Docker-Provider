[INPUT]
    Name                tail
    Alias               network_flow_input
    Tag                 oms.networkflow.*
    Path                /var/run/cilium/hubble/events.log #/var/run/acns/hubble/events.log
    Read_from_Head      true
    DB                  /var/opt/microsoft/docker-cimprov/state/network_flow.db
    DB.Sync             Off
    Parser              json
    # Mem_Buf_Limit       50m
    # Buffer_Chunk_Size   2m # configurable
    # Buffer_Max_Size     8m # configurable
    Rotate_Wait         20
    Refresh_Interval    5
    storage.type        filesystem
    Skip_Long_Lines     On
    Ignore_Older        2m # configurable

#[FILTER]
#    Name              grep
#    Match             network.flow.logs
#    Regex             some_field some_regex_pattern

[OUTPUT]
    Name                oms
    Alias               oms_network_flow_output
    EnableTelemetry     true
    TelemetryPushIntervalSeconds 300
    Retry_Limit         10
    Match               oms.networkflow.*
