[INPUT]
    Name                tail
    Alias               network_flow_input
    Tag                 oms.container.log.networkflow
    Path                /var/run/acns/hubble/events.log
    Read_from_Head      true
    DB                  /var/opt/microsoft/docker-cimprov/state/network_flow.db
    DB.Sync Off
    Parser              json
    Mem_Buf_Limit       1m
    Path_Key            filepath
    # Skip_Long_Lines     On
    Ignore_Older        2m

#[FILTER]
#    Name              grep
#    Match             network.flow.logs
#    Regex             some_field some_regex_pattern

[OUTPUT]
    Name                stdout
    Match               oms.container.log.networkflow

