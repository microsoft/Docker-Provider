# Telegraf config for container-scoped process monitoring (procstat)
# This runs as a 2nd telegraf instance with HOST_PROC=/proc to only see
# processes inside the container, not host processes.

[agent]
  interval = "60s"
  flush_interval = "15s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  quiet = true
  omit_hostname = true

[[outputs.socket_writer]]
  address = "tcp://0.0.0.0:25226"
  data_format = "json"

[[inputs.procstat]]
  name_prefix = "t.azm.ms/"
  exe = "mdsd"
  interval = "60s"
  pid_finder = "native"
  pid_tag = true
  name_override = "agent_telemetry"
  fieldpass = ["cpu_usage", "memory_rss", "memory_swap", "memory_vms", "memory_stack"]
  [inputs.procstat.tags]
    Computer = "placeholder_hostname"
    AgentVersion = "$AGENT_VERSION"
    ControllerType = "$CONTROLLER_TYPE"

