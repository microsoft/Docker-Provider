# Telegraf config for collecting process metrics inside ama-logs containers.

[agent]
  interval = "60s"
  flush_interval = "60s"
  quiet = true
  omit_hostname = true

[[outputs.application_insights]]
  instrumentation_key = "placeholder_appinsights_key"
  [outputs.application_insights.context_tag_sources]
    "ai.cloud.role" = "ControllerType"
    "ai.cloud.roleInstance" = "PodName"

[[inputs.procstat]]
  name_prefix = "t.azm.ms/"
  exe = "fluent-bit"
  interval = "60s"
  pid_finder = "native"
  pid_tag = true
  name_override = "agent_telemetry"
  fieldpass = ["cpu_usage", "memory_rss"]
  [inputs.procstat.tags]
    Computer = "placeholder_hostname"
    PodName = "placeholder_podname"
    AgentVersion = "$AGENT_VERSION"
    ControllerType = "DaemonSet-Windows"
    AksResourceId = "placeholder_aksresourceid"

[[inputs.procstat]]
