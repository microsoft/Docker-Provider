[agent]
  interval = "60s"
  flush_interval = "15s"
  quiet = true
  omit_hostname = true

[[outputs.socket_writer]]
  address = "tcp://0.0.0.0:25229"
  data_format = "json"

[[inputs.procstat]]
  name_prefix = "t.azm.ms/"
  exe = "fluent-bit"
  interval = "60s"
  pid_finder = "native"
  pid_tag = true
  name_override = "agent_telemetry"
  fieldpass = ["cpu_usage", "memory_rss", "memory_swap", "memory_vms", "memory_stack"]
  [inputs.procstat.tags]
    ControllerType = "DaemonSet-Windows"

