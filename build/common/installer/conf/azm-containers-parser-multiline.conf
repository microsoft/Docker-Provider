[PARSER]
    Name         docker
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%L
    Time_Keep    On
    # Command      |  Decoder | Field | Optional Action
    # =============|==================|=================
    # this was updated in 1.4.2 fluent-bit. Whenever upgrading fluent-bit, remember to keep this file in sync with the released parsers.conf file of the corresponding fluent version.
    #Decode_Field_As   escaped    log


[PARSER]
    # http://rubular.com/r/tjUt3Awgg4
    Name cri
    Format regex
    Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep    On

[PARSER]
    Name         json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    On

[MULTILINE_PARSER]
    name          dotnet
    type          regex
    flush_timeout 4000 # milliseconds, set to fluent-bit default https://github.com/fluent/fluent-bit/blob/master/include/fluent-bit/multiline/flb_ml.h#L50
    
    # Regex rules for multiline parsing
    # ---------------------------------
    
    # configuration hints:
    
    #  - first state always has the name: start_state
    #  - every field in the rule must be inside double quotes
    
    # rules |   state name  | regex pattern                  | next state
    # ------|---------------|--------------------------------------------
    rule      "start_state"     "/^( *)(?!at).*Exception.*/"                                                                                                                  "at"
    rule      "at"              "/^( *)at ([._\w\d]*(\.[._\w\d<>]+)?)\.([_\w\d\[\]<>]*)\((([_\w\d]+(\[\]|&|\*)? [_\w\d]+)(, )?)*\)( in .*)?(:line *\d*)?/"                    "at2"
    rule      "at2"             "/^( *)(at .*|--- End of inner exception stack trace ---)/"                                                                                   "at2"

[MULTILINE_PARSER]
    name          azmon_java
    type          regex
    flush_timeout 4000
    # Copy of the fluent-bit built-in "java" parser (src/multiline/flb_ml_parser_java.c); keep in sync when upgrading fluent-bit.
    # Only change: the start rule also matches at end of line. containerd (CRI) log lines have no trailing newline, so a header
    # ending with the exception class (e.g. a bare java.lang.NullPointerException) never matched [:\r\n].
    # It needs its own name because a custom parser named "java" is shadowed by the built-in one.
    rule      "start_state, java_start_exception"   "/(.)(?:Exception|Error|Throwable|V8 errors stack trace)(?:[:\r\n]|$)/"   "java_after_exception"
    rule      "java_after_exception"                "/^[\t ]*nested exception is:[\t ]*/"                                     "java_start_exception"
    rule      "java_after_exception"                "/^[\r\n]*$/"                                                             "java_after_exception"
    rule      "java_after_exception, java"          "/^[\t ]+(?:eval )?at /"                                                  "java"
    rule      "java_after_exception, java"          "/^[\t ]+--- End of inner exception stack trace ---$/"                    "java"
    rule      "java_after_exception, java"          "/^--- End of stack trace from previous location where exception was thrown ---$/"   "java"
    rule      "java_after_exception, java"          "/^[\t ]*(?:Caused by|Suppressed):/"                                      "java_after_exception"
    rule      "java_after_exception, java"          "/^[\t ]*... \d+ (?:more|common frames omitted)/"                         "java"